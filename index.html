      :root {
        --bg-main: #111111; 
        --text-main: #F0F0F0;

        --color-chile: #FF4D7D;       /* Um vermelho mais vibrante */
        --color-argentina: #89C3F5;   /* Um azul um pouco mais claro para destacar no fundo preto */

        --color-analise: #4ADE80; 
        --color-guia: #FDE047;

      }

      body { font-family: 'Inter', sans-serif; background-color: var(--bg-main); color: var(--text-main); }
      h1, h2, h3 { font-family: 'Poppins', sans-serif; }
      
    .article-tag { 
        font-size: 0.65rem; 
        padding: 0.2rem 0.6rem;

         background: rgba(255, 255, 255, 0.15); /* Aumentamos levemente a opacidade do fundo */
        border: 1px solid rgba(255, 255, 255, 0.2); 
        color: #FFFFFF; /* Mudamos de #999 para branco puro para contraste máximo */
        font-weight: 700; 
        text-transform: uppercase; 
    }
      .division-tag { 
        font-size: 0.65rem; 
        padding: 0.2rem 0.6rem; 
        border-radius: 4px; 
        color: #000000; /* Texto preto sobre a etiqueta colorida costuma ter contraste melhor */
        font-weight: 900; /* Peso máximo para legibilidade */
        text-transform: uppercase; 
    }
      
      .article-card { transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1); border: 1px solid rgba(255, 255, 255, 0.05); }

      .banner-bg { position: absolute; inset: 0; background-size: cover; background-position: center 30%; transition: transform 1.5s; }
      
      details summary::-webkit-details-marker { display:none; }
      details[open] summary span:last-child { transform: rotate(45deg); }
    </style>

window.changeLanguage = function(lang) {
    const t = translations[lang] || translations['pt'];
    
    // 1. Atualiza todos os textos que possuem ID correspondente
    Object.keys(t).forEach(id => {
        const el = document.getElementById(id);
        if (el) el.innerText = t[id];
    });

    // 2. Lógica Dinâmica de Links e Imagens
    const bookingCard = document.getElementById('ad-booking');
    const adLink = document.getElementById('ad-link');
    const adImg = document.getElementById('ad-img');

    if (bookingCard && adConfig[lang]) {
        bookingCard.classList.remove('hidden');
        if (adLink) adLink.href = adConfig[lang].link;
        if (adImg) adImg.src = adConfig[lang].img;
    } else if (bookingCard) {
        bookingCard.classList.add('hidden');
    }

    document.documentElement.lang = lang;
    localStorage.setItem('paco_blog_lang', lang);

    // 3. Verificação de Eventos de Idioma (GA4/GTM)
    window.dataLayer = window.dataLayer || [];
    window.dataLayer.push({
     'event': 'language_change',
     'language': lang
    });
};

// Inicialização
document.addEventListener('DOMContentLoaded', () => {
    const savedLang = localStorage.getItem('paco_blog_lang') || 'pt';
    window.changeLanguage(savedLang);
});
