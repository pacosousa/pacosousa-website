                'p1': 'Pablo e eu decidimos, na noite anterior, fazer uma roadtrip meio no impulso. Definimos que alugaríamos um carro em Marbella, no sul da Espanha, e seguiríamos dirigindo até Portugal. No roteiro, o primeiro ponto de parada seria Gibraltar, um lugar que eu tinha muita vontade de conhecer.',
                'h2_1': 'Uma roadtrip improvisada pela Espanha',
                'p2': 'O dia amanheceu ensolarado, algo raro naquele março de 2025 particularmente chuvoso na Costa do Sol espanhola. Alugamos um Fiat 500 com teto conversível, colocamos a música alta e caímos na estrada. O trajeto até Gibraltar foi tranquilo e saímos relativamente cedo.',
                'p3': 'Como Gibraltar é um território britânico, desde o Brexit é necessário passar pela imigração para entrar. Seguimos o caminho mais comum: deixamos o carro estacionado em La Línea de la Concepción, cidade espanhola que faz fronteira com Gibraltar, e atravessamos a pé. Para entrar no território, além da imigração, é preciso cruzar o aeroporto andando, o que por si só já é uma experiência curiosa.',

                'p7': 'Foi quando reparei em uma placa curiosa, informando que era proibido fazer churrascos naquela área. Achei aquilo inusitado e, como tenho o hábito de fotografar placas diferentes, fui lá e tirei uma foto. Já estávamos saindo do local quando, de repente, fomos abordados por dois homens.',

                'p10': 'O policial que conduzira a conversa parecia relativamente calmo. Ele explicou que, além de ser uma área militar, havia desenvolvimento nuclear na região e que, do ponto de vista deles, parecia que eu estava tentando fotografar uma câmera posicionada acima da placa. Disse que, tecnicamente, deveria nos levar até a delegacia, mas que tentaria evitar isso, desde que conseguisse justificar tudo em um relatório. Em seguida, pediu para ver nossos celulares e checar a galeria de fotos, para confirmar se realmente tínhamos perfil de turistas.',
                'p11': 'Tentando manter a calma e torcendo para não haver nenhuma foto comprometedora, continuei respondendo às perguntas, lembrando a mim mesmo que não havíamos feito nada de errado. Depois de vários minutos, o outro policial voltou. O primeiro perguntou se estava tudo tranquilo. A resposta foi um simples "não". Naquele momento, eu gelei.',

                'p7': 'Fue entonces cuando me fijé en un cartel curioso, informando que estaba prohibido hacer barbacoas en esa zona. Me pareció inusual y, como tengo el hábito de fotografiar carteles diferentes, fui allí y saqué una foto. Ya nos estábamos yendo del lugar cuando, de repente, fuimos abordados por dos hombres.',
                'p8': 'Se identificaron como policías y preguntaron si hablábamos inglés. Iban de paisano. Después de responder que sí, uno de ellos preguntó por qué había fotografiado el cartel y explicó que aquella era una zona militar, donde las fotos estaban prohibidas. Expliqué el motivo de la imagen, pero él inició un interrogatorio. Preguntó de dónde éramos, por qué viajábamos juntos y a qué nos dedicábamos. El hecho de que yo fuera brasileño y Pablo argentino claramente no ayudaba a construir una narrativa sencilla.',
                'p9': 'En determinado momento, tuve que explicar cómo nos conocimos, el motivo del viaje e incluso si éramos pareja. Mientras tanto, pidieron nuestros pasaportes, que se llevaron para verificación.',
                'p10': 'El policía que dirigía la conversación parecía relativamente tranquilo. Explicó que, además de ser una zona militar, había desarrollo nuclear en la región y que, desde su punto de vista, parecía que yo estaba intentando fotografiar una cámara posicionada encima del cartel. Dijo que, técnicamente, debería llevarnos a la comisaría, pero que intentaría evitarlo, siempre que pudiera justificar todo en un informe. Luego, pidió ver nuestros teléfonos y revisar la galería de fotos, para confirmar que realmente teníamos perfil de turistas.',
                'p11': 'Intentando mantener la calma y esperando que no hubiera ninguna foto comprometida, continué respondiendo a las preguntas, recordándome a mí mismo que no habíamos hecho nada malo. Después de varios minutos, el otro policía volvió. El primero preguntó si todo estaba tranquilo. La respuesta fue un simplemente "no". En ese momento, me quedé helado.',
                'p12': 'Las preguntas pasaron a estar dirigidas a Pablo. Soy nómada desde hace unos tres años y tengo numerosas entradas y salidas de diferentes países, lo que normalmente hace que la verificación de mi pasaporte sea bastante tranquila. Pablo, por su parte, tenía un visado Work and Holiday alemán, que teóricamente debería garantizar un paso tranquilo por Europa. Aun así, algo levantó dudas durante la verificación.',
                'p13': 'Después de muchas preguntas sobre la vida personal de Pablo, sus pasos recientes y una revisión detallada de nuestros teléfonos, concluyeron que no representábamos ninguna amenaza. Dejaron claro que no estaban felices por tener que rellenar un montón de papeleo en un día tranquilo. Uno de ellos comentó incluso que ya nos estaban vigilando desde que llegamos al puerto, pero que habían ignorado las fotos iniciales por parecer turistas. El foto del cartel, sin embargo, los obligó a actuar.',
                'p14': 'Después de hacernos fotos a nosotros, a los documentos e incluso a la galería de imágenes, además de preguntar cuáles serían nuestros próximos pasos, fuimos finalmente liberados.',
                'h2_4': 'El alivio después del susto',
                'p15': 'Sudando frío y sin las más mínimas ganas de continuar allí, fuimos directos a la frontera. Todavía crucé inmigración con cierto recelo, imaginando que pudiera surgir algún problema adicional, pero afortunadamente todo estaba bien y pudimos regresar a España sin más complicaciones.',
                'p16': 'Seguimos viaje hacia Sevilla, más aliviados por haber escapado del apuro, aunque todavía un poco nerviosos, pensando en el lío en el que todo aquello podría haberse convertido.',
                'related_title': 'Sigue Leyendo',
                'rel_cat1': 'Análisis', 'rel_title1': 'Realidad Argentina',
                'rel_cat2': 'Diario', 'rel_title2': 'Desierto de Atacama',
                'faq_title': 'Preguntas Frecuentes',
                'faq_q1': '¿Es necesario el pasaporte para entrar en Gibraltar?',
                'faq_a1': 'Sí, tras el Brexit, Gibraltar se ha convertido en una frontera externa para quienes vienen de España. Los viajeros brasileños y argentinos necesitan obligatoriamente el pasaporte físico original para cruzar inmigración, aunque vivan en Europa o tengan residencia española. Las tarjetas de residencia o DNI no suelen ser aceptadas para la entrada.',
                'faq_q2': '¿Se puede cruzar la frontera en coche?',
                'faq_a2': 'Sí, es posible cruzar conduciendo, pero las colas suelen ser inmensas y lentas tanto a la entrada como a la salida. La recomendación de la mayoría de los nómadas es dejar el coche aparcado en La Línea de la Concepción (el lado español) y cruzar a pie, lo que es mucho más rápido y permite caminar por la pista del aeropuerto.',
                'faq_q3': '¿Cuál es el idioma oficial y la moneda usada?',
                'faq_a3': 'El idioma oficial es el inglés, pero la mayoría de la población es bilingüe y habla español con fluidez. También existe un dialecto local llamado "Llanito", que mezcla ambos idiomas. La moneda oficial es la Libra de Gibraltar (GIP), que tiene el mismo valor que la Libra Esterlina (GBP). Las tarjetas de crédito internacionales son ampliamente aceptadas.'
            },
            'en': {
                'meta_title': 'Interrogation in Gibraltar | Nomad Diaries',
                'main_title': 'Interrogation in Gibraltar',
                'category_tag': 'Road trip Struggles',
                'author_line': 'By Paco Sousa • 10 min read • Updated on 01/03/2026',
                'p1': 'Pablo and I decided, the night before, to go on a road trip somewhat on a whim. We decided we would rent a car in Marbella, in southern Spain, and continue driving to Portugal. On the route, the first stop would be Gibraltar, a place I really wanted to visit.',
                'h2_1': 'An improvised road trip through Spain',
                'p2': 'The day dawned sunny, something rare in that particularly rainy March of 2025 on the Spanish Costa del Sol. We rented a Fiat 500 with a convertible roof, put the music up loud, and hit the road. The journey to Gibraltar was smooth, and we left relatively early.',
                'p3': 'Since Gibraltar is a British territory, since Brexit, it is necessary to go through immigration to enter. We followed the most common path: we left the car parked in La Línea de la Concepción, a Spanish city that borders Gibraltar, and crossed on foot. To enter the territory, in addition to immigration, you have to cross the airport on foot, which in itself is a curious experience.',
                'h2_2': 'First impressions of Gibraltar',
                'p4': 'Once inside Gibraltar, we began to walk through the streets and observe the surroundings. It was my first time in a place where they drive on the left, which in itself caused a constant sense of strangeness. At one point, I remembered an influencer saying that traveling to Gibraltar reminded her of Rio de Janeiro. The comparison isn\'t perfect, but it makes some sense, as in the middle of the city there is a large rock whose shape vaguely resembles Sugarloaf Mountain.',
                'p5': 'After strolling through the historic center and eating something, we continued walking toward the port area. Until then, everything was going perfectly well.',
                'h2_3': 'The problem at the port of Gibraltar',
                'p6': 'From where we were standing, it was possible to see what appeared to be the African continent. In the distance, we could also see ships entering the famous Strait of Gibraltar. I started taking some photos, trying to capture the moment.',
                'p7': 'That\'s when I noticed a curious sign, stating that barbecues were prohibited in that area. I found that unusual and, as I have the habit of photographing different signs, I went there and took a photo. We were already leaving the place when, suddenly, we were approached by two men.',
                'p8': 'They identified themselves as police officers and asked if we spoke English. They were in plain clothes. After I replied yes, one of them asked why I had photographed the sign and explained that it was a military area where photos were prohibited. I explained the reason for the image, but he initiated an interrogation. He asked where we were from, why we were traveling together, and what we did for a living. The fact that I am Brazilian and Pablo is Argentine clearly did not help build a simple narrative.',
                'p9': 'At one point, I had to explain how we met, the reason for the trip, and even if we were a couple. In the meantime, they asked for our passports, which were taken for checking.',
                'p10': 'The officer who conducted the conversation seemed relatively calm. He explained that, besides being a military area, there was nuclear development in the region and that, from their point of view, it looked like I was trying to photograph a camera positioned above the sign. He said that, technically, he should take us to the police station but that he would try to avoid that, provided he could justify everything in a report. Then, he asked to see our phones and check the photo gallery, to confirm that we really had a tourist profile.',
                'p11': 'Trying to stay calm and hoping there weren\'t any compromising photos, I continued answering the questions, reminding myself that we hadn\'t done anything wrong. After several minutes, the other officer returned. The first one asked if everything was alright. The answer was a simple "no." At that moment, I froze.',
                'p12': 'The questions began to be directed at Pablo. I have been a nomad for about three years and have numerous entries and exits from different countries, which normally makes my passport check quite smooth. Pablo, in turn, had a German Work and Holiday visa, which theoretically should have guaranteed smooth passage through Europe. Still, something raised doubts during the verification.',
                'p13': 'After many questions about Pablo\'s personal life, his recent steps, and a detailed check of our phones, they concluded that we represented no threat. They made it clear that they were not happy about having to fill out a huge amount of paperwork on a quiet day. One of them even commented that he had been watching us since we arrived at the port, but had ignored the initial photos because we looked like tourists. The photo of the sign, however, forced them to act.',
                'p14': 'After taking photos of us, our documents, and even the image gallery, as well as asking what our next steps would be, we were finally released.',
                'h2_4': 'Relief after the scare',
                'p15': 'Sweating cold and with no desire to stay there, we went straight to the border. I still crossed immigration with some concern, imagining that some additional problem might arise, but fortunately everything was fine and we managed to return to Spain without further complications.',
                'p16': 'We continued our journey toward Seville, relieved to have escaped the ordeal, although still a bit nervous thinking about the mess it all could have turned into.',
                'related_title': 'Keep Reading',
                'rel_cat1': 'Analysis', 'rel_title1': 'Argentina Reality',
                'rel_cat2': 'Diary', 'rel_title2': 'Atacama Desert',
                'faq_title': 'Frequently Asked Questions',
                'faq_q1': 'Is a passport required to enter Gibraltar?',
                'faq_a1': 'Yes, after Brexit, Gibraltar has become an external border for those coming from Spain. Brazilian and Argentine travelers must have their original physical passport to cross immigration, even if they live in Europe or have Spanish residency. Residency cards or DNI are usually not accepted for entry.',
                'faq_q2': 'Can you cross the border by car?',
                'faq_a2': 'Yes, it is possible to cross by driving, but queues are usually huge and slow both on entry and exit. The recommendation for most nomads is to leave the car parked in La Línea de la Concepción (the Spanish side) and cross on foot, which is much faster and allows you to walk across the airport runway.',
                'faq_q3': 'What is the official language and currency used?',
                'faq_a3': 'The official language is English, but most of the population is bilingual and speaks Spanish fluently. There is also a local dialect called "Llanito," which is a mix of both languages. The official currency is the Gibraltar Pound (GIP), which has the same value as the British Pound (GBP). International credit cards are widely accepted.'
            }
        };

        window.changeLanguage = function(lang) {
            if (window.updateNavTranslations) window.updateNavTranslations(lang);
            const elements = document.querySelectorAll('[id]');
            elements.forEach(el => {
                const id = el.id;
                if (translations[lang] && translations[lang][id]) {
                    el.innerHTML = translations[lang][id];
                }
            });
            document.documentElement.lang = lang;
            localStorage.setItem('paco_blog_lang', lang);
        };

        window.openLightbox = function(src) {
            const modal = document.getElementById('lightbox-modal');
            const img = document.getElementById('lightbox-img');
            img.src = src;
            modal.style.display = 'flex';
            document.body.style.overflow = 'hidden';
        };

        window.closeLightbox = function() {
            document.getElementById('lightbox-modal').style.display = 'none';
            document.body.style.overflow = 'auto';
        };

        document.addEventListener('DOMContentLoaded', () => {
            const savedLang = localStorage.getItem('paco_blog_lang') || 'pt';
            window.changeLanguage(savedLang);
            document.addEventListener('keydown', (e) => { if (e.key === 'Escape') window.closeLightbox(); });
        });
    </script>
