                'time_jul': 'Mayo a Julio: La Vida en Buenos Aires',
                'text_jul': '<p>Volé directamente de España a Buenos Aires. Después de tantas veces pasando por allí y con el comienzo de año que tuve, ansiaba volver. La vida en la capital argentina no fue exactamente como esperaba, por falta de oportunidad laboral, pero fue de aprendizaje, buenos amigos y mucho desarrollo personal y mucho, mucho frío.</p>',
                'time_out': 'Agosto a Octubre: Berlin Days + Zurich y Roma',

                'time_dez': 'Noviembre y Diciembre: Allá y de Regreso',
                'text_dez': '<p>El fin de año fue prácticamente de descanso, después de 10 meses intensos. El destaque fue el punto principal de mi regreso: ser padrino de bodas de mi amigo! Fue una experiencia linda, casando a un amigo que quiero mucho. Por último, pasé las fiestas de fin de año en Sorocaba. 2025 definitivamente será un año para recordar, el 3º de mi vida nómada.</p>',

            'en': {
                'meta_title': '2025 Wrapped: The Complete Journey | Paco Sousa',

                'time_mar': 'March and April: Rain on the Sun Coast',

        window.changeLanguage = function(lang) {
            if (window.updateNavTranslations) window.updateNavTranslations(lang);
            const elements = document.querySelectorAll('[id]');
            elements.forEach(el => {
                const id = el.id;
                if (translations[lang] && translations[lang][id]) {
                    el.innerHTML = translations[lang][id];
                }
            });
            document.documentElement.lang = lang;
        };

        // Funções do Lightbox
        window.openLightbox = function(src) {
            const modal = document.getElementById('lightbox-modal');
            const img = document.getElementById('lightbox-img');
            img.src = src;
            modal.style.display = 'flex';
            document.body.style.overflow = 'hidden'; // Trava o scroll
        };

        window.closeLightbox = function() {
            const modal = document.getElementById('lightbox-modal');
            modal.style.display = 'none';
            document.body.style.overflow = 'auto'; // Destrava o scroll
        };

        document.addEventListener('DOMContentLoaded', () => {
            window.changeLanguage('pt');
            
            // Adiciona evento de clique em todas as imagens de galeria
            const galleryImages = document.querySelectorAll('.mini-photo img, .wrapped-card img');
            galleryImages.forEach(img => {
                img.addEventListener('click', (e) => {
                    e.stopPropagation();
                    window.openLightbox(img.src);
                });
            });

            // Fecha no ESC
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') window.closeLightbox();
            });
        });
    </script>
