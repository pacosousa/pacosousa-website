    <script>
        const translations = {
            'pt': {
                'meta_title': 'Lugares Gratuitos em Buenos Aires | Diários de um Nômade',
                'main_title': 'Lugares Gratuitos para Visitar em Buenos Aires',
                'category_tag': 'Roteiro de Graça',
                'author_line': 'Por Paco Sousa • 6 min de leitura • Atualizado em 03/01/2026',
                'intro_p': 'Apesar dos altos preços, Buenos Aires ainda oferece uma infinidade de atrações gratuitas ou de baixo custo — perfeitas pra quem quer explorar a cidade com autenticidade, sem esvaziar o bolso. O melhor jeito de montar seu roteiro é dividir os pontos turísticos por região. Neste post, trago os principais lugares gratuitos (ou quase) para visitar, com comentários reais de quem já bateu muita perna por lá.',
                'sec1_title': 'Obelisco e Avenida Corrientes',
                'sec1_p1': 'Uma visita à Argentina quase sempre começa no clássico Obelisco, localizado no cruzamento da Av. 9 de Julio com a Av. Corrientes. É símbolo da cidade, embora muitos argentinos considerem que existam ícones mais representativos. Em frente, há as famosas letras "BA" — dica: evite a fila e tire a foto de um ângulo lateral, enquanto as pessoas estão se revezando. Não é furar fila, é jogo de cintura.',
                'sec1_p2': 'À noite, a Av. Corrientes vira uma mini Broadway portenha, com teatros e fachadas iluminadas. Tem algo nessa região que sempre me lembra pizza e sorvete — talvez seja o clima boêmio ou a fome depois das caminhadas.',
                'sec2_title': 'Teatro Colón',
                'sec2_p1': 'A duas quadras do Obelisco está o belíssimo Teatro Colón, uma das casas de ópera mais importantes do mundo. Eu nunca fiz a visita guiada (é paga), mas amigos que foram disseram que compensa mais comprar ingresso para um espetáculo. A experiência é mais completa e os ingressos começam a partir de valores acessíveis. Só compre com antecedência — esgota rápido.',
                'sec3_title': 'Microcentro e Calle Florida',
                'sec3_p1': 'O coração comercial da cidade. O Microcentro é onde fica a famosa Calle Florida, cheia de lojas, artistas de rua e locais para trocar dinheiro. Cuidado com notas falsas — como no Brasil, dá pra identificar pelas marcas de segurança. A região mistura arquitetura clássica, movimento intenso e bons preços para almoço. Mas atenção: furtos aumentaram nos últimos anos, então vale redobrar os cuidados com pertences.',
                'sec4_title': 'Plaza de Mayo, Catedral e Casa Rosada',
                'sec4_p1': 'A Plaza de Mayo é o marco histórico e político de Buenos Aires. Ali estão a Casa Rosada, sede do governo argentino; a Catedral Metropolitana, onde o Papa Francisco celebrava missas; e o Cabildo, que abriga um museu histórico. Dentro da Catedral está o mausoléu de San Martín, figura central da independência argentina. A cada duas horas ímpares, rola a troca de guarda — e vale assistir.',
                'sec5_title': 'San Telmo',
                'sec5_p1': 'Do lado da Plaza de Mayo, o bairro de San Telmo respira tradição. Aos domingos, a feira de antiguidades toma conta da região — é uma bagunça deliciosa. Tem de tudo: discos, objetos antigos, comida de rua e muito tango. Os destaques são o Mercado de San Telmo e a estátua da Mafalda. Se quiser evitar multidão, visite em outro dia da semana. Eu sempre evito domingo, especialmente pra comer no mercado ou tirar foto com a Mafalda — não tenho paciência pra fila.',
                'sec6_title': 'Puerto Madero',
                'sec6_p1': 'Bairro moderno, elegante e à beira do rio, Puerto Madero é lindo — e caro. A Puente de la Mujer é seu ícone arquitetônico. Minha dica é ir no fim da tarde, caminhar, levar sua própria bebida e aproveitar o pôr do sol. O visual compensa.',
                'sec7_title': 'Recoleta',
                'sec7_p1': 'O principal ponto turístico é o Cemitério da Recoleta, onde está enterrada Evita Perón. Bonito? É. Mas vale mais a pena com guia. A entrada é paga e só aceita cartão. Ao redor tem muita coisa boa e gratuita: o Centro Cultural Recoleta, o Museu Nacional de Belas Artes, a Faculdade de Direito e a famosa Floralis Genérica.',
                'sec8_title': 'Palermo',
                'sec8_p1': 'É o meu bairro favorito, sem dúvida. Palermo é arborizado, jovem e cheio de vida. Nos Bosques de Palermo, você encontra o Rosedal, o Planetário Galileu Galilei, o Parque Ecológico, o Jardim Botânico e o Jardim Japonês (entrada paga). Mais afastado está o MALBA (que abriga o Abaporu). À noite, Palermo ferve: tem muitos bares e baladas, sendo a Praça Serrano em Palermo Soho o ponto principal.',
                'sec9_title': 'La Boca',
                'sec9_p1': 'O bairro La Boca é puro charme. As casas coloridas do Caminito são o cenário clássico da cidade. O La Bombonera, estádio do Boca Juniors, também está lá. Se você ama futebol, uma foto na frente já cumpre o papel. E atenção: casais dançando tango na rua vão te convidar pra foto — que depois será cobrada.',
                'sec10_title': 'Tigre',
                'sec10_p1': 'Tigre é um clássico bate-volta a partir de Buenos Aires. A cidade é famosa pelos passeios de barco no delta do rio. Os passeios básicos são pagos. Já fiz um que incluía almoço e achei furada: comida ruim e preço alto. Melhor almoçar na cidade depois do passeio.',

                'author_line': 'Por Paco Sousa • 6 min de lectura • Actualizado el 03/01/2026',
                'intro_p': 'A pesar de los altos precios, Buenos Aires todavía ofrece una infinidad de atracciones gratuitas o de bajo costo, perfectas para quienes quieren explorar la ciudad con autenticidad sin vaciar el bolsillo. La mejor manera de armar tu itinerario es dividir los puntos turísticos por región. En este post, presento los principales lugares gratuitos (o casi) para visitar, con comentarios reales de quien ya ha caminado mucho por allá.',
                'sec1_title': 'Obelisco y Avenida Corrientes',
                'sec1_p1': 'Una visita a Argentina casi siempre comienza en el clásico Obelisco, ubicado en el cruce de la Av. 9 de Julio con la Av. Corrientes. Es el símbolo de la ciudad, aunque muchos argentinos consideran que existen íconos más representativos. Enfrente están las famosas letras "BA" — consejo: evita la fila y toma la foto desde un ángulo lateral mientras la gente se turna. No es saltarse la fila, es ingenio.',
                'sec1_p2': 'Por la noche, la Av. Corrientes se convierte en una mini Broadway porteña, con teatros y fachadas iluminadas. Hay algo en esta zona que siempre me recuerda a pizza y helado — tal vez sea el clima bohemio o el hambre después de las caminatas.',
                'sec2_title': 'Teatro Colón',
                'sec2_p1': 'A dos cuadras del Obelisco se encuentra el bellísimo Teatro Colón, una de las casas de ópera más importantes del mundo. Nunca hice la visita guiada (es de pago), pero amigos que fueron dijeron que compensa más comprar una entrada para un espectáculo. La experiencia es más completa y las entradas comienzan desde valores accesibles. Solo compra con anticipación — se agotan rápido.',
                'sec3_title': 'Microcentro y Calle Florida',
                'sec3_p1': 'El corazón comercial de la ciudad. El Microcentro es donde se encuentra la famosa Calle Florida, llena de tiendas, artistas callejeros y lugares para cambiar dinero. Cuidado con los billetes falsos — como en Brasil, se pueden identificar por las marcas de seguridad. La zona mezcla arquitectura clásica, movimiento intenso y buenos precios para el almuerzo. Pero atención: los hurtos aumentaron en los últimos años, por lo que vale redoblar los cuidados con las pertenencias.',
                'sec4_title': 'Plaza de Mayo, Catedral y Casa Rosada',
                'sec4_p1': 'La Plaza de Mayo es el hito histórico y político de Buenos Aires. Allí están la Casa Rosada, sede del gobierno argentino; la Catedral Metropolitana, donde el Papa Francisco celebraba misas; y el Cabildo, que alberga un museo histórico. Dentro de la Catedral está el mausoleo de San Martín, figura central de la independencia argentina. Cada dos horas impares, se realiza el cambio de guardia — y vale la pena verlo.',
                'sec5_title': 'San Telmo',
                'sec5_p1': 'Al lado de la Plaza de Mayo, el barrio de San Telmo respira tradición. Los domingos, la feria de antigüedades se apodera de la zona — es un caos delicioso. Hay de todo: discos, objetos antiguos, comida callejera y mucho tango. Los destacados son el Mercado de San Telmo y la estatua de Mafalda. Si quieres evitar multitudes, visita otro día de la semana. Siempre evito los domingos, especialmente para comer en el mercado o tomarse fotos con Mafalda — no tengo paciencia para las filas.',
                'sec6_title': 'Puerto Madero',
                'sec6_p1': 'Barrio moderno, elegante y a orillas del río, Puerto Madero es hermoso — y caro. El Puente de la Mujer es su ícono arquitectónico. Mi consejo es ir al final de la tarde, caminar, llevar tu propia bebida y disfrutar del atardecer. El paisaje lo compensa.',
                'sec7_title': 'Recoleta',
                'sec7_p1': 'El principal punto turístico es el Cementerio de la Recoleta, donde está enterrada Evita Perón. ¿Bonito? Lo es. Pero vale más la pena con guía. La entrada es de pago y solo acepta tarjeta. Alrededor hay muchas cosas buenas y gratuitas: el Centro Cultural Recoleta, el Museo Nacional de Bellas Artes, la Facultad de Derecho y la famosa Floralis Genérica.',
                'sec8_title': 'Palermo',
                'sec8_p1': 'Es mi barrio favorito, sin duda. Palermo es arbolado, joven y lleno de vida. En los Bosques de Palermo, encuentras el Rosedal, el Planetario Galileo Galilei, el Parque Ecológico, el Jardín Botánico y el Jardín Japonés (entrada de pago). Más alejado está el MALBA (que alberga el Abaporu). Por la noche, Palermo hierve: hay muchos bares y discotecas, siendo la Plaza Serrano en Palermo Soho el punto principal.',
                'sec9_title': 'La Boca',
                'sec9_p1': 'El barrio de La Boca es puro encanto. Las casas coloridas de Caminito son el escenario clásico de la ciudad. El La Bombonera, estadio de Boca Juniors, también está allí. Si amas el fútbol, una foto enfrente ya cumple el papel. Y atención: parejas bailando tango en la calle te invitarán para una foto — que luego será cobrada.',
                'sec10_title': 'Tigre',
                'sec10_p1': 'Tigre es una clásica escapada desde Buenos Aires. La ciudad es famosa por los paseos en barco por el delta del río. Los paseos básicos son de pago. Ya hice uno que incluía almuerzo y me pareció un engaño: comida mala y precio alto. Mejor almorzar en la ciudad después del paseo.',

                'meta_title': 'Free Places in Buenos Aires | Nomad Diaries',

                'author_line': 'By Paco Sousa • 6 min read • Updated on 01/03/2026',
                'intro_p': 'Despite the high prices, Buenos Aires still offers a wealth of free or low-cost attractions — perfect for those who want to explore the city authentically without breaking the bank. The best way to build your itinerary is to divide the sights by region. In this post, I bring the main free (or almost free) places to visit, with real comments from someone who has already walked these streets many times.',
                'sec1_title': 'Obelisk and Corrientes Avenue',
                'sec1_p1': 'A visit to Argentina almost always starts at the classic Obelisk, located at the intersection of Av. 9 de Julio and Av. Corrientes. It is the symbol of the city, although many Argentines consider other icons more representative. In front, there are the famous "BA" letters — tip: avoid the line and take the photo from a side angle while people are taking turns. It\'s not cutting the line; it\'s being smart.',
                'sec1_p2': 'At night, Av. Corrientes becomes a mini-Broadway, with theaters and illuminated facades. There\'s something about this area that always reminds me of pizza and ice cream — maybe it\'s the bohemian atmosphere or the hunger after the walks.',
                'sec2_title': 'Teatro Colón',
                'sec2_p1': 'Two blocks from the Obelisk is the beautiful Teatro Colón, one of the most important opera houses in the world. I have never done the guided tour (it\'s paid), but friends who went said it\'s more worth it to buy a ticket for a show. The experience is more complete and tickets start at affordable prices. Just buy in advance — they sell out fast.',
                'sec3_title': 'Microcentro and Calle Florida',
                'sec3_p1': 'The commercial heart of the city. Microcentro is where the famous Calle Florida is located, full of shops, street performers, and places to exchange money. Watch out for counterfeit bills — as in Brazil, they can be identified by security marks. The area mixes classical architecture, intense movement, and good prices for lunch. But beware: thefts have increased in recent years, so it\'s worth taking extra care with belongings.',
                'sec4_title': 'Plaza de Mayo, Cathedral and Casa Rosada',
                'sec4_p1': 'Plaza de Mayo is the historical and political landmark of Buenos Aires. There you will find the Casa Rosada, the seat of the Argentine government; the Metropolitan Cathedral, where Pope Francis used to celebrate masses; and the Cabildo, which houses a historical museum. Inside the Cathedral is San Martín\'s mausoleum, a central figure in Argentine independence. Every two odd hours, the changing of the guard takes place — and it\'s worth watching.',
                'sec5_title': 'San Telmo',
                'sec5_p1': 'Next to Plaza de Mayo, the San Telmo neighborhood breathes tradition. On Sundays, the antiques fair takes over the region — it\'s a delicious mess. There\'s everything: records, vintage objects, street food, and lots of tango. Highlights are the San Telmo Market and the Mafalda statue. If you want to avoid crowds, visit on another day of the week. I always avoid Sunday, especially to eat at the market or take a picture with Mafalda — I don\'t have the patience for lines.',
                'sec6_title': 'Puerto Madero',
                'sec6_p1': 'A modern, elegant neighborhood by the river, Puerto Madero is beautiful — and expensive. The Puente de la Mujer is its architectural icon. My tip is to go in the late afternoon, walk, bring your own drink, and enjoy the sunset. The view makes up for it.',
                'sec7_title': 'Recoleta',
                'sec7_p1': 'The main tourist spot is the Recoleta Cemetery, where Evita Perón is buried. Beautiful? Yes. But it\'s more worth it with a guide. The entrance is paid and only accepts cards. Around it there are many good and free things: the Recoleta Cultural Center, the National Museum of Fine Arts, the Law School, and the famous Floralis Genérica.',
                'sec8_title': 'Palermo',
                'sec8_p1': 'It is my favorite neighborhood, without a doubt. Palermo is wooded, young, and full of life. In the Palermo Woods, you will find the Rosedal, the Galileo Galilei Planetarium, the Ecological Park, the Botanical Garden, and the Japanese Garden (entrance fee). Further away is the MALBA (which houses the Abaporu). At night, Palermo buzzes: there are many bars and clubs, with Plaza Serrano in Palermo Soho being the main spot.',
                'sec9_title': 'La Boca',
                'sec9_p1': 'The La Boca neighborhood is pure charm. The colorful houses of Caminito are the classic scenery of the city. La Bombonera, Boca Juniors\' stadium, is also there. If you love football, a photo in front already does the job. And beware: couples dancing tango on the street will invite you for a photo — which will then be charged.',
                'sec10_title': 'Tigre',
                'sec10_p1': 'Tigre is a classic day trip from Buenos Aires. The city is famous for boat trips on the river delta. Basic trips are paid. I once did one that included lunch and thought it was a scam: bad food and high price. Better to have lunch in the city after the trip.',
                'sec11_title': 'Must-See Extras',
                'sec11_p1': '<strong>Kirchner Cultural Center (CCK):</strong> A giant free cultural building.',
                'sec11_p2': '<strong>Argentine National Congress:</strong> Beautiful architecture.',
                'sec11_p3': '<strong>La Plata:</strong> With the largest cathedral in South America.',
                'conc_title': 'Conclusion',
                'conc_p1': 'You can spend more than a week in Buenos Aires exploring only free places...',
                'summary_title': '📌 Free Buenos Aires Checklist',
                'sum_l1': '• Obelisk and Corrientes (Best at night)',
                'sum_l2': '• Plaza de Mayo and Casa Rosada',
                'sum_l3': '• San Telmo (Mafalda)',
                'sum_l4': '• Palermo (Rosedal)',
                'sum_l5': '• Caminito (Watch out for paid photos)',
                'related_title': 'Keep Reading',
                'rel_cat_1': 'Analysis', 'rel_title_1': 'Argentina Reality 2026',
                'rel_cat_2': 'Reflection', 'rel_title_2': 'The Journey Begins',
                'faq_title': 'Common Questions',
                'faq_q1': 'Best time to visit for free?',
                'faq_a1': 'Spring and autumn are perfect for walking.',
                'faq_q2': 'Is Corrientes safe at night?',
                'faq_a2': 'Yes, it is very busy and bright, but stay alert.'
