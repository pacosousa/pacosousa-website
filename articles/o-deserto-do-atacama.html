    <script>
        const translations = {
            'pt': {
                'meta_title': 'O Deserto do Atacama | Diários de um Nômade',
                'main_title': 'O Deserto do Atacama',
                'category_tag': 'Diário de Bordo',
                'author_line': 'Por Paco Sousa • 12 min de leitura • Atualizado em 03/01/2026',
                'p1': 'O Deserto do Atacama já era, há muito tempo, um destino que eu sonhava em conhecer. Foi curioso porque, quando contei para os meus amigos, a reação foi quase unânime: "é só um deserto, por que não vai para outro lugar?". Pois bem, a experiência no Atacama é simplesmente incrível e, mesmo depois de ter passado por muitos outros destinos, segue firme no ranking dos meus lugares favoritos.',
                'h2_1': 'Chegando a San Pedro de Atacama',
                'p2': 'A cidade base para praticamente todos os passeios é San Pedro de Atacama, um vilarejo com menos de 6 mil habitantes, localizado em um planalto da Cordilheira dos Andes. Para chegar até lá saindo de Santiago, é necessário voar até Calama, a cidade com aeroporto mais próxima.',
                'p3': 'Os voos internos no Chile costumam ter bons preços. Na época, paguei cerca de R$ 250, comprando, como sempre no meu caso, com pouca antecedência. A vista do voo é espetacular, com montanhas por todos os lados e a imensidão do deserto se revelando pouco a pouco.',
                'p4': 'Ao chegar em Calama, é preciso pegar um transfer até San Pedro de Atacama. Comprei na hora mesmo e havia boas opções de horários. Não esperei muito pela van e fui deixado diretamente no hostel.',
                'h2_2': 'Hospedagem em San Pedro de Atacama',
                'p5': 'Há muitas opções de hospedagem na cidade. Fiquei no <a href="https://www.awin1.com/cread.php?awinmid=18120&awinaffid=2730940&ued=https%3A%2F%2Fwww.booking.com%2Fhotel%2Fcl%2Fhostal-talar.pt-br.html" target="_blank" rel="noopener noreferrer" class="text-[#75AADB] hover:underline">Hostel Campo Base</a>, indicação de um amigo que conheci em Santiago. Fui muito bem recebido. O hostel não era grande, mas contava com redes, banheiros, chuveiros, áreas comuns internas e externas, além de café da manhã incluso.',
                'p6': 'Aqui vai um ponto excelente: muitos passeios saem muito cedo, antes mesmo do horário do café. Se você avisa no dia anterior que vai sair cedo, eles preparam um lanche para viagem. Pequeno detalhe, grande diferença. Fiquei, como de costume, em quarto compartilhado. O amigo que eu havia conhecido em Santiago já tinha chegado um dia antes, então foi fácil me enturmar.',
                'p7': 'Um fato curioso dessa viagem ao Atacama é que uma das minhas melhores amizades surgiu lá, e sigo em contato e já reencontrei algumas pessoas daquela época. Foi realmente uma viagem memorável e uma estadia incrível.',
                'h2_3': 'Passeios no Deserto do Atacama: como funciona',
                'p8': 'O grande ponto do Atacama é que existem muitos passeios e a maioria exige sair cedo, já que as atrações ficam relativamente longe. Os tours podem ser de meio período ou de dia inteiro, e você vai ajustando a agenda conforme o tempo e o orçamento permitem.',
                'p9': 'Fechei os passeios já estando no Chile. Muita gente deixa para contratar diretamente em San Pedro de Atacama, pois é comum conseguir descontos. Claro que existe o risco de lotação, mas há muitas agências oferecendo os mesmos roteiros, então sempre dá para negociar.',
                'p10': 'Escolhi uma agência indicada por uma amiga brasileira que tinha ido recentemente. Eles me enviaram um arquivo com todos os passeios disponíveis, preços e detalhes. Depois de acertar tudo, pagando metade antecipado e metade na hora, recebi um cronograma completo. Parecia agenda de trabalho, com horário certinho, roupa indicada e até recomendações do que evitar no dia anterior. Por ser um destino em altitude, algumas pessoas podem sentir os efeitos do mal da altitude. Eu, felizmente, não tive problemas. Em casos assim, é comum o consumo de chá de folha de coca ou algum medicamento específico.',
                'h2_4': 'Clima no Deserto do Atacama',
                'p11': 'Fui em abril. Apesar de ser um deserto e um dos lugares mais secos do mundo, venta bastante. Além disso, a variação de temperatura é grande. Nos Geysers del Tatio, peguei cerca de -5 ºC. Durante o dia, em locais como a Laguna Chaxa, a temperatura passava fácil dos 30 ºC. Vale destacar que o chão de sal reflete muito o sol. Roupa de manga comprida com proteção UV faz bastante diferença.',
                'h2_5': 'Alimentação no Deserto do Atacama',
                'p12': 'Além do café da manhã do hostel, praticamente todas as refeições aconteciam durante os passeios. Nos tours de meio período, sempre havia um café da manhã ou da tarde. Nos de dia inteiro, eram três refeições, incluindo uma parada para almoço, tudo preparado pela equipe, geralmente comendo ali mesmo, perto da van, sentado em alguma pedra.',
                'p13': 'À noite, eu costumava ir à rua principal e procurar restaurantes que servissem menu. Comer fora no Chile é mais caro do que no Brasil, então essa era a melhor opção para economizar. Além disso, costuma ser uma refeição completa, com entrada, prato principal e sobremesa.',
                'h2_6': 'Meu Roteiro de 5 Dias',
                'h3_1': 'Dia 1: Tour Astronômico',
                'p14': 'O único tour noturno fiz logo no primeiro dia, para não perder tempo. Confesso que fui sem grandes expectativas, e talvez por isso tenha se tornado o meu favorito. No tour que fiz, primeiro observamos o céu a olho nu e depois utilizamos telescópios enormes, maiores do que uma pessoa. O guia explica por que o Atacama é um dos melhores lugares do mundo para observação astronómica, mostra constelações, fala sobre a história local e também sobre a visão dos povos andinos. No final, ainda tem comida e uma foto clássica com a Via Láctea ao fundo.',
                'h3_2': 'Dia 2: Piedras Rojas, Lagunas Altiplânicas e Laguna Chaxa',
                'p15': 'No segundo dia, fiz um tour de dia inteiro. Após uma parada para o café, seguimos para Piedras Rojas, onde se tem uma vista impressionante do parque. Caminhamos por trilhas até as Lagunas Altiplânicas, que são belíssimas e rendem fotos incríveis. Em alguns momentos, parece que você está olhando para algo gerado por inteligência artificial. Depois do almoço, visitamos a Laguna Chaxa, um lago salino onde vivem flamingos. É possível observá-los de perto e ver a famosa "dança" que fazem para se alimentar.',
                'h3_3': 'Dia 3: Geysers del Tatio',
                'p16': 'Nesse dia, o despertador toca muito cedo. É preciso chegar antes do sol nascer, e o frio é intenso. Vá bem agasalhado. A boa notícia é que depois dá para deixar as roupas na van para os próximos passeios. Você visita um campo com dezenas de geysers de diferentes tamanhos. É uma experiência única, com tempo suficiente para caminhar pelo local, ouvir sobre a história, entender a formação geológica e a importância da preservação daquela área.',
                'h3_4': 'Dia 4: Laguna Cejar',
                'p17': 'A Laguna Cejar possui uma água extremamente salgada, o que permite flutuar sem esforço. Recomendo a experiência, mas confesso que fui com bastante medo. Não sei flutuar em águas profundas e, antes de entrar, perguntei ao guia se era realmente impossível afundar. Ele respondeu que, se eu conseguisse, iria chamar os cientistas porque eu provavelmente seria um alienígena. De fato, não dá para afundar. Mesmo assim, fiquei com receio. Como a água tem muito sal, não é permitido mergulhar a cabeça nem molhar o cabelo. Eu molhei um pouco e posso confirmar que fica péssimo. É realmente muito sal. A água estava em uma temperatura agradável, apesar do frio do lado de fora.',
                'h3_5': 'Dia 5: Ruta de los Salares',
                'p18': 'Esse foi um passeio de dia inteiro dentro da van, com diversas paradas pelo caminho, chegando perto da fronteira com a Bolívia. Era uma região de muito vento, mas deu para aproveitar bem. O que mais me chamou atenção foram Los Monjes de Pacana, formações rochosas com formatos bastante distintos. O caminho inteiro é um espetáculo visual. O guia, que era local, explicou bastante sobre a história dos povos andinos e também sobre os riscos que os salares enfrentam com a exploração de lítio na região.',
                'h2_7': 'A cidade de San Pedro de Atacama',
                'p19': 'Vale a pena reservar um tempo para caminhar pela cidade, visitar as lojas e conhecer um pouco mais do povoado. Os moradores são muito acolhedores e estão acostumados com brasileiros, então é fácil se virar mesmo sem falar espanhol.',
                'h2_8': 'Vida noturna em San Pedro de Atacama',
                'p20': 'Apesar de a venda de álcool ser proibida depois das 22h e festas oficiais não serem permitidas, San Pedro de Atacama tem uma vida noturna curiosa. Ela me lembrou bastante cidades do interior do Nordeste brasileiro. Dizem que a proibição do álcool advém de um lobby entre empresas de turismo e o governo, já que o consumo em altitude pode prejudicar quem tem passeios no dia seguinte. Na prática, os locais deram um jeito, e existem festas clandestinas. Fui a uma com uma amiga e fomos muito bem recebidos. Na época, eu praticamente não falava espanhol e mesmo assim conseguimos conhecer várias pessoas. Segundo ela, era uma experiência imperdível. Afinal, quando você vai poder dizer de novo que estava bêbado em uma festa clandestina no meio do Deserto do Atacama? Ela tinha um ponto e por isso fomos.',
                'h2_9': 'Outros pontos importantes',
                'li_1': 'Como muitos passeios saem cedo, foi o hostel em que vi mais gente indo dormir muito cedo.',
                'li_2': 'Vale provar a culinária andina. Eles usam muitas especiarias, e para mim o destaque foi a carne de lhama, apesar de ser uma experiência curiosa, já que o animal é visto por todo lado quase como um pet.',
                'li_3': 'O Trópico de Capricórnio atravessa o Atacama. Em alguns passeios é possível fazer uma parada, mas por algum motivo eu não fiz.',
                'p21': 'Depois do Atacama, segui para o início da primeira parte da minha jornada na Argentina. Próxima parada: Ciudad de Salta, mas não sem um perrengue no caminho que envolveu um ônibus quebrado no meio do Deserto do Atacama, já nas Cordilheiras dos Andes.',
                'related_title': 'Continue Lendo',
                'rel_cat1': 'Análise', 'rel_title1': 'Realidade Argentina',
                'rel_cat2': 'Roteiro', 'rel_title2': 'Primeira vez em Santiago',
                'faq_title': 'Dúvidas Frequentes',
                'faq_q1': 'Qual a melhor época para visitar o Atacama?',
                'faq_a1': 'A melhor época para visitar o deserto é durante a meia estação, ou seja, de setembro a novembro ou de março a maio. Nestes períodos, as temperaturas são mais equilibradas, evitando o calor excessivo do verão e as madrugadas gélidas do inverno, facilitando o cumprimento do roteiro de passeios matinais que começam de madrugada.',
                'faq_q2': 'É necessário falar espanhol para se virar em San Pedro?',
                'faq_a2': 'Embora o espanhol seja a língua oficial, San Pedro de Atacama é extremamente turística e está muito habituada ao público brasileiro. Com um "portunhol" básico e paciência, consegues tratar de tudo, desde a contratação de agências até refeições em restaurantes locais. Além disso, muitas agências de tours oferecem guias que falam português ou inglês para facilitar a experiência.'
            },
            'es': {
                'meta_title': 'El Desierto de Atacama | Diarios de un Nómada',
                'main_title': 'El Desierto de Atacama',
                'category_tag': 'Diario de a Bordo',
                'author_line': 'Por Paco Sousa • 12 min de lectura • Actualizado el 03/01/2026',
                'p1': 'El Desierto de Atacama ya era, desde hacía mucho tiempo, un destino que soñaba conocer. Fue curioso porque, cuando se lo conté a mis amigos, la reacción fue casi unánime: "¿es solo un desierto, por qué no vas a otro lugar?". Pues bien, la experiencia en Atacama es simplemente increíble y, aun después de haber pasado por muchos otros destinos, sigue firme en el ranking de mis lugares favoritos.',
                'h2_1': 'Llegando a San Pedro de Atacama',
                'p2': 'La ciudad base para prácticamente todos los tours es San Pedro de Atacama, un pueblo de menos de 6 mil habitantes, ubicado en una meseta de la Cordillera de los Andes. Para llegar allí desde Santiago, es necesario volar a Calama, la ciudad con el aeropuerto más cercano.',
                'p3': 'Los vuelos internos en Chile suelen tener buenos precios. En su momento, pagué cerca de R$ 250, comprando, como siempre en mi caso, con poca antelación. La vista del vuelo es espectacular, con montañas por todos lados y la inmensidad del desierto revelándose poco a poco.',
                'p4': 'Al llegar a Calama, hay que tomar un transfer a San Pedro de Atacama. Lo compré en el momento y había buenas opciones de horarios. No esperé mucho por la camioneta y me dejaron directamente en el hostel.',
                'h2_2': 'Alojamiento en San Pedro de Atacama',
                'p5': 'Hay muchas opciones de alojamiento en la ciudad. Me alojé en el <a href="https://www.awin1.com/cread.php?awinmid=18119&awinaffid=2730940&ued=https%3A%2F%2Fwww.booking.com%2Fhotel%2Fcl%2Fhostal-talar.es-ar.html" target="_blank" rel="noopener noreferrer" class="text-[#75AADB] hover:underline">Hostal Campo Base</a>, recomendación de un amigo que conocí en Santiago. Fui muy bien recibido. El hostel no era grande, pero contaba con hamacas, baños, duchas, áreas comunes internas y externas, además de desayuno incluido.',
                'p6': 'Aquí un punto excelente: muchos tours salen muy temprano, incluso antes del horario del desayuno. Si avisas el día anterior que saldrás temprano, te preparan un refrigerio para el viaje. Pequeño detalle, gran diferencia. Me quedé, como de costumbre, en habitación compartida. El amigo que había conocido en Santiago ya había llegado un día antes, así que fue fácil integrarme.',
                'p7': 'Un hecho curioso de este viaje al Atacama es que una de mis mejores amistades surgió allí, y sigo en contacto y me he reencontrado con algunas personas de aquella época. Fue realmente un viaje memorable y una estadía increíble.',
                'h2_3': 'Tours en el Desierto de Atacama: cómo funciona',
                'p8': 'El gran punto del Atacama es que existen muchos tours y la mayoría exige salir temprano, ya que las atracciones están relativamente lejos. Los tours pueden ser de medio día o día completo, y vas ajustando la agenda según el tiempo y el presupuesto lo permitan.',
                'p9': 'Contraté los tours ya estando en Chile. Mucha gente deja para contratar directamente en San Pedro de Atacama porque es común conseguir descuentos. Claro que existe el riesgo de que se agoten los cupos, pero hay muchas agencias ofreciendo los mismos recorridos, así que siempre se puede negociar.',
                'p10': 'Elegí una agencia indicada por una amiga brasileña que había ido recientemente. Me enviaron un archivo con todos los tours disponibles, precios y detalles. Después de acordar todo, pagando la mitad por adelantado y la mitad en el momento, recibí un cronograma completo. Parecía una agenda de trabajo, con horario exacto, ropa indicada e incluso recomendaciones de qué evitar el día anterior. Por ser un destino de altura, algunas personas pueden sentir los efectos del mal de montaña. Yo, afortunadamente, no tuve problemas. En casos así, es común el consumo de té de hoja de coca o algún medicamento específico.',
                'h2_4': 'Clima en el Desierto de Atacama',
                'p11': 'Fui en abril. Aunque es un desierto y uno de los lugares más secos del mundo, sopla bastante viento. Además, la variación de temperatura es grande. En los Geysers del Tatio, estuve a unos -5 ºC. Durante el día, en lugares como la Laguna Chaxa, la temperatura superaba fácilmente los 30 ºC. Cabe destacar que el suelo de sal refleja mucho el sol. La ropa de manga larga con protección UV marca la diferencia.',
                'h2_5': 'Alimentación en el Desierto de Atacama',
                'p12': 'Además del desayuno en el hostel, prácticamente todas las comidas ocurrían durante los tours. En los de medio día, siempre había un desayuno o merienda. En los de día completo, eran tres comidas, incluyendo una parada para almorzar, todo preparado por el equipo, generalmente comiendo allí mismo, cerca de la camioneta, sentado en alguna piedra.',
                'p13': 'Por la noche, solía ir a la calle principal y buscar restaurantes que sirvieran menú. Comer fuera en Chile es más caro que en Brasil, así que esta era la mejor opción para ahorrar. Además, suele ser una comida completa, con entrada, plato principal y postre.',
                'h2_6': 'Mi Itinerario de 5 Días',
                'h3_1': 'Día 1: Tour Astronómico',
                'p14': 'El único tour nocturno lo hice el primer día, para no perder tiempo. Confieso que fui sin grandes expectativas, y quizás por eso se convirtió en mi favorito. En el tour que hice, primero observamos el cielo a simple vista y luego usamos telescopios enormes, más grandes que una persona. El guía explica por qué Atacama es uno de los mejores lugares del mundo para la observación astronómica, muestra constelaciones, habla sobre la historia local y también sobre la visión de los pueblos andinos. Al final, hay comida y una foto clásica con la Vía Láctea de fondo.',
                'h3_2': 'Día 2: Piedras Rojas, Lagunas Altiplánicas y Laguna Chaxa',
                'p15': 'En el segundo día, hice un tour de día completo. Después de una parada para desayunar, seguimos hacia Piedras Rojas, donde se tiene una vista impresionante del parque. Caminamos por senderos hasta las Lagunas Altiplánicas, que son bellísimas y rinden fotos increíbles. Por momentos, parece que estás mirando algo generado por inteligencia artificial. Después del almuerzo, visitamos la Laguna Chaxa, un lago salino donde viven flamencos. Es posible observarlos de cerca y ver la famosa "danza" que hacen para alimentarse.',
                'h3_3': 'Día 3: Geysers del Tatio',
                'p16': 'Ese día, el despertador suena muy temprano. Hay que llegar antes de que salga el sol, y el frío es intenso. Ve bien abrigado. La buena noticia es que luego puedes dejar la ropa en la camioneta para los siguientes paseos. Visitas un campo con decenas de géiseres de diferentes tamaños. Es una experiencia única, con tiempo suficiente para caminar por el lugar, escuchar la historia, entender la formación geológica y la importancia de la preservación de esa área.',
                'h3_4': 'Día 4: Laguna Cejar',
                'p17': 'La Laguna Cejar tiene agua extremadamente salada, lo que permite flotar sin esfuerzo. Recomiendo la experiencia, pero confieso que fui con bastante miedo. No sé flotar en aguas profundas y, antes de entrar, le pregunté al guía si era realmente imposible hundirse. Me respondió que, si lo lograba, llamaría a los científicos porque probablemente yo sería un alienígena. De hecho, no se puede hundir. Aun así, tuve recelo. Como el agua tiene mucha sal, no está permitido sumergir la cabeza ni mojar el cabello. Yo lo mojé un poco y puedo confirmar que queda pésimo. Es realmente mucha sal. El agua estaba a una temperatura agradable, a pesar del frío exterior.',
                'h3_5': 'Día 5: Ruta de los Salares',
                'p18': 'Este fue un tour de día completo dentro de la camioneta, con diversas paradas en el camino, llegando cerca de la frontera con Bolivia. Era una zona de mucho viento, pero se pudo aprovechar bien. Lo que más me llamó la atención fueron Los Monjes de Pacana, formaciones rocosas con formas muy distintas. Todo el camino es un espectáculo visual. El guía, que era local, explicó mucho sobre la historia de los pueblos andinos y también sobre los riesgos que enfrentan los salares con la exploración de litio en la región.',
                'h2_7': 'La ciudad de San Pedro de Atacama',
                'p19': 'Vale la pena reservar tiempo para caminar por el pueblo, visitar las tiendas y conocer un poco más de la comunidad. Los residentes son muy acogedores y están acostumbrados a los brasileños, así que es fácil manejarse incluso sin hablar español.',
                'h2_8': 'Vida nocturna en San Pedro de Atacama',
                'p20': 'Aunque la venta de alcohol está prohibida después de las 22h y las fiestas oficiales no están permitidas, San Pedro de Atacama tiene una vida nocturna curiosa. Me recordó mucho a ciudades del interior del noreste brasileño. Dicen que la prohibición del alcohol proviene de un lobby entre empresas de turismo y el gobierno, ya que el consumo en altura puede perjudicar a quienes tienen tours al día siguiente. En la práctica, los locales se las ingeniaron y existen fiestas clandestinas. Fui a una con una amiga y nos recibieron muy bien. En esa época, yo prácticamente no hablaba español y aun así pudimos conocer a varias personas. Según ella, era una experiencia imperdible. Al final, ¿cuándo podrás volver a decir que estabas ebrio en una fiesta clandestina en medio del Desierto de Atacama? Ella tenía razón y por eso fuimos.',
                'h2_9': 'Otros puntos importantes',
                'li_1': 'Como muchos tours salen temprano, fue el hostel donde vi a más gente yéndose a dormir muy temprano.',
                'li_2': 'Vale la pena probar la cocina andina. Usan muchas especias, y para mí lo destacado fue la carne de llama, aunque es una experiencia curiosa, ya que el animal se ve por todas partes casi como una mascota.',
                'li_3': 'El Trópico de Capricornio atraviesa el Atacama. En algunos tours es posible hacer una parada, pero por alguna razón no la hice.',
                'p21': 'Después de Atacama, seguí hacia el inicio de la primera parte de mi viaje en Argentina. Próxima parada: Ciudad de Salta, pero no sin un contratiempo en el camino que involucró un autobús averiado en medio del Desierto de Atacama, ya en la Cordillera de los Andes.',
                'related_title': 'Seguir Leyendo',
                'rel_cat1': 'Análisis', 'rel_title1': 'Realidad Argentina',
                'rel_cat2': 'Ruta', 'rel_title2': 'Primera vez en Santiago',
                'faq_title': 'Preguntas Frecuentes',
                'faq_q1': '¿Cuál es la mejor época para visitar el Atacama?',
                'faq_a1': 'La mejor época para visitar el desierto es durante la media estación, es decir, de septiembre a noviembre o de marzo a mayo. En estos períodos, las temperaturas son más equilibradas, evitando el calor excesivo del verano y las madrugadas gélidas del invierno, facilitando el cumplimiento del itinerario de tours matutinos que comienzan de madrugada.',
                'faq_q2': '¿Es necesario hablar español para manejarse en San Pedro?',
                'faq_a2': 'Aunque el español es el idioma oficial, San Pedro de Atacama es sumamente turística y está muy acostumbrada al público brasileño. Con un "portuñol" básico y paciencia, puedes resolver todo, desde contratar agencias hasta las comidas. Además, muchas agencias de tours ofrecen guías que hablan portugués o inglés para facilitar la experiencia.'
            },
            'en': {
                'meta_title': 'The Atacama Desert | Nomad Diaries',
                'main_title': 'The Atacama Desert',
                'category_tag': 'Logbook',
                'author_line': 'By Paco Sousa • 12 min read • Updated on 01/03/2026',
                'p1': 'The Atacama Desert had been, for a long time, a destination I dreamed of visiting. It was curious because when I told my friends, the reaction was almost unanimous: "it\'s just a desert, why not go somewhere else?". Well, the experience in Atacama is simply incredible and, even after passing through many other destinations, it remains firm in the ranking of my favorite places.',
                'h2_1': 'Arriving in San Pedro de Atacama',
                'p2': 'The base city for practically all tours is San Pedro de Atacama, a village with fewer than 6,000 inhabitants, located on a plateau in the Andes Mountains. To get there from Santiago, you need to fly to Calama, the nearest airport city.',
                'p3': 'Domestic flights in Chile usually have good prices. At the time, I paid about R$ 250, buying, as always in my case, with little notice. The flight view is spectacular, with mountains everywhere and the vastness of the desert revealing itself bit by bit.',
                'p4': 'Upon arriving in Calama, you need to take a transfer to San Pedro de Atacama. I bought it on the spot and there were good schedule options. I didn\'t wait long for the van and was dropped off directly at the hostel.',
                'h2_2': 'Accommodation in San Pedro de Atacama',
                'p5': 'There are many accommodation options in the city. I stayed at Hostel Campo Base, a recommendation from a friend I met in Santiago. I was very well received. The hostel wasn\'t big, but it had hammocks, bathrooms, showers, indoor and outdoor common areas, plus breakfast included.',
                'p6': 'Here\'s an excellent point: many tours leave very early, even before breakfast time. If you notify them the day before that you\'re leaving early, they prepare a snack to go. Small detail, big difference. I stayed, as usual, in a shared room. The friend I had met in Santiago had already arrived a day earlier, so it was easy to fit in.',
                'p7': 'A curious fact about this trip to Atacama is that one of my best friendships arose there, and I\'m still in contact and have met some people from that time again. It was truly a memorable trip and an amazing stay.',
                'h2_3': 'Tours in the Atacama Desert: how it works',
                'p8': 'The great point of Atacama is that there are many tours and most require leaving early, as the attractions are relatively far. Tours can be half-day or full-day, and you adjust your schedule as time and budget allow.',
                'p9': 'I booked the tours while already in Chile. Many people leave it to hire directly in San Pedro de Atacama because it\'s common to get discounts. Of course, there is a risk of them being fully booked, but there are many agencies offering the same itineraries, so you can always negotiate.',
                'p10': 'I chose an agency recommended by a Brazilian friend who had recently been there. They sent me a file with all available tours, prices, and details. After settling everything, paying half in advance and half on the spot, I received a complete schedule. It looked like a work agenda, with the exact time, recommended clothing, and even recommendations of what to avoid the day before. Since it\'s a high-altitude destination, some people may feel the effects of altitude sickness. Fortunately, I had no problems. In such cases, it\'s common to consume coca leaf tea or a specific medication.',
                'h2_4': 'Climate in the Atacama Desert',
                'p11': 'I went in April. Although it is a desert and one of the driest places in the world, it is quite windy. Additionally, the temperature variation is large. At Geysers del Tatio, I experienced about -5 ºC. During the day, in places like Laguna Chaxa, the temperature easily passed 30 ºC. It\'s worth noting that the salt ground reflects a lot of sunlight. Long-sleeved clothing with UV protection makes a significant difference.',
                'h2_5': 'Food in the Atacama Desert',
                'p12': 'Besides the hostel breakfast, practically all meals happened during the tours. On half-day tours, there was always a breakfast or afternoon snack. On full-day tours, there were three meals, including a stop for lunch, all prepared by the team, usually eating right there, near the van, sitting on a rock.',
                'p13': 'At night, I used to go to the main street and look for restaurants serving a fixed-price menu. Eating out in Chile is more expensive than in Brazil, so this was the best option to save money. Additionally, it usually consists of a full meal with a starter, main course, and dessert.',
                'h2_6': 'My 5-Day Itinerary',
                'h3_1': 'Day 1: Astronomical Tour',
                'p14': 'The only night tour I did on the first day, so as not to waste time. I confess I went without great expectations, and perhaps that\'s why it became my favorite. On the tour I did, we first observed the sky with the naked eye and then used huge telescopes, larger than a person. The guide explains why Atacama is one of the best places in the world for astronomical observation, shows constellations, talks about local history, and also about the vision of the Andean peoples. At the end, there is food and a classic photo with the Milky Way in the background.',
                'h3_2': 'Day 2: Piedras Rojas, Altiplanic Lagoons, and Chaxa Lagoon',
                'p15': 'On the second day, I did a full-day tour. After a stop for breakfast, we headed to Piedras Rojas, where you have an impressive view of the park. We walked along trails to the Altiplanic Lagoons, which are beautiful and yield amazing photos. At times, it feels like you are looking at something generated by artificial intelligence. After lunch, we visited Laguna Chaxa, a saline lake where flamingos live. You can observe them up close and see the famous "dance" they do to feed.',
                'h3_3': 'Day 3: Geysers del Tatio',
                'p16': 'On this day, the alarm goes off very early. You need to arrive before the sun rises, and the cold is intense. Go well-dressed. The good news is that you can later leave your clothes in the van for the next tours. You visit a field with dozens of geysers of different sizes. It is a unique experience, with enough time to walk around the site, hear about the history, understand the geological formation, and the importance of preserving that area.',
                'h3_4': 'Day 4: Cejar Lagoon',
                'p17': 'Cejar Lagoon has extremely salty water, allowing you to float effortlessly. I recommend the experience, but I confess I went with quite some fear. I don\'t know how to float in deep water, and before entering, I asked the guide if it was truly impossible to sink. He replied that if I succeeded, he would call the scientists because I would probably be an alien. Indeed, you cannot sink. Even so, I was wary. Since the water has a lot of salt, dipping your head or getting your hair wet is not allowed. I got mine a bit wet and I can confirm it feels terrible. It\'s really a lot of salt. The water was at a temperature agreeable, despite the cold outside.',
                'h3_5': 'Day 5: Salt Flats Route',
                'p18': 'This was a full-day van tour with various stops along the way, reaching near the Bolivian border. It was a very windy area, but we were able to enjoy it well. What caught my attention the most were Los Monjes de Pacana, rock formations with very distinct shapes. The entire way is a visual spectacle. The guide, who was a local, explained a lot about the history of the Andean peoples and also about the risks the salt flats face with lithium exploration in the region.',
                'h2_7': 'The town of San Pedro de Atacama',
                'p19': 'It\'s worth setting aside time to walk through the town, visit the shops, and get to know the village a bit more. The residents are very welcoming and are used to Brazilians, so it\'s easy to get by even without speaking Spanish.',
                'h2_8': 'Nightlife in San Pedro de Atacama',
                'p20': 'Although the sale of alcohol is prohibited after 10 PM and official parties are not allowed, San Pedro de Atacama has a curious nightlife. It reminded me a lot of cities in the interior of the Brazilian Northeast. They say the alcohol ban stems from a lobby between tourism companies and the government, since consumption at altitude can harm those who have tours the next day. In practice, the locals found a way, and there are underground parties. I went to one with a friend and we were very well received. At the time, I practically spoke no Spanish and yet we were able to meet several people. According to her, it was an unmissable experience. After all, when will you be able to say again that you were drunk at an underground party in the middle of the Atacama Desert? She had a point, so we went.',
                'h2_9': 'Other important points',
                'li_1': 'Since many tours leave early, it was the hostel where I saw the most people going to sleep very early.',
                'li_2': 'It\'s worth trying Andean cuisine. They use many spices, and for me, the highlight was llama meat, although it\'s a curious experience since the animal is seen everywhere almost as a pet.',
                'li_3': 'The Tropic of Capricorn crosses the Atacama. On some tours, it is possible to make a stop, but for some reason, I didn\'t.',
                'p21': 'After Atacama, I continued to the start of the first part of my journey in Argentina. Next stop: Salta City, but not without a setback on the way that involved a broken-down bus in the middle of the Atacama Desert, already in the Andes Mountains.',
                'related_title': 'Keep Reading',
                'rel_cat1': 'Analysis', 'rel_title1': 'Argentina Reality',
                'rel_cat2': 'Itinerary', 'rel_title2': 'First time in Santiago',
                'faq_title': 'Frequently Asked Questions',
                'faq_q1': 'What is the best time to visit Atacama?',
                'faq_a1': 'The best time to visit the desert is during the shoulder seasons, from September to November or from March to May. During these periods, temperatures are more balanced, avoiding the extreme heat of summer and the freezing nights of winter, making it easier to follow the early morning tour schedule which starts before dawn.',
                'faq_q2': 'Is it necessary to speak Spanish in San Pedro?',
                'faq_a2': 'While Spanish is the official language, San Pedro de Atacama is extremely tourist-friendly and very accustomed to Brazilian visitors. With basic "Portunhol" and patience, you can manage everything from booking agencies to meals at local restaurants. Additionally, many tour agencies offer guides who speak Portuguese or English to make the experience easier.'
            }

                }
            });
            document.documentElement.lang = lang;
            localStorage.setItem('paco_blog_lang', lang);
        };

        window.openLightbox = function(src) {
            const modal = document.getElementById('lightbox-modal');
            const img = document.getElementById('lightbox-img');
            img.src = src;
            modal.style.display = 'flex';
            document.body.style.overflow = 'hidden';
        };

        window.closeLightbox = function() {
            document.getElementById('lightbox-modal').style.display = 'none';
            document.body.style.overflow = 'auto';
        };

        document.addEventListener('DOMContentLoaded', () => {
            const savedLang = localStorage.getItem('paco_blog_lang') || 'pt';
            window.changeLanguage(savedLang);
            document.addEventListener('keydown', (e) => { if (e.key === 'Escape') window.closeLightbox(); });
        });
    </script>
</body>
</html>
