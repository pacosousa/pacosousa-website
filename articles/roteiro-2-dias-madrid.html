    <script>
        let currentImgIndex = 0;
        let imagesList = [];

        function updateImagesList() {
            const galleryImgs = document.querySelectorAll('.mini-photo img');
            imagesList = Array.from(galleryImgs).map(img => img.src);
        }

        function openLightbox(src) {
            updateImagesList();
            currentImgIndex = imagesList.indexOf(src);
            if (currentImgIndex === -1) currentImgIndex = 0;
            showImage();
            document.getElementById('lightbox-modal').style.display = 'flex';
            document.addEventListener('keydown', handleKeyDown);
        }

        function closeLightbox() {
            document.getElementById('lightbox-modal').style.display = 'none';
            document.removeEventListener('keydown', handleKeyDown);
        }

        function showImage() {
            const img = document.getElementById('lightbox-img');
            const counter = document.getElementById('lightbox-counter');
            img.src = imagesList[currentImgIndex];
            counter.innerText = `${currentImgIndex + 1} / ${imagesList.length}`;
        }

        function nextImage(e) {
            if (e) e.stopPropagation();
            currentImgIndex = (currentImgIndex + 1) % imagesList.length;
            showImage();
        }

        function prevImage(e) {
            if (e) e.stopPropagation();
            currentImgIndex = (currentImgIndex - 1 + imagesList.length) % imagesList.length;
            showImage();
        }

        function handleKeyDown(e) {
            if (e.key === "ArrowRight") nextImage();
            if (e.key === "ArrowLeft") prevImage();
            if (e.key === "Escape") closeLightbox();
        }

        const adConfig = {
            'pt': { link: "https://www.awin1.com/cread.php?s=4655925&v=18120&q=593889&r=2730940", img: "../images/booking-banner-pt.jpg" },

                'main_title': 'Roteiro de 2 dias em Madrid',

                'diary_date': 'Madrid, Espanha. 23 de abril de 2024.',
                'category_tag': 'Espanha',
                'p1': 'Bom, eu simplesmente fiz as contas errado. Eu já estava a caminho de Madrid quando percebi que havia reservado apenas uma noite de hospedagem na cidade. Mas, cá entre nós, eu já retornei depois para Madrid e não fiz muita coisa além do que já havia feito dessa vez.',
                'p2': 'Após um longo ônibus noturno, cheguei bem cedo à capital espanhola. Fiz o trajeto da Rodoviária de Madrid até o hostel de metrô. O sistema de transporte público de Madrid é bem organizado, e é possível comprar o ticket diário em máquinas próximas às catracas. Já aproveitei e comprei o ticket de dois dias.',
                'p3': 'Minha hospedagem foi no Hostel Room007 Chueca. Chueca é uma região muito boa para se hospedar em Madrid. Além de ser um bairro seguro, é possível ir caminhando até a Puerta del Sol, a principal praça da cidade. Para quem se interessa, também é um bairro bastante LGBT.',
                'p4': 'Deixei minhas coisas no locker do hostel e fui explorar a cidade. Infelizmente, não havia opção de tomar banho antes do check-in, já que os chuveiros ficam dentro dos quartos.',
                'h2_1': 'Free walking tour: Madrid de los Borbones',
                'p5': 'Basicamente, os tours históricos em Madrid se dividem entre a Madrid dos Austrias, dos séculos XVI e XVII, e a Madrid dos Borbones, a partir do século XVIII, refletindo a evolução histórica e monumental da capital espanhola.',
                'p6': 'Não que eu soubesse disso antes de escolher o walking tour. Escolhi simplesmente o que tinha vaga e ficava mais próximo. O tour Madrid de los Borbones aborda a transformação urbana e monumental da cidade a partir do século XVIII, impulsionada pela dinastia Bourbon, iniciada por Felipe V, com grande destaque para o reinado de Carlos III.',
                'p7': 'O tour passa pelos principais pontos centrais da cidade. Eu fiz o tour em espanhol, mas é fácil encontrar opções também em português.',
                'p8': 'Um detalhe importante: apesar do nome, esses walking tours nunca são realmente gratuitos. No final, você deve fazer uma contribuição considerada voluntária. No tour que reservei pelo Civitatis, a guia informou que a plataforma cobrava cerca de 8 euros por pessoa, valor que deveria ser o mínimo de contribuição. Não acho errado cobrar pelo tour, mas talvez já pudessem tirar o “free” do nome.',
                'p9': 'O tour começou na Puerta del Sol, passando pela Plaza Mayor, uma praça enorme e muito famosa de Madrid. Durante o trajeto, a guia explica bastante sobre a história da cidade. Um ponto curioso é que Madrid reconhece oficialmente os comércios que permanecem abertos, com o mesmo nome e produto, há mais de 100 anos. É possível ver uma condecoração em frente ao estabelecimento.',
                'p10': 'Saindo da Plaza Mayor, o tour segue pelas ruas do centro, com parada no Mercado de San Miguel, e depois continua pelas ruas estreitas até a Catedral de la Almudena e o Palácio Real, finalizando na Plaza de Oriente, em frente ao Monumento a Filipe IV.',
                'h2_2': 'Explorando Madrid por conta própria',
                'p11': 'O Palácio Real não estava aberto para visitação naquele dia, e eu também não estava muito a fim de gastar para visitar a catedral. Depois do tour, segui explorando a região com mais calma, caminhando pelos Jardins de Sabatini.',
                'p12': 'Como eu já tinha o ticket de transporte, fui até a Puerta de Alcalá, que seria o “Arco do Triunfo” de Madrid. Não achei tão impressionante. Como ainda havia tempo antes do check-in, resolvi visitar um museu.',
                'sh1': 'Museu do Romantismo',
                'p13': 'Localizado em uma mansão do século XVIII, o Museo del Romanticismo possui exposições de pinturas e mobiliário do período romântico. Estava bem vazio, o que tornou a visita interessante para observar os detalhes da época. Não recomendaria como primeira opção de museu em Madrid, mas, se você estiver com tempo sobrando, vale a visita.',
                'h2_3': 'Vida noturna madrilenha',
                'p14': 'Sinceramente, um dos melhores pontos de Madrid é a sua vida noturna. Os espanhóis têm hábitos noturnos bem marcados e uma forte cultura de sair para beber, inclusive durante a semana. Mesmo sendo uma terça-feira, não foi difícil encontrar bares com happy hour e bastante movimento.',
                'p15': 'Não costumo ir a bares sozinho, mas a experiência foi interessante e consegui socializar com algumas pessoas. Como já mencionei, a região de Chueca é excelente para encontrar bares LGBT, e me impressionou que, à 1h da manhã, as ruas ainda estivessem lotadas.',
                'p16': 'Voltei caminhando para o hostel sem grandes preocupações com segurança. Talvez eu tenha sido um pouco confiante demais, mas não senti nenhum problema. Havia muita gente circulando pelas ruas.',
                'h2_4': 'Desisti do Museu do Prado',
                'p17': 'Como já deu para perceber, eu não tinha programado muita coisa. O que me chocou foi que, ao contrário de mim, muita gente tinha se programado. Quando cheguei ao Museu do Prado, as filas estavam quilométricas.',
                'p18': 'Meu trem saía à tarde e, mesmo que houvesse a possibilidade de entrar, decidi desistir da visita e passear mais um pouco pelo centro. Ainda assim, quero muito visitar o museu em outra oportunidade. O Prado abriga obras clássicas famosas, como Las Meninas, de Velázquez, e Saturno devorando um filho, de Goya.',
                'h2_5': 'Chocolatería San Ginés',
                'p19': 'A Chocolatería San Ginés é um dos pontos mais famosos de Madrid e, mesmo assim, eu sempre indico para quem está indo à cidade, só para garantir que a pessoa saiba da existência.',
                'p20': 'Fundada em 1894, a chocolateria serve um chocolate quente excelente, que pode ser acompanhado por churros ou pela melhor piada para qualquer brasileiro: uma porção de porras.',

                'h2_6': 'Trem de Madrid para Barcelona',
                'p23': 'Por fim, voltei ao hostel para buscar minhas coisas e segui para a estação de trem. O trajeto entre Madrid e Barcelona é bastante comum. A viagem de trem de alta velocidade leva entre 2h30 e 2h50.',
                'p24': 'Uma das vantagens do trem é não precisar chegar com tanta antecedência. O embarque costuma começar cerca de 15 minutos antes. Comprei meu ticket pelo aplicativo Trainline, que é uma ótima opção para encontrar trens baratos pela Europa.',
                'p25': 'Lembra que eu havia me confundido com a reserva do hostel? Enquanto reservei o hostel por apenas uma noite, acabei comprando o trem para dois dias depois. Só descobri quando o QR Code não passou na catraca de embarque. Depois de uma olhada feia para mim, o atendente informou que a data estava errada.',
                'p26': 'Por sorte, o ticket permitia cancelamento grátis até 24 horas antes. Consegui cancelar e comprar um novo, que felizmente não estava muito mais caro naquele momento.',

                'h2_7': 'Outros lugares para visitar em Madrid',
                'p28': 'Apesar de ter explorado bastante o centro, vários pontos turísticos famosos de Madrid ficaram de fora desse roteiro curto. Alguns deles são:',

                'p36': 'Madrid é uma cidade que funciona bem tanto para visitas rápidas quanto para estadias mais longas, e certamente ficou com vários motivos para uma próxima volta.',

                'p1': 'Bueno, simplemente hice mal las cuentas. Ya iba camino a Madrid cuando me di cuenta de que había reservado solo una noche de alojamiento en la ciudad. Pero, siendo sincero, ya regresé a Madrid después y no hice muchas cosas más allá de lo que hice esta vez.',

                'p9': 'El recorrido comenzó en la Puerta del Sol, pasando por la Plaza Mayor, una plaza enorme y muy famosa de Madrid. Durante el trayecto, la guía explica bastante sobre la historia de la ciudad. Un dato curioso es que Madrid reconoce oficialmente a los comercios que permanecen abiertos, con el mesmo nombre y producto, durante más de 100 años. Es posible ver una condecoración frente al local.',
                'p10': 'Saliendo de la Plaza Mayor, el tour continúa por las calles del centro, con una parada en el Mercado de San Miguel, y luego sigue por calles estrechas hasta la Catedral de la Almudena y el Palacio Real, finalizando en la Plaza de Oriente, frente al Monumento a Felipe IV.',

                'p12': 'Como ya tenía el billete de transporte, fui hasta la Puerta de Alcalá, que vendría a ser el “Arco del Triunfo” de Madrid. No me pareció tan impresionante. Como aún tenía tiempo antes del check-in, decidí visitar un museo.',
                'sh1': 'Museo del Romanticismo',

                'p15': 'No suelo ir solo a bares, pero la experiencia fue interesante y pude socializar con algunas personas. Como ya mencioné, la zona de Chueca es excelente para encontrar bares LGBT, y me sorprendió que, a la 1 de la madrugada, las calles aún estuvieran llenas de gente.',

                'p18': 'Mi tren salía por la tarde y, aunque existía la posibilidad de entrar, decidí renunciar a la visita y pasear un poco más por el centro. Aun así, tengo muchas ganas de visitar el museo en otra ocasión. El Prado alberga obras clásicas muy famosas, como Las Meninas, de Velázquez, y Saturno devorando a su hijo, de Goya.',

                'p24': 'Una de las ventajas del tren es que no es necesario llegar con mucha antelación. El embarque suele comenzar unos 15 minutos antes. Compré mi billete a través de la aplicación Trainline, que es una excelente opción para encontrar trenes baratos por Europa.',
                'p25': '¿Recuerdas que me había confundido con la reserva del hostel? Pues bien, mientras reservé el hostel por solo una noche, compré el tren para dos días después. Solo lo descubrí cuando el código QR no pasó en el control de embarque. Tras una mirada poco amable, el empleado me informó que la fecha era incorrecta.',
                'p26': 'Por suerte, el billete permitió cancelación gratuita hasta 24 horas antes. Pude cancelar y comprar uno nuevo, que afortunadamente no tenía un precio muy diferente en ese momento.',

                'h2_7': 'Otros lugares para visitar en Madrid',
                'p28': 'A pesar de haber explorado bastante el centro, varios puntos turísticos famosos de Madrid quedaron fuera de este itinerario corto. Algunos de ellos son:',

            'en': {
                'main_title': '2-Day Itinerary in Madrid',
                'author_line': 'Paco Sousa • 10 min read • Written on April 23, 2024',
                'diary_date': 'Madrid, Spain. April 23, 2024.',
                'category_tag': 'Spain',
                'p1': 'Well, I simply miscalculated. I was already on my way to Madrid when I realized I had booked only one night of accommodation in the city. But honestly, I later returned to Madrid and did not do much more than what I managed to do this time.',
                'p2': 'After a long overnight bus ride, I arrived very early in the Spanish capital. I went from Madrid’s bus station to the hostel by metro. Madrid’s public transportation system is very well organized, and it is possible to buy a daily ticket at machines near the turnstiles. I went ahead and bought a two-day ticket.',
                'p3': 'I stayed at Hostel Room007 Chueca. Chueca is a great area to stay in Madrid. Besides being a safe neighborhood, it is possible to walk to Puerta del Sol, the city’s main square. For those who are interested, it is also a very LGBT-friendly area.',
                'p4': 'I left my belongings in the hostel locker and went out to explore the city. Unfortunately, there was no option to shower before check-in, since the showers are located inside the rooms.',
                'h2_1': 'Free walking tour: Madrid of the Bourbons',
                'p5': 'Basically, historical tours in Madrid are divided between the Madrid of the Austrias, from the 16th and 17th centuries, and the Madrid of the Bourbons, starting in the 18th century. This reflects the historical and monumental evolution of the Spanish capital.',
                'p6': 'It is not that I knew this before choosing the walking tour. I simply picked the one that had availability and was closest. The Madrid of the Bourbons tour focuses on the urban and monumental transformation of the city from the 18th century onward, driven by the Bourbon dynasty, initiated by Philip V, with particular emphasis on the reign of Charles III.',
                'p7': 'The tour covers the main central landmarks of the city. I took the tour in Spanish, but it is easy to find options in Portuguese as well.',
                'p8': 'One important detail: despite the name, these walking tours are never truly free. At the end, you are expected to make a contribution considered voluntary. On the tour I booked through Civitatis, the guide explained that the platform charged around 8 euros per person, which should be the minimum contribution. I do not think charging for the tour is wrong, but they could probably drop the word “free” from the name.',
                'p9': 'The tour started at Puerta del Sol, passing through Plaza Mayor, a huge and very famous square in Madrid. Along the way, the guide explains a lot about the city’s history. An interesting fact is that Madrid officially recognizes businesses that have remained open, with the same name and product, for more than 100 years. You can see a plaque in front of these establishments.',
                'p10': 'Leaving Plaza Mayor, the tour continues through the streets of central Madrid, with a stop at the Mercado de San Miguel, and then follows narrow streets to the Almudena Cathedral and the Royal Palace, finishing at Plaza de Oriente, in front of the Monument to Philip IV.',
                'h2_2': 'Exploring Madrid on my own',
                'p11': 'The Royal Palace was not open for visits that day, and I was also not very interested in spending money to visit the cathedral. After the tour, I continued exploring the area at a slower pace, walking through the Sabatini Gardens.',
                'p12': 'Since I already had the transportation ticket, I made my way to the Puerta de Alcalá, which would be Madrid’s version of a triumphal arch. I did not find it particularly impressive. As I still had time before check-in, I decided to visit a museum.',
                'sh1': 'Museum of Romanticism',
                'p13': 'Located in an 18th-century mansion, the Museum of Romanticism features exhibitions of paintings and furniture from the Romantic period. It was quite empty, which made the visit interesting for observing the details of the era. I would not recommend it as a first museum to visit in Madrid, but if you have extra time, it is worth checking out.',
                'h2_3': 'Madrid nightlife',
                'p14': 'Honestly, one of the best things about Madrid is its nightlife. Spaniards have very strong nighttime habits and a solid culture of going out for drinks, even during the week. Even though it was a Tuesday, it was not difficult to find bars with happy hour deals and plenty of people around.',
                'p15': 'I do not usually go to bars alone, but the experience was interesting and I managed to socialize with some people. As mentioned before, the Chueca area is great for LGBT bars, and I was surprised to see that at 1 a.m. the streets were still packed.',
                'p16': 'I walked back to the hostel without worrying too much about safety. Maybe I was a bit too confident, but I did not feel any issues. There were plenty of people out on the streets.',
                'h2_4': 'Skipping the Prado Museum',
                'p17': 'As it is already clear, I had not planned much in advance. What surprised me was that, unlike me, many people had planned their visit. When I arrived at the Prado Museum, the lines were extremely long.',
                'p18': 'My train was leaving in the afternoon, and even though there was a chance I could get in, I decided to skip the museum and walk around the city center a bit more. Still, I really want to visit the museum someday. The Prado houses very famous classical works, such as Las Meninas by Velázquez and Saturn Devouring His Son by Goya.',
                'h2_5': 'Chocolatería San Ginés',
                'p19': 'The Chocolatería San Ginés is one of the most famous spots in Madrid, and even so, I always recommend it to anyone who tells me they are going to the city, just to make sure they know it exists.',
                'p20': 'Founded in 1894, the chocolatería serves an excellent hot chocolate, which can be paired with churros or with what is probably the best joke for any Brazilian: a portion of porras.',
                'p21': 'For context, churros are thin, ridged, and crunchy, while porras are much thicker, soft, and fluffy on the inside.',
                'p22': 'Because it is so famous, the place is usually very crowded. My tip is to visit the classic location to see it and then head to the newer one, located on the corner next to the original. The quality and prices are the same.',
                'h2_6': 'Train from Madrid to Barcelona',
                'p23': 'Finally, I returned to the hostel to pick up my things and headed to the train station. The route between Madrid and Barcelona is very common. The high-speed train journey takes between 2 hours and 30 minutes and 2 hours and 50 minutes.',
                'p24': 'One of the advantages of traveling by train is that you do not need to arrive very early. Boarding usually starts about 15 minutes before departure. I bought my ticket using the Trainline app, which is a great option for finding cheap trains across Europe.',
                'p25': 'Remember when I mentioned I had messed up the hostel booking? Well, while I booked the hostel for only one night, I ended up booking the train for two days later. I only found out when the QR code did not work at boarding. After giving me a disapproving look, the staff member informed me that the date was wrong.',
                'p26': 'Luckily, my ticket allowed free cancellation up to 24 hours in advance. I was able to cancel it and buy a new one, which fortunately was not much more expensive at that moment.',
                'p27': 'Problem solved, I boarded the train heading to Barcelona and on to the next adventures.',
                'h2_7': 'Other places to visit in Madrid',
                'p28': 'Even though I explored much of the city center, several famous tourist attractions in Madrid did not make it into this short itinerary. Some of them include:',
                'p29': '<strong>Retiro Park</strong>, the city\'s main park and a great place for a relaxed walk',
                'p30': '<strong>Reina Sofía Museum</strong>, home to Picasso\'s Guernica',
                'p31': '<strong>Thyssen-Bornemisza Museum</strong>, completing the Art Triangle',
                'p32': '<strong>Gran Vía</strong>, one of Madrid\'s most iconic avenues, full of shops, theaters and cinemas',
                'p33': '<strong>Temple of Debod</strong>, an open-air Egyptian temple, very popular for watching the sunset',
                'p34': '<strong>Santiago Bernabéu Stadium</strong>, for those interested in football and Real Madrid',
                'p35': '<strong>Malasaña</strong>, an alternative neighborhood known for its cultural scene and cool bars',
                'p36': 'Madrid works equally well for short visits or longer stays, and there were clearly many reasons left for a return trip.',
                'related_title': 'Read also',

            });
            const bookingCard = document.getElementById('ad-booking');
            const adLink = document.getElementById('ad-link');
            const adImg = document.getElementById('ad-img');
            if (bookingCard) {
                if (lang === 'en') {
                    bookingCard.classList.add('hidden');
                } else if (adConfig[lang]) {
                    bookingCard.classList.remove('hidden');
                    if (adLink) adLink.href = adConfig[lang].link;
                    if (adImg) adImg.src = adConfig[lang].img;
                } else {
                    bookingCard.classList.add('hidden');
                }
            }
            document.documentElement.lang = lang;
            localStorage.setItem('paco_blog_lang', lang);
        };

        document.addEventListener('DOMContentLoaded', () => {
            const savedLang = localStorage.getItem('paco_blog_lang') || 'pt';
            window.changeLanguage(savedLang);
        });
    </script>
</body>
</html>
