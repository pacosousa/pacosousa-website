                'p2': 'Nota: Este relato fue revisado y actualizado para septiembre de 2025 basado en información turística actual.',
                'h2_1': 'Llegando a la ciudad',
                'p3': 'En general, estoy totalmente en contra de gastar fortunas en Uber para salir del aeropuerto y esta vez no fue diferente. Sabía que era distante y busqué opciones más baratas para llegar a mi hostel. El transporte público en Santiago es eficiente, y tomar un autobús o transfer compartido es una excelente forma de ahorrar. Existen opciones como TurBus o Centropuerto que te llevan directo al centro de la ciudad por un precio muy accesible.',
                'p4': 'En aquella época, yo no hablaba nada de español, pero no fue muy difícil con mímica y un buen traductor. Hoy en día, con ChatGPT, es mucho más fácil. En aquel entonces, recurrí a Google Translate.',
                'p5': 'Me alojé en el Hostel Providencia. Aparentemente, en Santiago, es la mejor opción. Este es el tipo de hostel que más amo: aquel donde te sientas en una mesa en el área común y siempre hay gente con ganas de conocer personas nuevas. Conocí gente estupenda en el hostel que fue buena compañía durante el resto del viaje. Algunos también iban al Atacama y nos reencontramos allí, pero eso ya es otra historia.',
                'p6': 'Mi mayor consejo para quienes quieren socializar es este: quedarse en un hostel con buena reputación. ¡La red de hostels de Santiago es genial y siempre encontrarás a alguien para compartir paseos o una cerveza!',
                'h2_2': 'Atracciones en Santiago',
                'p7': 'Con solo 4 días para explorar, tuve que ser estratégico. Lamentablemente, llegué un Sábado de Gloria y todo estaba cerrado, además de haber olvidado la regla mundial: los museos cierran los lunes. Con eso en mente, aquí lo que pude aprovechar de mi corto viaje en Santiago.',
                'h3_1': 'Walking tour en el Centro Histórico',
                'p8': 'Soy extremadamente fiel a la cultura del walking tour. Me parece una forma muy buena de conocer la ciudad y entender la historia. En ciudades como Santiago y Buenos Aires, es muy fácil encontrar un tour en portugués o inglés. Comencé mi jornada con un tour por el centro histórico, pasando por los principales puntos turísticos. Es genial ver la historia de la ciudad desde el punto de vista de un local, entendiendo el motivo de cada sitio y cómo se formó la ciudad.',
                'h3_2': 'Subida al Cerro San Cristóbal',
                'p9': 'Como todos los museos estaban cerrados, fui a explorar partes de la ciudad e hice el camino hasta llegar a donde se encuentra el Cerro San Cristóbal. Tras una fila de espera, subí en el funicular hacia esta colina, desde donde se tiene una gran vista de toda la ciudad. En septiembre de 2025, el precio para subir y bajar vía Funicular o Teleférico es de aproximadamente 4.000 CLP (R$ 22,00) para adultos en días de semana y 4.800 CLP (R$ 26,00) los fines de semana y festivos.',
                'p10': 'El teleférico estaba desactivado durante mi visita de lunes, una pena, pues te quita una parte del paseo. La vista desde arriba es muy hermosa y puedes aprovechar para probar el Mote con huesillo (una bebida chilena dulce con trigo cocido y durazno seco). Mucha gente hace el descenso caminando para disfrutar el lugar, pero la verdad es que es un camino bastante extenso. El clásico paseo al Cerro San Cristóbal incluye la subida vía funicular y la bajada vía teleférico, que te dejará en la salida cerca del Sky Costanera.',
                'h3_3': 'Sky Costanera',
                'p11': 'El mirante del Sky Costanera, ubicado en la Gran Torre Santiago, ofrece una vista increíble. El edificio fue superado por la Torre Obispado en Monterrey, pero sigue siendo el rascacielos más alto de América del Sur. Lo ideal es visitar el Cerro San Cristóbal al inicio de la tarde e ir al Sky Costanera para ver el atardecer. En septiembre, el atardecer es hermoso y logras tener una bella vista de la Cordillera de los Andes con poca o ninguna nieve en las cumbres. El precio para septiembre de 2025 es de aproximadamente 16.000 CLP (R$ 88,00) para adultos.',
                'p12': 'Es el tipo de lugar donde me gusta quedarme un tiempo apreciando la vista, mirar todos os lados (tiene dos pisos). Hay restaurante y bar, yo aproveché para quedarme bebiendo un vino viendo la ciudad al anochecer.',
                'h3_4': 'Paseo a Valparaíso y Viña del Mar',
                'p13': 'Compré el tour de un día en una agencia local. Chile es, de hecho, muy estrecho y es rápido ir de Santiago hasta el mar. Las dos ciudades (Valparaíso y Viña del Mar) son vecinas, así que es tranquilo hacer las dos el mismo día. Valparaíso tiene esa vibra un poco brasileña. Las casas en el cerro, todas coloridas, recuerdan un poco a Salvador o Río. En Viña del Mar, la principal atracción es la playa. El agua es muy azul, pero muy fría.',
                'p14': 'El precio de un tour de un día para Valparaíso y Viña del Mar en septiembre de 2025 ronda los 45.000 CLP (R$ 250,00), sin comidas. ¡En nuestro paseo, tuvimos una parada en un museo con un moai original de la Isla de Pascua, una sorpresa increíble!',
                'p15': 'Al día siguiente, salí temprano hacia el aeropuerto para continuar mi viaje hacia el desierto de Atacama.',
                'related_title': 'Sigue Explorando',
                'rel_cat1': 'Chile', 'rel_title1': 'Atacama: Una Jornada Mágica',
                'rel_cat2': 'Reflexión', 'rel_title2': 'El Comienzo de Todo',
                'faq_title': 'Preguntas Frecuentes',
                'faq_q1': '¿Cuál es el mejor barrio para alojarse en Santiago?',
                'faq_a1': 'Providencia y Lastarria son las opciones más recomendadas para quienes visitan por primera vez. Providencia ofrece seguridad, excelente red de transporte y muchos hostels de calidad, mientras que Lastarria es el corazón cultural, perfecto para quienes gustan de bares, galerías de arte y una vida nocturna más bohemia y encantadora.',
                'faq_q2': '¿Cómo funciona el transporte público (tarjeta Bip!)?',
                'faq_a2': 'Para usar el metro y los autobuses en Santiago, es obligatorio tener la tarjeta "Bip!", que se puede comprar y recargar en cualquier estación de metro. El sistema es muy eficiente e integrado, permitiendo hacer conexiones entre autobús y metro dentro de un período de tiempo determinado con una sola tarifa, lo que ahorra mucho en los traslados.',
                'faq_q3': '¿Es seguro caminar por Santiago de noche?',
                'faq_a3': 'Santiago es una de las capitales más seguras de América Latina, pero exige cuidados básicos como cualquier metrópoli. Barrios como Providencia, Las Condes y Vitacura son muy tranquilos. En el Centro Histórico, evita calles desiertas tras el cierre del comercio. Siempre atento a tus pertenencias en aglomeraciones y usa apps de transporte si vuelves tarde.'
            },
            'en': {
                'meta_title': 'Santiago de Chile: First-Timer\'s Guide | Nomad Diaries',

                'author_line': 'By Paco Sousa • 6 min read • Updated on 01/03/2026',
		'diary_date': 'Santiago, Chile. April 08, 2023.',
                'p1': 'The first thing I thought about when traveling to Chile for the first time was: "I\'m going to fly over the Andes Mountains!". To get the best view, it\'s generally recommended to sit on the left side of the plane on arrival and on the right side on departure. I secured a window seat that wasn\'t obstructed by the plane\'s wing.',
                'p2': 'Note: This account was reviewed and updated for September 2025 based on current tourist information.',
                'h2_1': 'Arriving in the city',
                'p3': 'In general, I am totally against spending absurd amounts on Uber to leave the airport, and this time was no different. I knew it was far and looked for cheaper options to get to my hostel. Public transport in Santiago is efficient, and taking a bus or shared shuttle is a great way to save. There are options like TurBus or Centropuerto that take you straight to the city center for a very affordable price.',
                'p4': 'At that time, I didn\'t speak any Spanish, but it wasn\'t too difficult with mimicry and a good translator. Nowadays, with ChatGPT, it\'s much easier. Back then, I relied on Google Translate.',
                'p5': 'I stayed at Hostel Providencia. Apparently, in Santiago, it\'s the best option. This is the type of hostel I love the most: one where you sit at a table in the common area and there are always people looking to meet new people. I met great people at the hostel who were good company for the rest of the trip. Some were also going to Atacama and we met again there, but that\'s another story.',
                'p6': 'My biggest tip for those who want to socialize is this: stay in a hostel with a good reputation. Santiago\'s hostel network is great and you\'ll always find someone to share tours or a beer!',
                'h2_2': 'Attractions in Santiago',
                'p7': 'With only 4 days to explore, I had to be strategic. Unfortunately, I arrived on a Holy Saturday and everything was closed, plus I forgot the global rule: museums are closed on Mondays. With that in mind, here\'s what I was able to enjoy from my short trip to Santiago.',
                'h3_1': 'Walking tour in the Historic Center',
                'p8': 'I am extremely loyal to walking tour culture. I think it\'s a very good way to get to know the city and understand its history. In cities like Santiago and Buenos Aires, it\'s very easy to find a tour in Portuguese or English. I started my journey with a tour through the historic center, passing by the main tourist spots. It\'s great to see the city\'s history from a local\'s perspective, understanding the reason for each place and how the city was formed.',
                'h3_2': 'Climbing Cerro San Cristóbal',
                'p9': 'Since all the museums were closed, I went exploring parts of the city and made my way to where Cerro San Cristóbal is located. After a waiting line, I took the funicular up this hill, where you can have a great view of the entire city. In September 2025, the price for the ascent and descent via Funicular or Cable Car is approximately 4,000 CLP for adults on weekdays and 4,800 CLP on weekends and holidays.',
                'p10': 'The cable car was actually deactivated during my Monday visit, which was a shame as it takes away a part of the trip. The view from the top is very beautiful and you can take the chance to try Mote con huesillo (a sweet Chilean drink with cooked wheat and dried peach). Many people walk down to enjoy the site, but truth be told, it\'s a quite long path. The classic trip to Cerro San Cristóbal includes the funicular ride up and the cable car ride down, which drops you off near Sky Costanera.',
                'h3_3': 'Sky Costanera',
                'p11': 'The Sky Costanera viewpoint, located in the Gran Torre Santiago, offers an incredible view. The building was actually surpassed by the Obispado Tower in Monterrey, but remains the tallest skyscraper in South America. The ideal plan is to visit Cerro San Cristóbal in the early afternoon and go to Sky Costanera to watch the sunset. In September, the sunset is beautiful and you get a great view of the Andes with little to no snow on the peaks. The ticket price for September 2025 is approximately 16,000 CLP for adults.',
                'p12': 'It\'s the kind of place where I like to spend some time appreciating the view, looking at all sides (there are two floors). There is a restaurant and bar; I took the chance to drink some wine while watching the city at nightfall.',
                'h3_4': 'Trip to Valparaíso and Viña del Mar',
                'p13': 'I bought the day tour from a local agency. Chile is indeed very narrow and it\'s quick to go from Santiago to the sea. The two cities (Valparaíso and Viña del Mar) are neighbors, so it\'s easy to do both on the same day. Valparaíso has a bit of a Brazilian vibe. The houses on the hill, all colorful, remind me of Salvador or Rio. In Viña del Mar, the main attraction is the beach. The water is very blue but very cold.',
                'p14': 'The price for a day tour to Valparaíso and Viña del Mar in September 2025 is around 45,000 CLP, without meals. On our tour, we had a stop at a museum with an original Moai from Easter Island—an incredible surprise!',
                'p15': 'The next day, I left early for the airport to continue my journey to the Atacama Desert.',
                'related_title': 'Keep Reading',
                'rel_cat1': 'Chile', 'rel_title1': 'Atacama: A Magical Journey',
                'rel_cat2': 'Reflection', 'rel_title2': 'The Beginning of Everything',
                'faq_title': 'Common Questions',
                'faq_q1': 'What is the best neighborhood to stay in Santiago?',
                'faq_a1': 'Providencia and Lastarria are the most recommended options for first-time visitors. Providencia offers safety, a great transport network, and many high-quality hostels, while Lastarria is the cultural heart, perfect for those who enjoy bars, art galleries, and a more bohemian and charming nightlife.',
                'faq_q2': 'How does public transport work (Bip! card)?',
                'faq_a2': 'To use the metro and buses in Santiago, it is mandatory to have a \"Bip!\" card, which can be purchased and topped up at any metro station. The system is very efficient and integrated, allowing you to transfer between buses and the metro within a set period with just one fare, which saves a lot on travel costs.',
                'faq_q3': 'Is it safe to walk around Santiago at night?',
                'faq_a3': 'Santiago is one of the safest capitals in Latin America, but it requires basic care like any metropolis. Neighborhoods like Providencia, Las Condes, and Vitacura are very quiet. In the Historic Center, avoid deserted streets after shops close. Always be aware of your belongings in crowded areas and use transport apps if returning late.'
            }
