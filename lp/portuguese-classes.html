<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professor de Português Brasileiro - Paco Sousa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #111111; color: #eeeeee; }
        .bg-gradient-paco { background: linear-gradient(135deg, #FF3366 0%, #6633FF 100%); }
        .text-gradient { background: linear-gradient(to right, #FF3366, #4DD0E1); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .title-yellow { color: #ffd034; }

        .video-container { 
            position: relative; 
            width: 100%;
            aspect-ratio: 16 / 9;
            border-radius: 1.5rem; 
            border: 1px solid rgba(255,255,255,0.1); 
            background-color: #000;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(255, 51, 102, 0.2);
        }
        
        .video-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        
        #main-header { position: fixed; top: 0; left: 0; width: 100%; z-index: 9999; }
        main { padding-top: 100px; }

        @media (max-width: 768px) {
            main { padding-top: 80px; }
        }
    </style>
</head>
<body class="antialiased overflow-x-hidden">

    <!-- MENU MANUAL COM TRADUÇÃO INTEGRADA -->
    <header id="main-header" class="bg-[#111111]/95 backdrop-blur-md border-b border-white/5">
        <nav class="container mx-auto px-4 md:px-6 py-4 flex items-center justify-between relative z-50 gap-4">
            <div class="flex items-center space-x-2 md:space-x-4 shrink-0">
                <a href="../index.html" class="flex items-center space-x-2 font-extrabold text-lg md:text-xl italic transition-opacity hover:opacity-80">
                    <img src="../images/logo-blog.webp" alt="Logo" class="h-8 w-8 rounded-full border border-[#FF3366]" onerror="this.src='https://ui-avatars.com/api/?name=Paco+Sousa&background=FF3366&color=fff'">
                    <span class="text-white hidden sm:block">Paco Sousa</span>
                </a>
                <a href="../index.html" class="flex items-center gap-1.5 px-3 py-1 bg-white/5 border border-white/10 rounded-full text-gray-400 hover:text-white transition-all group">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5 transition-transform group-hover:-translate-x-1" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M9.707 16.707a1 1 0 01-1.414 0l-6-6a1 1 0 010-1.414l6-6a1 1 0 011.414 1.414L5.414 9H17a1 1 0 110 2H5.414l4.293 4.293a1 1 0 010 1.414z" clip-rule="evenodd" />
                    </svg>
                    <span id="nav-back" class="font-bold text-[9px] uppercase tracking-widest text-white"></span>
                </a>
            </div>

            <div class="flex items-center space-x-4 md:space-x-6 shrink-0">
                <div class="hidden md:flex items-center space-x-6">
                    <select id="languageSelector" onchange="changeLang(this.value)" class="bg-[#1B1B1B] text-white text-[10px] font-bold py-2 px-3 rounded-lg border border-white/10 outline-none cursor-pointer hover:border-[#FF3366] transition-all">
                        <option value="pt">PORTUGUÊS</option>
                        <option value="es">ESPAÑOL</option>
                        <option value="en">ENGLISH</option>
                    </select>
                </div>
                <button onclick="document.getElementById('mobile-menu').classList.toggle('hidden')" class="md:hidden text-white p-2 bg-white/5 rounded-lg border border-white/10">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16m-7 6h7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
                </button>
            </div>
        </nav>

        <div id="mobile-menu" class="hidden absolute top-full left-0 w-full bg-[#111111] border-b border-white/5 p-6 space-y-6 md:hidden shadow-2xl">
            <div class="flex justify-center gap-8">
                <button onclick="changeLang('pt')" class="text-3xl hover:scale-110 transition-transform">🇧🇷</button>
                <button onclick="changeLang('es')" class="text-3xl hover:scale-110 transition-transform">🇪🇸</button>
                <button onclick="changeLang('en')" class="text-3xl hover:scale-110 transition-transform">🇺🇸</button>
            </div>
            <a href="../index.html" id="mobile-back-blog" class="block w-full text-center py-4 bg-white/5 text-white font-bold rounded-xl border border-white/10"></a>
        </div>
    </header>

    <main class="pb-20">
        <div class="container mx-auto px-6">
            <!-- Hero Section -->
            <div class="max-w-4xl mx-auto text-center mb-16">
                <span id="hero-tag" class="inline-block px-4 py-1.5 mb-6 text-[10px] font-black uppercase tracking-[0.3em] bg-[#FF3366]/10 text-[#FF3366] rounded-full border border-[#FF3366]/20"></span>
                <h1 id="hero-title" class="text-4xl md:text-6xl font-black mb-8 leading-tight title-yellow"></h1>
                <p id="hero-desc" class="text-lg md:text-xl text-gray-400 leading-relaxed max-w-2xl mx-auto"></p>
            </div>

            <!-- Video Section -->
            <div class="max-w-3xl mx-auto mb-20">
                <div class="video-container">
                    <video id="main-video" controls playsinline preload="metadata" poster="../images/capa-video.jpg">
                        <source src="../videos/aula-portugues.mp4" type="video/mp4">
                    </video>
                </div>
                <p id="video-caption" class="text-center text-[10px] text-gray-500 mt-4 uppercase tracking-widest font-bold"></p>
            </div>

            <!-- Content Grid -->
            <div class="grid md:grid-cols-2 gap-8 max-w-5xl mx-auto items-start">
                <div class="bg-white/5 p-8 rounded-[2rem] border border-white/5 hover:border-[#4DD0E1]/30 transition-colors">
                    <h2 id="title-approach" class="text-2xl font-black mb-6 text-[#4DD0E1]"></h2>
                    <div id="content-approach" class="space-y-4 text-gray-300 leading-relaxed"></div>
                </div>
                <div class="bg-white/5 p-8 rounded-[2rem] border border-white/5 hover:border-[#FF3366]/30 transition-colors">
                    <h2 id="title-experience" class="text-2xl font-black mb-6 text-[#FF3366]"></h2>
                    <div id="content-experience" class="space-y-4 text-gray-300 leading-relaxed"></div>
                </div>
            </div>

            <!-- CTA Section -->
            <div class="mt-20 text-center bg-gradient-paco p-12 md:p-20 rounded-[3rem] max-w-5xl mx-auto shadow-2xl relative overflow-hidden group">
                <h3 id="cta-title" class="text-3xl md:text-5xl font-black text-white mb-6"></h3>
                <p id="cta-desc" class="text-white/90 mb-10 text-lg max-w-xl mx-auto italic font-medium"></p>
                <a href="https://preply.in/FRANCISCO9PT3177613211?ts=17684973" target="_blank" class="inline-block bg-white text-[#FF3366] text-lg font-black uppercase tracking-widest px-10 py-5 rounded-2xl shadow-xl hover:scale-110 active:scale-95 transition-all">
                    <span id="cta-btn"></span>
                </a>
            </div>
        </div>
    </main>

    <script>
        const lpContent = {
            'pt': {
                'nav_back': 'Voltar',
                'mobile_back': 'Ir para o Blog',
                'hero_tag': 'Professor de Português Brasileiro',
                'hero_title': 'Português brasileiro para conversar de verdade!',
                'hero_desc': 'Ensino português brasileiro do jeito que ele é falado na vida real em viagens, conversas, cafés, trabalho e situações do dia a dia.',
                'video_caption': 'Apresentação: Por que aprender comigo?',
                'title_approach': 'Minha Metodologia',
                'title_experience': 'Experiência de ensino',
                'approach_html': `
                    <p>Ensino português brasileiro do jeito que ele é falado na vida real: em viagens, conversas, cafés, trabalho e situações do dia a dia.</p>
                    <p>Sou nômade digital e aprendi inglês e espanhol viajando, além de estudar italiano atualmente. Por isso, conheço bem aquela sensação de <strong>“eu até entendo, mas travo na hora de falar”</strong>.</p>
                    <p>Nas minhas aulas, a conversa começa cedo. Usamos situações reais, temas cotidianos, música, textos e cultura para que o português faça sentido e não fique preso à gramática solta.</p>
                `,
                'experience_html': `
                    <p>Minha experiência com ensino começou na universidade, onde atuei como tutor de português para estrangeiros.</p>
                    <p>Também dei aulas de redação, o que refinou minha forma de explicar, corrigir e organizar o pensamento do aluno sem bloquear a fala.</p>
                `,
                'cta_title': 'Pronto para falar como um brasileiro?',
                'cta_desc': 'Marque uma aula e vamos definir juntos seus objetivos. A ideia é simples: fazer o português entrar na sua rotina.',
                'cta_btn': 'Reservar no Preply',
                'footer_copy': '© 2026 Diários de um Nômade. Por Paco Sousa.'
            },
            'en': {
                'nav_back': 'Back',
                'mobile_back': 'Go to Blog',
                'hero_tag': 'Brazilian Portuguese Teacher',
                'hero_title': 'Brazilian Portuguese for real conversations!',
                'hero_desc': 'I teach Brazilian Portuguese the way it is actually spoken in real life: during travels, chats, coffee breaks, work, and everyday situations.',
                'video_caption': 'Presentation: Why learn with me?',
                'title_approach': 'My Methodology',
                'title_experience': 'Teaching Experience',
                'approach_html': `
                    <p>I teach Brazilian Portuguese the way it is actually spoken in real life: in travel, conversations, work, and daily situations.</p>
                    <p>As a digital nomad, I learned English and Spanish while traveling, and I am currently studying Italian. Therefore, I know very well that feeling of <strong>"I understand, but I freeze when it is time to speak"</strong>.</p>
                    <p>In my classes, conversation starts early. We use real situations, everyday topics, music, texts, and culture so that Portuguese makes sense and isn't just loose grammar.</p>
                `,
                'experience_html': `
                    <p>My teaching experience began at university, where I worked as a Brazilian Portuguese tutor for foreigners.</p>
                    <p>I also taught academic writing, which refined my ability to explain, correct, and organize a student's thoughts without blocking their speech flow.</p>
                `,
                'cta_title': 'Ready to speak like a Brazilian?',
                'cta_desc': 'Book a lesson and let’s define your goals together. The idea is simple: make Portuguese part of your routine.',
                'cta_btn': 'Book on Preply',
                'footer_copy': '© 2026 Nomad Diaries. By Paco Sousa.'
            },
            'es': {
                'nav_back': 'Volver',
                'mobile_back': 'Ir al Blog',
                'hero_tag': 'Profesor de Portugués Brasileño',
                'hero_title': '¡Portugués brasileño para conversar de verdad!',
                'hero_desc': 'Enseño portugués brasileño tal como se habla en la vida real: en viajes, charlas, cafés, trabajo y situaciones cotidianas.',
                'video_caption': 'Presentación: ¿Por qué aprender conmigo?',
                'title_approach': 'Mi Metodología',
                'title_experience': 'Experiencia de enseñanza',
                'approach_html': `
                    <p>Enseño portugués brasileño tal como se habla en la vida real: en viajes, conversaciones, cafés, trabajo y situaciones del día a día.</p>
                    <p>Soy nómada digital y aprendí inglés y español viajando, además de estudiar italiano actualmente. Por eso, conozco muy bien esa sensación de <strong>“entiendo bastante, pero me bloqueo al momento de hablar”</strong>.</p>
                    <p>En mis clases, la conversación comienza desde temprano. Usamos situaciones reales, temas cotidianos, música, textos y cultura para que el portugués tenga sentido y no se quede atrapado en gramática suelta.</p>
                `,
                'experience_html': `
                    <p>Mi experiencia con la enseñanza comenzó en la universidad, donde trabajé como tutor de portugués para extranjeros.</p>
                    <p>También di clases de redacción, lo que perfeccionó mi forma de explicar, corregir y organizar el pensamiento del alumno sin bloquear su habla.</p>
                `,
                'cta_title': '¿Listo para hablar como un brasileño?',
                'cta_desc': 'Reserva una clase y definamos juntos tus objetivos. La idea es simple: que el portugués forme parte de tu rutina.',
                'cta_btn': 'Reservar en Preply',
                'footer_copy': '© 2026 Diarios de un Nómada. Por Paco Sousa.'
            }
        };

        function updateLPContent(lang) {
            const data = lpContent[lang] || lpContent['pt'];
            
            // Atualiza Menu Fake
            document.getElementById('nav-back').innerText = data.nav_back;
            document.getElementById('mobile-back-blog').innerText = data.mobile_back;
            document.getElementById('languageSelector').value = lang;

            // Atualiza Conteúdo da Página
            const mappings = {
                'hero-tag': data.hero_tag,
                'hero-title': data.hero_title,
                'hero-desc': data.hero_desc,
                'video-caption': data.video_caption,
                'title-approach': data.title_approach,
                'title-experience': data.title_experience,
                'cta-title': data.cta_title,
                'cta-desc': data.cta_desc,
                'cta-btn': data.cta_btn
            };

            for (const [id, value] of Object.entries(mappings)) {
                const el = document.getElementById(id);
                if (el) el.innerText = value;
            }

            document.getElementById('content-approach').innerHTML = data.approach_html;
            document.getElementById('content-experience').innerHTML = data.experience_html;
            
            document.getElementById('mobile-menu').classList.add('hidden');
            localStorage.setItem('paco_blog_lang', lang);
        }

        window.changeLang = updateLPContent;

        document.addEventListener('DOMContentLoaded', () => {
            const savedLang = localStorage.getItem('paco_blog_lang') || 'pt';
            updateLPContent(savedLang);
        });
    </script>
</body>
</html>
