const numberToExtensive = (num) => {
    const map = {
        10: "Dez", 20: "Vinte", 30: "Trinta", 40: "Quarenta", 50: "Cinquenta",
        60: "Sessenta", 70: "Setenta", 80: "Oitenta", 90: "Noventa", 100: "Cem",
        200: "Duzentos", 300: "Trezentos", 400: "Quatrocentos", 500: "Quinhentos"
    };
    return map[num] || num.toString();
};

const playSound = (type) => {
    try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        const now = ctx.currentTime;
        if (type === 'correct') {
            osc.frequency.setValueAtTime(300, now);
            osc.frequency.exponentialRampToValueAtTime(600, now + 0.15);
            gain.gain.setValueAtTime(0.1, now); gain.gain.linearRampToValueAtTime(0, now + 0.2);
        } else if (type === 'error') {
            osc.frequency.setValueAtTime(200, now);
            osc.frequency.linearRampToValueAtTime(100, now + 0.15);
            gain.gain.setValueAtTime(0.1, now); gain.gain.linearRampToValueAtTime(0, now + 0.2);
        }
        osc.start(); osc.stop(now + 0.2);
    } catch(e) {}
};

    };
    return (

};

const ChoiceQuiz = ({ data, onComplete, title }) => {
    const [idx, setIdx] = useState(0);
    const [feedback, setFeedback] = useState(null);
    const current = data[idx];

    const handleChoice = (opt) => {
        if (feedback) return;
        if (opt === current.correct) {
            playSound('correct'); setFeedback('correct');
            setTimeout(() => {
                if (idx + 1 < data.length) { setIdx(idx + 1); setFeedback(null); }
                else onComplete(100);
            }, 1000);
        } else {
            playSound('error'); setFeedback('wrong');
            setTimeout(() => setFeedback(null), 1000);
        }
    };

const DialogueChallenge = ({ onComplete }) => {
    const [currentStep, setCurrentStep] = useState(() => {
        const saved = localStorage.getItem('margo_dialogue_step');
        return (saved && parseInt(saved) < DIALOGUE_TEST.length) ? parseInt(saved) : 0;
    });
    const [history, setHistory] = useState(() => {
        const saved = localStorage.getItem('margo_dialogue_history');
        return saved ? JSON.parse(saved) : [];
    });
    const [feedback, setFeedback] = useState(null);
    const [showFull, setShowFull] = useState(false);

    const currentLine = DIALOGUE_TEST[currentStep];

    const handleAnswer = (opt) => {
        if (feedback) return;
        if (opt === currentLine.correct) {
            playSound('correct');
            const filledText = currentLine.text.replace('____', opt);
            const newHistory = [...history, { ...currentLine, filledText }];
            
            setFeedback({ type: 'correct', choice: opt });
            setHistory(newHistory);
            localStorage.setItem('margo_dialogue_history', JSON.stringify(newHistory));

            setTimeout(() => {
                const nextStep = currentStep + 1;
                if (nextStep < DIALOGUE_TEST.length) {
                    setCurrentStep(nextStep);
                    localStorage.setItem('margo_dialogue_step', nextStep.toString());
                    setFeedback(null);
                } else {
                    setShowFull(true);
                    localStorage.removeItem('margo_dialogue_step');
                }
            }, 1000);
        } else {
            playSound('error');
            setFeedback({ type: 'wrong', choice: opt });
            setTimeout(() => setFeedback(null), 800);
        }
    };

    if (showFull) {
        return (
            <div className="max-w-2xl mx-auto slide-up bg-[#1A1035] p-8 rounded-[40px] border-2 border-[#00F5D4] shadow-2xl">
                <h2 className="text-3xl font-black text-[#00F5D4] mb-8 text-center uppercase">Diálogo Completo 🏆</h2>
                <div className="space-y-4 mb-10 max-h-[50vh] overflow-y-auto pr-4 custom-scrollbar">
                    {history.map((h, i) => (
                        <div key={i} className={`flex items-start gap-3 ${h.speaker === 'Leo' ? 'flex-row' : 'flex-row-reverse'}`}>
                            <div className="text-3xl">{h.avatar}</div>
                            <div className={`p-4 rounded-2xl max-w-[80%] ${h.speaker === 'Leo' ? 'bg-[#7B2FFF] rounded-tl-none' : 'bg-[#FF3CAC] rounded-tr-none'}`}>
                                <p className="font-bold text-white leading-tight">{h.filledText}</p>
                            </div>
                        </div>
                    ))}
                </div>
                <div className="text-center">
                    <Button onClick={() => { localStorage.removeItem('margo_dialogue_history'); onComplete(100); }} variant="accent" className="px-12 py-4">Finalizar Desafio</Button>
                </div>
            </div>
        );
    }

    return (
        <div className="max-w-2xl mx-auto slide-up">
            <h2 className="text-center text-2xl font-black text-[#00F5D4] mb-8 uppercase tracking-tighter">Super Teste: O Encontro</h2>
            
            <div className="flex justify-between mb-4 items-center">
                <div className="h-3 bg-white/10 flex-1 rounded-full mr-4 overflow-hidden">
                    <div className="h-full bg-[#00F5D4] transition-all duration-500" style={{ width: `${(currentStep / DIALOGUE_TEST.length) * 100}%` }}></div>
                </div>
                <div className="text-[10px] font-black text-white/30">{currentStep + 1} / {DIALOGUE_TEST.length}</div>
            </div>
            
            <div className="flex items-end gap-4 mb-8">
                <div className="text-7xl animate-bounce-slow">{currentLine.avatar}</div>
                <div className="dialogue-bubble flex-1 shadow-2xl">
                    <div className="text-[10px] font-black text-[#FF3CAC] mb-1 uppercase tracking-widest">{currentLine.speaker}</div>
                    <div className="text-2xl text-white font-black leading-tight">
                        {currentLine.text.split('____').map((part, i, arr) => (
                            <span key={i}>
                                {part}
                                {i < arr.length - 1 && <span className="text-[#00F5D4] border-b-4 border-dotted border-[#00F5D4]">_______</span>}
                            </span>
                        ))}
                    </div>
                    <div className="mt-2 text-xs text-white/30 italic">"{currentLine.trans}"</div>
                </div>
            </div>

            <div className="grid grid-cols-1 gap-3">
                {currentLine.options.map((opt, idx) => (
                    <button 
                        key={idx}
                        onClick={() => handleAnswer(opt)}
                        className={`option-btn ${feedback?.choice === opt ? (feedback.type === 'correct' ? 'correct' : 'wrong animate-shake') : ''}`}
                    >
                        {opt}
                    </button>
                ))}
            </div>

            <div className="mt-12 text-center">
                <Button onClick={() => { if(confirm("Reiniciar o diálogo?")) { localStorage.removeItem('margo_dialogue_step'); localStorage.removeItem('margo_dialogue_history'); setCurrentStep(0); setHistory([]); } }} variant="ghost" className="text-[10px] opacity-20 hover:opacity-100">Reiniciar Teste</Button>

const FillBlanks = ({ data, onComplete, title, subtitle }) => {
    const [index, setIndex] = useState(0);
    const [input, setInput] = useState('');
    const [feedback, setFeedback] = useState(null); 
    const currentData = data[index];
    const handleCheck = () => {
        if (input.trim().toLowerCase() === currentData.a.toLowerCase()) {
            playSound('correct'); setFeedback('correct');
            setTimeout(() => {
                if (index + 1 < data.length) { setIndex(index + 1); setInput(''); setFeedback(null); }
                else onComplete(100);
            }, 1000);
        } else { playSound('error'); setFeedback('wrong'); setTimeout(() => setFeedback(null), 1000); }
    };
    return (
        <div className="max-w-xl mx-auto slide-up">
            <div className="text-center mb-6"><h3 className="text-xl font-black text-[#00F5D4] tracking-widest uppercase">{title}</h3><p className="text-white/40 text-xs font-bold">{subtitle}</p></div>

                <div className="text-2xl font-black text-white mb-2 leading-relaxed">
                    {currentData.q.split('____').map((p,i) => i===0 ? (<span key={i}>{p}<input type="text" value={input} onChange={e=>setInput(e.target.value)} onKeyPress={e=>e.key==='Enter'&&handleCheck()} className="mx-2 bg-transparent border-b-4 border-[#00F5D4] w-24 text-center text-[#00F5D4]" autoFocus/></span>) : <span key={i}>{p}</span>)}
                </div>

};

        ['P','J','A','N','E','I','R','O','L','X','Y','Z','Q','S'],
        ['F','W','E','R','T','Y','U','I','O','M','A','I','O','E'],

        ['E','X','Y','Z','W','R','H','T','M','U','V','W','L','R'],
        ['I','Q','R','S','T','U','V','O','B','X','Y','Z','W','O'],
        ['R','G','H','I','J','K','L','M','R','U','V','W','X','J'],
        ['O','Z','X','Y','K','L','M','N','O','T','B','N','M','U'],
        ['M','A','R','C','O','Q','R','S','T','U','U','V','W','L'],
        ['S','T','U','V','N','O','V','E','M','B','R','O','X','H'],
        ['A','B','C','D','E','F','G','H','I','J','K','R','O','O'],
        ['X','A','G','O','S','T','O','W','Y','Z','Q','R','S','O']
    ];

    const [foundWords, setFoundWords] = useState([]);
    const [selectedCells, setSelectedCells] = useState([]);
    const [lockedCells, setLockedCells] = useState([]); 

    const handleCellClick = (r, c) => {
        if (lockedCells.some(cell => cell.r === r && cell.c === c)) return;
        const selectionIndex = selectedCells.findIndex(cell => cell.r === r && cell.c === c);
        let newSelection = selectionIndex !== -1 ? selectedCells.filter((_, i) => i !== selectionIndex) : [...selectedCells, { r, c }];
        setSelectedCells(newSelection);
    };

    useEffect(() => {
        if (selectedCells.length < 4) return;
        wordDefinitions.forEach(def => {
            if (def.coords.length === selectedCells.length && !foundWords.includes(def.word)) {

                                        {char}
                                    </div>
                                );
                            })}
                        </div>
                    ))}
                </div>
                <div className="bg-white/5 p-8 rounded-3xl border-2 border-white/10 w-full xl:w-64 max-h-[600px] overflow-y-auto custom-scrollbar">
                    <h3 className="text-[#7B2FFF] font-black uppercase text-xs mb-6 text-center tracking-widest">Os 12 Meses</h3>

            {foundWords.length === wordDefinitions.length && <Button onClick={() => onComplete(100)} variant="accent" className="mt-12 px-12 py-4">Missão Cumprida!</Button>}

const MemoryGame = ({ data, onComplete, type='text-text' }) => {
    const [cards, setCards] = useState([]);
    const [flipped, setFlipped] = useState([]);
    const [matched, setMatched] = useState([]);
    const [locked, setLocked] = useState(false);
    useEffect(() => {
        let pool = type==='text-text' ? data.flatMap((it,idx) => [{id:`${idx}-pt`, content:it.pt, pairId:idx, side:'pt'}, {id:`${idx}-es`, content:it.es, pairId:idx, side:'es'}]) : data.flatMap((it,idx) => [{id:`${idx}-emoji`, content:it.emoji, pairId:idx, side:'emoji'}, {id:`${idx}-pt`, content:it.pt, pairId:idx, side:'pt'}]);
        setCards([...pool].sort(() => Math.random() - 0.5));
    }, [data, type]);
    const handleFlip = (c) => {
        if (locked || flipped.includes(c.id) || matched.includes(c.pairId)) return;
        const nf = [...flipped, c.id]; setFlipped(nf);
        if (nf.length === 2) {
            setLocked(true);
            if (cards.find(x=>x.id===nf[0]).pairId === cards.find(x=>x.id===nf[1]).pairId) {
                playSound('correct'); setMatched([...matched, cards.find(x=>x.id===nf[0]).pairId]); setFlipped([]); setLocked(false);
            } else { playSound('error'); setTimeout(() => { setFlipped([]); setLocked(false); }, 1000); }
        }
    };
    if (matched.length === data.length) return <div className="text-center slide-up text-white flex flex-col items-center"><h2 className="text-4xl font-black text-[#00F5D4] mb-8">Parabéns!</h2><Button onClick={() => onComplete(100)}>Próximo</Button></div>;
    return (
        <div className="grid grid-cols-2 md:grid-cols-4 gap-4 max-w-4xl mx-auto slide-up perspective-1000">
            {cards.map(c => {
                const isF = flipped.includes(c.id) || matched.includes(c.pairId);
                return (
                    <div key={c.id} onClick={()=>handleFlip(c)} className={`relative h-28 md:h-36 cursor-pointer transition-transform duration-500 transform-style-3d ${isF ? 'rotate-y-180' : ''}`}>
                        <div className="absolute inset-0 bg-[#7B2FFF] rounded-2xl flex items-center justify-center border-b-4 border-indigo-900 backface-hidden z-20 font-black text-2xl text-white/50">?</div>
                        <div className={`absolute inset-0 rounded-2xl flex items-center justify-center p-2 rotate-y-180 backface-hidden border-b-4 shadow-xl z-10 ${c.side==='pt'?'bg-[#FF3CAC]':'bg-[#00F5D4]'}`}>
                            <span className="font-black text-lg md:text-2xl text-center leading-tight">{c.content}</span>
                        </div>
                    </div>
                );
            })}
        </div>
    );
};

                <div className="flex justify-between mt-12 items-center">
                    <Button onClick={() => slide > 0 && setSlide(slide-1)} variant="ghost" className={slide === 0 ? 'invisible' : ''}>Atrás</Button>
                    <Button onClick={()=>slide < data.length - 1 ? setSlide(slide+1) : onComplete(100)} variant="accent">{slide === data.length - 1 ? 'Pronto!' : 'Próximo'}</Button>
                </div>
            </div>
        </div>
    );
};

// ─── MAIN APP ─────────────────────────────────────────────────────────────────
function App() {
    const [view, setView] = useState('home');
    const [step, setStep] = useState(0); 
    const [currentInv, setCurrentInv] = useState([]);
    const [user, setUser] = useState(null);
    const [userProgress, setUserProgress] = useState({});
    const [db, setDb] = useState(null);
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'oi-brasil-margo-v4';

    useEffect(() => {
        const initFirebase = async () => {
            if (typeof window.firebaseCore === 'undefined') return;
            const { initializeApp, getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken, getFirestore, doc, onSnapshot } = window.firebaseCore;
            if (typeof __firebase_config === 'undefined') return;
            const firebaseConfig = JSON.parse(__firebase_config);
            const app = initializeApp(firebaseConfig);
            const auth = getAuth(app);
            const firestore = getFirestore(app);
            setDb(firestore);
            const initAuth = async () => {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) { await signInWithCustomToken(auth, __initial_auth_token); } 
                else { await signInAnonymously(auth); }
            };
            initAuth();
            onAuthStateChanged(auth, (u) => {
                setUser(u);
                if (u) {
                    const progressRef = doc(firestore, 'artifacts', appId, 'users', u.uid, 'progress', 'data');
                    onSnapshot(progressRef, (snap) => { if (snap.exists()) setUserProgress(snap.data()); });
                }
            });
        };
        initFirebase();
    }, []);

    const completeLesson = async (lessonId, score = 100) => {
        const newProgress = { ...userProgress, [lessonId]: { completed: true, score: score } };
        setUserProgress(newProgress);
        if (user && db) {
            const { doc, setDoc } = window.firebaseCore;
            await setDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'progress', 'data'), newProgress, { merge: true });
        }
        goHome();
    };

    const goHome = () => { setView('home'); setStep(0); };

    return (
        <div className="min-h-screen bg-[#0F0A1E] text-white">
            <header className="px-4 py-3 border-b border-white/5 flex justify-between items-center sticky top-0 bg-[#0F0A1E] z-50">
                <div onClick={goHome} className="flex items-center gap-2 cursor-pointer"><span className="text-2xl">👩‍🚀</span><h1 className="text-lg font-black tracking-tight">Oi, Brasil!</h1></div>
                <div className="flex gap-2">
                    {view === 'home' && <Button onClick={() => setView('boletim')} variant="ghost" className="text-xs">📊 Boletim</Button>}
                    {view !== 'home' && <Button onClick={goHome} variant="ghost" className="text-xs">Voltar</Button>}
                </div>
            </header>
            <main className="px-4 py-10 max-w-6xl mx-auto">
                {view==='home' && (
                    <div className="flex flex-col items-center justify-center text-center px-3 slide-up min-h-[70vh]">
                        <h1 className="text-5xl md:text-7xl font-black mb-2 animate-bounce-slow">Oi, Brasil! 🇧🇷</h1>
                        <p className="text-base font-bold text-[#00F5D4] mb-12 uppercase tracking-widest">¡Aprendé jogando!</p>
                        <div className="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-3 w-full">
                            {[
                                {id:'m1a', emoji:'💜', label:'Aula 1A', color:'#7B2FFF'},
                                {id:'m1b', emoji:'🏠', label:'Aula 1B', color:'#4361EE'},
                                {id:'m2a', emoji:'💎', label:'Aula 2A', color:'#4361EE'},
                                {id:'m2b', emoji:'💰', label:'Aula 2B', color:'#7B2FFF'},
                                {id:'m3a', emoji:'🔺', label:'Aula 3A', color:'#FF3CAC'},
                                {id:'m3b', emoji:'🦒', label:'Aula 3B', color:'#FF3CAC'},
                                {id:'m_calendar', emoji:'🗓️', label:'Calendário', color:'#00a89c'},
                                {id:'m_test', emoji:'🎬', label:'SUPER TESTE', color:'#FF3CAC'},
                                {id:'m_word', emoji:'🔍', label:'Caça-Palavras', color:'#00F5D4'},
                                {id:'m_fix', emoji:'🔥', label:'Fixação', color:'#FFD60A'}
                            ].map(m => (
                                <button key={m.id} onClick={()=>setView(m.id)} className={`relative rounded-[24px] p-5 transition-all hover:scale-105 shadow-xl border-4 ${userProgress[m.id]?.completed ? 'border-[#00F5D4]' : 'border-transparent'}`} style={{backgroundColor:m.color}}>
                                    <span className="text-3xl mb-2 block">{m.emoji}</span>
                                    <h2 className="text-[10px] font-black text-white uppercase leading-tight">{m.label}</h2>
                                    {userProgress[m.id]?.completed && <span className="absolute -top-2 -right-2 bg-[#00F5D4] text-[#0F0A1E] text-[10px] font-black w-6 h-6 flex items-center justify-center rounded-full border-2 border-[#0F0A1E]">✓</span>}
                                </button>
                            ))}
                        </div>
                    </div>
                )}
                {view==='boletim' && <ProgressReport userProgress={userProgress} onBack={goHome} />}
                {view==='m1a' && <MemoryGame data={CLASS_1A_GREETINGS} onComplete={(s) => completeLesson('m1a', s)}/>}
                {view==='m1b' && (
                    <>
                        {step === 0 && <TheoryLesson data={CLASS_1B_THEORY} title="Aula 1B" onComplete={() => setStep(1)}/>}
                        {step === 1 && <FillBlanks data={CLASS_1B_EXERCISES} title="Praticando" subtitle="Gostos e Pronomes" onComplete={(s) => completeLesson('m1b', s)}/>}
                    </>
                )}
                {view==='m2a' && (
                    <>
                        {step === 0 && <TheoryLesson data={CLASS_2A_THEORY} title="Aula 2A" onComplete={() => setStep(1)}/>}
                        {step === 1 && <RobuxMarket onComplete={(inv) => { setCurrentInv(inv); setStep(2); }}/>}
                        {step === 2 && <TerPractice inventory={currentInv} onComplete={(s) => completeLesson('m2a', s)}/>}
                    </>
                )}
                {view==='m2b' && <TheoryLesson data={CLASS_2B_THEORY} title="Aula 2B" onComplete={(s) => completeLesson('m2b', s)}/>}
                {view==='m3a' && (
                    <>
                        {step === 0 && <TheoryLesson data={CLASS_3A_THEORY} title="Aula 3A" onComplete={() => setStep(1)}/>}
                        {step === 1 && <FillBlanks data={CLASS_3A_CHALLENGES} title="Concordância" onComplete={(s) => completeLesson('m3a', s)}/>}
                    </>
                )}
                {view==='m3b' && (
                    <>
                        {step === 0 && <TheoryLesson data={CLASS_3B_THEORY} title="Aula 3B - Adjetivos" onComplete={() => setStep(1)}/>}
                        {step === 1 && <ChoiceQuiz data={CLASS_3B_QUIZ} title="Personalidade" onComplete={(s) => completeLesson('m3b', s)}/>}
                    </>
                )}
                {view==='m_calendar' && (
                    <>
                        {step === 0 && <TheoryLesson data={CLASS_CALENDAR_THEORY} title="Calendário" onComplete={() => setStep(1)}/>}
                        {step === 1 && <MemoryGame data={CALENDAR_MEM_DATA} onComplete={() => setStep(2)}/>}
                        {step === 2 && <ChoiceQuiz data={CALENDAR_QUIZ} title="Quiz de Tempo" onComplete={(s) => completeLesson('m_calendar', s)}/>}
                    </>
                )}
                {view==='m_test' && <DialogueChallenge onComplete={(s) => completeLesson('m_test', s)} />}
                {view==='m_fix' && <FillBlanks data={COMPLEMENTARY_EXERCISES} title="Super Fixação" onComplete={(s) => completeLesson('m_fix', s)} />}
                {view==='m_word' && <WordSearch onComplete={(s) => completeLesson('m_word', s)} />}
                {view==='m_rev' && <FillBlanks data={REVISION_DATA} title="Super Revisão" onComplete={(s) => completeLesson('m_rev', s)} />}
            </main>
        </div>
    );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
