<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Português para Hispanohablantes</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,600;0,700;1,400&family=DM+Mono:wght@400;500&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>

:root{--v:#1A6B4A;--vl:#2A9B6E;--vd:#0F3D2B;--cr:#F5F0E8;--cr2:#EDE7D8;--cr3:#E2D9C4;--ou:#C4922A;--oul:#DFB050;--oud:#7A5A18;--az:#2C4E7A;--azl:#4A7AB5;--tx:#1C1A15;--tm:#4A4538;--tm2:#8A7E68;--vm:#8B2A1A;--bd:rgba(196,146,42,.25);--bdl:rgba(196,146,42,.12);}
*{margin:0;padding:0;box-sizing:border-box;}html,body{height:100%;overflow:hidden;}
body{background:var(--cr);color:var(--tx);font-family:'Lora',serif;display:flex;height:100vh;}
#sb{width:280px;flex-shrink:0;background:#F0EAD6;border-right:1px solid var(--bd);display:flex;flex-direction:column;height:100vh;overflow-y:auto;}
.sh{padding:26px 20px 18px;background:var(--vd);color:var(--cr);border-bottom:3px solid var(--ou);}
.sbrand{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:3px;color:var(--oul);margin-bottom:5px;}
.stitle{font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:700;line-height:1.2;color:var(--cr);}
.ssub{font-family:'DM Mono',monospace;font-size:9px;color:rgba(245,240,232,.5);letter-spacing:2px;margin-top:5px;}
.prog-a{padding:12px 18px 4px;}.prog-l{font-family:'DM Mono',monospace;font-size:9px;color:var(--tm2);letter-spacing:2px;margin-bottom:6px;display:flex;justify-content:space-between;}
.prog-t{height:4px;background:var(--cr3);border-radius:2px;overflow:hidden;}.prog-f{height:100%;background:linear-gradient(90deg,var(--v),var(--vl));transition:width .6s;}
.sg{padding:8px 0 4px;}.sgl{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:3px;color:var(--oud);padding:5px 18px 3px;}
.lb{width:100%;padding:9px 16px;background:none;border:none;border-left:3px solid transparent;font-family:'Lora',serif;font-size:13px;color:var(--tm);cursor:pointer;display:flex;align-items:center;gap:9px;transition:all .18s;text-align:left;}
.lb:hover{background:rgba(196,146,42,.08);color:var(--tx);}.lb.active{background:rgba(26,107,74,.09);color:var(--v);border-left-color:var(--v);font-weight:600;}
.ln{font-family:'DM Mono',monospace;font-size:10px;background:var(--cr3);padding:2px 7px;border-radius:3px;min-width:26px;text-align:center;color:var(--tm2);}
.lb.active .ln{background:rgba(26,107,74,.15);color:var(--v);}
.ts{padding:5px 10px 8px;border-top:1px solid var(--bdl);margin-top:5px;}.tsl{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:2px;color:var(--tm2);padding:5px 8px 3px;}
.tb{width:100%;padding:7px 10px;background:none;border:none;border-radius:5px;font-family:'DM Mono',monospace;font-size:10px;letter-spacing:1px;color:var(--tm2);cursor:pointer;display:flex;align-items:center;gap:7px;transition:all .18s;text-align:left;}
.tb:hover{background:rgba(196,146,42,.1);color:var(--tx);}.tb.active{background:rgba(26,107,74,.1);color:var(--v);font-weight:500;}.td{margin-left:auto;color:var(--v);font-size:11px;}
.sf{padding:12px 16px;border-top:1px solid var(--bd);margin-top:auto;background:rgba(196,146,42,.05);}
.stk{display:flex;align-items:center;gap:10px;padding:9px 12px;background:rgba(26,107,74,.08);border:1px solid var(--bd);border-radius:8px;}
.stn{font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:700;color:var(--v);}.stl{font-family:'DM Mono',monospace;font-size:9px;color:var(--tm2);letter-spacing:2px;}
#main{flex:1;height:100vh;overflow-y:auto;display:flex;flex-direction:column;}
.topbar{padding:15px 32px;background:#F0EAD6;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10;}
.tbt{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:700;color:var(--vd);}.tbs{font-family:'DM Mono',monospace;font-size:9px;color:var(--tm2);letter-spacing:2px;margin-top:2px;}
.sr{display:flex;gap:20px;}.sv{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:700;color:var(--ou);}.sl{font-family:'DM Mono',monospace;font-size:9px;color:var(--tm2);letter-spacing:1px;}
.cnt{padding:28px 32px;flex:1;}
.card{background:#fff;border:1px solid var(--bd);border-radius:10px;margin-bottom:20px;overflow:hidden;box-shadow:0 2px 16px rgba(26,107,74,.06);}
.ch{padding:14px 20px;border-bottom:1px solid var(--bdl);background:linear-gradient(135deg,rgba(26,107,74,.04),rgba(196,146,42,.04));display:flex;align-items:center;gap:11px;}
.ci{font-size:18px;}.ct{font-family:'Cormorant Garamond',serif;font-size:16px;font-weight:700;color:var(--vd);}.cd{font-family:'DM Mono',monospace;font-size:9px;color:var(--tm2);letter-spacing:1px;margin-top:2px;}
.cb{padding:20px;}.it{font-size:14px;line-height:1.85;color:var(--tm);margin-bottom:15px;}.it strong{color:var(--vd);}.it em{color:var(--oud);}
.tw{overflow-x:auto;margin:12px 0;}table{width:100%;border-collapse:collapse;font-size:13px;}
th{background:var(--vd);color:var(--cr);font-family:'DM Mono',monospace;font-size:10px;letter-spacing:2px;padding:8px 12px;text-align:left;}
td{padding:8px 12px;border-bottom:1px solid rgba(196,146,42,.1);vertical-align:top;}tr:last-child td{border-bottom:none;}tr:hover td{background:rgba(26,107,74,.03);}
.pt{font-family:'DM Mono',monospace;color:var(--v);font-weight:600;}.es{font-family:'DM Mono',monospace;color:var(--az);font-weight:600;}
h3{font-family:'Cormorant Garamond',serif;font-size:16px;color:var(--vd);margin:16px 0 8px;}h4{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:2px;color:var(--tm2);margin:12px 0 5px;}
.tag{display:inline-block;padding:2px 8px;border-radius:3px;font-family:'DM Mono',monospace;font-size:9px;font-weight:600;letter-spacing:.5px;white-space:nowrap;}
.tg{background:rgba(26,107,74,.12);color:var(--v);}.td2{background:rgba(196,146,42,.12);color:var(--oud);}.tc{background:rgba(139,42,26,.12);color:var(--vm);}
.tp{background:rgba(26,107,74,.18);color:var(--vd);}.te{background:rgba(44,78,122,.12);color:var(--az);}
.rb{background:rgba(44,78,122,.06);border:1px solid rgba(44,78,122,.2);border-left:3px solid var(--az);border-radius:0 8px 8px 0;padding:12px 15px;margin:12px 0;font-size:13px;line-height:1.75;color:var(--tm);}
.rb strong{color:var(--az);}
.tip{background:rgba(196,146,42,.07);border:1px solid rgba(196,146,42,.2);border-left:3px solid var(--ou);border-radius:0 8px 8px 0;padding:12px 15px;margin:12px 0;font-size:13px;line-height:1.75;color:var(--tm);}
.tip strong{color:var(--oud);}
.warn{background:rgba(139,42,26,.06);border:1px solid rgba(139,42,26,.18);border-left:3px solid var(--vm);border-radius:0 8px 8px 0;padding:12px 15px;margin:12px 0;font-size:13px;line-height:1.75;color:var(--tm);}
.warn strong{color:var(--vm);}
.cmp{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--bd);border-radius:8px;overflow:hidden;margin:12px 0;}
.cs{padding:13px 15px;}.cs:first-child{background:rgba(44,78,122,.05);border-right:1px solid var(--bd);}.cs:last-child{background:rgba(26,107,74,.05);}
.cl2{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:2px;font-weight:600;margin-bottom:7px;}.cs:first-child .cl2{color:var(--az);}.cs:last-child .cl2{color:var(--v);}
.cc{font-size:13px;line-height:1.8;}
.ab{display:inline-flex;align-items:center;gap:5px;background:rgba(26,107,74,.08);border:1px solid rgba(26,107,74,.25);color:var(--v);padding:5px 12px;border-radius:20px;font-family:'DM Mono',monospace;font-size:10px;letter-spacing:1px;cursor:pointer;transition:all .2s;margin:3px 2px 3px 0;}
.ab:hover{background:rgba(26,107,74,.18);}.ab.playing{background:var(--v);color:#fff;}
.vg{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:11px;margin-top:10px;}
.vc{background:var(--cr);border:1px solid var(--bd);border-radius:8px;padding:13px;transition:border-color .2s,box-shadow .2s;}
.vc:hover{border-color:var(--v);box-shadow:0 3px 10px rgba(26,107,74,.08);}
.vpt{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:700;color:var(--vd);}
.ves{font-family:'DM Mono',monospace;font-size:10px;color:var(--az);margin:2px 0 5px;}
.vex{font-size:12px;color:var(--tm2);font-style:italic;padding-left:7px;border-left:2px solid var(--bd);margin-top:6px;}
.vnt{font-family:'DM Mono',monospace;font-size:9px;color:var(--oud);margin-top:5px;}
.eb{background:var(--cr);border:1px solid var(--bd);border-radius:8px;padding:15px;margin-bottom:12px;}
.elb{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:2px;color:var(--tm2);margin-bottom:8px;}
.eq{font-size:14px;line-height:1.7;margin-bottom:10px;color:var(--tx);}
.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-bottom:9px;}
.opt{padding:9px 13px;background:#fff;border:1px solid var(--bd);border-radius:7px;color:var(--tm);font-family:'Lora',serif;font-size:13px;cursor:pointer;transition:all .18s;text-align:left;}
.opt:hover{background:rgba(26,107,74,.06);border-color:var(--v);}.opt.correct{background:rgba(26,107,74,.1);border-color:var(--v);color:var(--vd);}
.opt.wrong{background:rgba(139,42,26,.07);border-color:var(--vm);color:var(--vm);}.opt:disabled{cursor:not-allowed;}
.fb{padding:9px 13px;border-radius:7px;font-size:13px;line-height:1.6;margin-top:8px;display:none;}
.fb.show{display:block;}.fb.correct{background:rgba(26,107,74,.08);border:1px solid rgba(26,107,74,.22);}
.fb.wrong{background:rgba(139,42,26,.06);border:1px solid rgba(139,42,26,.18);}
.fbt{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:2px;margin-bottom:3px;}
.fb.correct .fbt{color:var(--v);}.fb.wrong .fbt{color:var(--vm);}
.fi{background:#fff;border:1px solid var(--bd);border-radius:6px;padding:8px 12px;color:var(--tx);font-family:'DM Mono',monospace;font-size:13px;width:100%;margin-bottom:8px;transition:border-color .2s;}
.fi:focus{outline:none;border-color:var(--v);}.fi.correct{border-color:var(--v);}.fi.wrong{border-color:var(--vm);}
.cbtn{background:var(--v);color:#fff;border:none;padding:9px 18px;border-radius:6px;font-family:'DM Mono',monospace;font-size:11px;letter-spacing:1px;cursor:pointer;transition:all .2s;}
.cbtn:hover{background:var(--vl);transform:translateY(-1px);}
.fcont{perspective:1000px;margin:16px auto;max-width:440px;}
.fc{width:100%;height:190px;position:relative;transform-style:preserve-3d;transition:transform .5s;cursor:pointer;}
.fc.flipped{transform:rotateY(180deg);}
.ff{position:absolute;width:100%;height:100%;backface-visibility:hidden;background:#fff;border:1px solid var(--bd);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center;box-shadow:0 2px 14px rgba(26,107,74,.06);}
.fb2{transform:rotateY(180deg);}.ff.front{border-color:var(--v);}
.fpt{font-family:'Cormorant Garamond',serif;font-size:30px;font-weight:700;color:var(--vd);margin-bottom:5px;}
.fph{font-family:'DM Mono',monospace;font-size:10px;color:var(--tm2);}
.fhi{font-family:'DM Mono',monospace;font-size:9px;color:var(--tm2);letter-spacing:2px;margin-top:5px;}
.fes{font-size:18px;font-weight:600;color:var(--tx);margin-bottom:6px;}
.fgr{font-family:'DM Mono',monospace;font-size:11px;color:var(--tm2);line-height:1.6;}
.srb{display:flex;gap:9px;justify-content:center;margin-top:10px;}
.srbt{padding:7px 17px;border-radius:7px;border:none;font-family:'DM Mono',monospace;font-size:10px;font-weight:600;letter-spacing:1px;cursor:pointer;transition:all .2s;}
.easy{background:rgba(26,107,74,.1);color:var(--v);border:1px solid rgba(26,107,74,.22);}
.mid{background:rgba(196,146,42,.1);color:var(--oud);border:1px solid rgba(196,146,42,.22);}
.hard{background:rgba(139,42,26,.08);color:var(--vm);border:1px solid rgba(139,42,26,.18);}
.srbt:hover{transform:translateY(-2px);filter:brightness(1.15);}
.fcc{font-family:'DM Mono',monospace;font-size:10px;color:var(--tm2);text-align:center;margin-top:9px;}
.dl{display:flex;gap:9px;margin-bottom:12px;align-items:flex-start;}
.spk{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:1px;padding:3px 7px;border-radius:4px;flex-shrink:0;margin-top:2px;}
.sa{background:rgba(44,78,122,.12);color:var(--az);}.sn{background:rgba(26,107,74,.12);color:var(--v);}.sg2{background:rgba(196,146,42,.12);color:var(--oud);}
.dpt{font-family:'DM Mono',monospace;font-size:13px;color:var(--tx);margin-bottom:2px;}.des{font-size:12px;color:var(--tm2);font-style:italic;}
.vs{background:var(--cr2);border:2px dashed var(--bd);border-radius:10px;padding:20px;margin-top:24px;text-align:center;transition:all .4s;}
.vs.ready{border-color:var(--v);border-style:solid;}.vs.done{background:rgba(26,107,74,.05);border-color:var(--v);border-style:solid;}
.vst{font-family:'Cormorant Garamond',serif;font-size:17px;color:var(--tm2);margin-bottom:5px;}
.vs.ready .vst,.vs.done .vst{color:var(--vd);}
.vsd{font-family:'DM Mono',monospace;font-size:10px;color:var(--tm2);letter-spacing:1px;margin-bottom:11px;}
.vsp{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:12px;}
.vpi{font-family:'DM Mono',monospace;font-size:9px;padding:3px 8px;border-radius:10px;}
.vpd{background:rgba(26,107,74,.1);color:var(--v);border:1px solid rgba(26,107,74,.22);}
.vpp{background:var(--cr3);color:var(--tm2);border:1px solid var(--bd);}
.vh2{font-family:'DM Mono',monospace;font-size:10px;color:var(--tm2);margin:6px 0 11px;}
.vb{padding:11px 26px;border-radius:9px;font-family:'DM Mono',monospace;font-size:11px;letter-spacing:2px;font-weight:600;transition:all .3s;border:2px solid;cursor:pointer;}
.vb.locked{background:var(--cr3);border-color:var(--bd);color:var(--tm2);cursor:not-allowed;}
.vb.active{background:var(--v);border-color:var(--v);color:#fff;box-shadow:0 4px 16px rgba(26,107,74,.22);}
.vb.active:hover{background:var(--vl);transform:translateY(-2px);}
.vb.validated{background:rgba(26,107,74,.08);border-color:var(--v);color:var(--v);cursor:default;}
.ub{display:none;margin-top:11px;padding:9px 14px;background:rgba(26,107,74,.08);border:1px solid rgba(26,107,74,.25);border-radius:6px;font-family:'DM Mono',monospace;font-size:10px;color:var(--v);letter-spacing:1px;}
.ub.show{display:block;}
.wa{width:100%;min-height:130px;background:#fff;border:1px solid var(--bd);border-radius:8px;padding:12px;color:var(--tx);font-family:'Lora',serif;font-size:14px;line-height:1.7;resize:vertical;transition:border-color .2s;margin-bottom:9px;}
.wa:focus{outline:none;border-color:var(--v);}
.cr2b{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:9px;}
.wc{background:var(--cr3);border:1px solid var(--bd);border-radius:5px;padding:5px 10px;font-family:'DM Mono',monospace;font-size:11px;color:var(--tm);cursor:pointer;transition:all .18s;user-select:none;}
.wc:hover{border-color:var(--v);color:var(--v);}.wc.used{opacity:.3;cursor:not-allowed;}
.az{min-height:40px;background:#fff;border:1px dashed var(--bd);border-radius:6px;padding:6px 10px;display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-bottom:9px;}
.ac{background:rgba(26,107,74,.1);border:1px solid rgba(26,107,74,.28);border-radius:5px;padding:4px 9px;font-family:'DM Mono',monospace;font-size:12px;color:var(--v);cursor:pointer;}
.ac:hover{background:rgba(139,42,26,.07);border-color:var(--vm);color:var(--vm);}
.toast{position:fixed;bottom:22px;right:22px;background:var(--vd);border:1px solid var(--ou);border-radius:8px;padding:11px 16px;font-family:'DM Mono',monospace;font-size:12px;color:var(--cr);transform:translateY(70px);opacity:0;transition:all .35s;z-index:1000;}
.toast.show{transform:translateY(0);opacity:1;}
.expbtn{background:rgba(26,107,74,.08);border:1px solid rgba(26,107,74,.28);color:var(--v);padding:8px 16px;border-radius:6px;font-family:'DM Mono',monospace;font-size:10px;letter-spacing:1px;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:7px;}
.expbtn:hover{background:rgba(26,107,74,.16);transform:translateY(-1px);}
::-webkit-scrollbar{width:4px;}::-webkit-scrollbar-track{background:var(--cr2);}::-webkit-scrollbar-thumb{background:var(--cr3);border-radius:2px;}

</style>
</head>
<body>
<nav id="sb">
  <div class="sh">
    <div class="sbrand">PROGRAMA DE PORTUGUÊS</div>
    <div class="stitle">De Español<br>ao Português</div>
    <div class="ssub">4 SEMANAS · RITMO PRÓPRIO · 16 LIÇÕES</div>
  </div>
  <div class="prog-a">
    <div class="prog-l"><span>PROGRESSO GERAL</span><span id="pct">0%</span></div>
    <div class="prog-t"><div class="prog-f" id="pf" style="width:0%"></div></div>
  </div>
  <div id="nav"></div>
  <div class="ts" id="ts"><div class="tsl">SEÇÕES DA LIÇÃO</div></div>
  <div class="sf">
    <div class="stk">
      <div><div class="stn" id="stn">0</div><div class="stl">LIÇÕES COMPLETAS</div></div>
      <div style="margin-left:auto;font-size:26px;">🌿</div>
    </div>
  </div>
</nav>
<main id="main">
  <div class="topbar">
    <div>
      <div class="tbt" id="ttl">Português para Hispanohablantes</div>
      <div class="tbs" id="tsub">SELECCIONA UNA LECCIÓN PARA EMPEZAR</div>
    </div>
    <div class="sr">
      <div><div class="sv" id="sw">0</div><div class="sl">PALABRAS</div></div>
      <div><div class="sv" id="se">0</div><div class="sl">EJERCICIOS</div></div>
      <div><div class="sv" id="sm">0</div><div class="sl">MIN</div></div>
    </div>
  </div>
  <div class="cnt" id="mc"></div>
</main>
<div class="toast" id="toast"></div>

<script>
const syn=window.speechSynthesis;let ptv=null;
function initV(){const vs=syn.getVoices();ptv=vs.find(v=>v.lang==='pt-BR')||vs.find(v=>v.lang.startsWith('pt'))||null;}
if(syn){syn.onvoiceschanged=initV;initV();}
function speak(t,btn){
  if(!syn)return;syn.cancel();
  const playing=btn&&btn.classList.contains('playing');
  document.querySelectorAll('.ab.playing').forEach(b=>{b.classList.remove('playing');if(b._o)b.innerHTML=b._o;});
  if(playing)return;
  const u=new SpeechSynthesisUtterance(t);
  if(ptv)u.voice=ptv;u.lang='pt-BR';u.rate=0.8;
  if(btn){btn._o=btn.innerHTML;btn.classList.add('playing');btn.innerHTML='🔊 ...';
    u.onend=u.onerror=()=>{btn.classList.remove('playing');if(btn._o)btn.innerHTML=btn._o;};}
  syn.speak(u);
  if(S.cl&&S.ct==='simulacao')addP(S.cl,'simulacao',1);
}

const TABS=['gramatica','vocabulario','exercicios','flashcards','simulacao','producao'];
const TL={gramatica:'📐 GRAMÁTICA',vocabulario:'📚 VOCABULARIO',exercicios:'⚡ EJERCICIOS',flashcards:'🃏 FLASHCARDS',simulacao:'🎭 SIMULACIÓN',producao:'✍️ PRODUCCIÓN'};
const TR={gramatica:{min:1},vocabulario:{min:1},exercicios:{min:5,label:'Acierta al menos 5 ({p}/5)'},flashcards:{min:6,label:'Revisa al menos 6 ({p}/6)'},simulacao:{min:2,label:'Escucha al menos 2 ({p}/2)'},producao:{min:1,label:'Escribe y analiza'}};
let S={cl:null,ct:'gramatica',td:{},vl:[],tp:{},ex:0,wl:0,min:0,timer:null};
function lS(){try{const d=localStorage.getItem('pth3');if(d){const p=JSON.parse(d);S={...S,...p};}}catch(e){}}
function sS(){try{localStorage.setItem('pth3',JSON.stringify({cl:S.cl,ct:S.ct,td:S.td,vl:S.vl,tp:S.tp,ex:S.ex,wl:S.wl,min:S.min}));}catch(e){}}
lS();
function pk(l,t){return l+'-'+t;}
function gP(l,t){return S.tp[pk(l,t)]||0;}
function addP(l,t,n){const k=pk(l,t);S.tp[k]=(S.tp[k]||0)+n;sS();updV(l,t);}
function isOk(l,t){if(S.td[l]&&S.td[l][t])return true;return gP(l,t)>=(TR[t].min||1);}
function updV(l,t){
  if(S.cl!==l||S.ct!==t)return;
  const btn=document.getElementById('vb-'+l+'-'+t);
  const hint=document.getElementById('vh-'+l+'-'+t);
  if(!btn)return;
  if(S.td[l]&&S.td[l][t]){btn.className='vb validated';btn.innerHTML='✓ COMPLETADO';btn.disabled=true;if(hint)hint.style.display='none';return;}
  const ok=isOk(l,t);const p=gP(l,t);
  if(ok){btn.className='vb active';btn.disabled=false;if(hint)hint.style.display='none';}
  else{btn.className='vb locked';btn.disabled=true;
    if(hint&&TR[t].label){hint.style.display='block';hint.textContent='🔒 '+TR[t].label.replace('{p}',p);}}
}

const GR={
L1:{icon:'🔵',title:'ser — Ser / Estar de identidad',html:`<div class="it">Como hispanohablante, ya conoces <strong>ser</strong>. En portugués funciona casi igual. Solo hay que aprender dónde diverge.</div>
<div class="tip"><strong>💡 Ventaja:</strong> Más del 85% del uso de "ser" es idéntico al español.</div>
<h3>Conjugación</h3>
<div class="tw"><table><thead><tr><th>PRONOMBRE</th><th>PT</th><th>ES</th><th>NOTA</th></tr></thead><tbody>
<tr><td>eu</td><td class="pt">sou</td><td class="es">soy</td><td><span class="tag td2">diferente</span></td></tr>
<tr><td>você/ele/ela</td><td class="pt">é</td><td class="es">eres/es</td><td><span class="tag tc">2sg=3sg!</span></td></tr>
<tr><td>nós</td><td class="pt">somos</td><td class="es">somos</td><td><span class="tag tg">igual</span></td></tr>
<tr><td>vocês/eles</td><td class="pt">são</td><td class="es">son</td><td><span class="tag td2">-ão nasal</span></td></tr>
</tbody></table></div>
<button class="ab" onclick="speak('sou, é, somos, são',this)">🔊 Ouvir conjugação</button>
<div class="warn">⚠️ <strong>você é</strong> (tú eres) y <strong>ele é</strong> (él es) usan la misma forma.</div>
<h3>Usos idénticos</h3>
<div class="tw"><table><thead><tr><th>USO</th><th>EXEMPLO</th><th>ESPAÑOL</th></tr></thead><tbody>
<tr><td>Identidad</td><td class="pt">Sou Ana.</td><td>Soy Ana.</td></tr>
<tr><td>Origen</td><td class="pt">Sou do Brasil.</td><td>Soy de Brasil.</td></tr>
<tr><td>Profesión</td><td class="pt">Sou professor/a.</td><td>Soy profesor/a.</td></tr>
<tr><td>Hora</td><td class="pt">São duas horas.</td><td>Son las dos.</td></tr>
</tbody></table></div>
<button class="ab" onclick="speak('Sou do Brasil. Sou professor. São duas horas.',this)">🔊 Exemplos</button>
<div class="tip">💡 <strong>Estado civil:</strong> "Sou casado/a" — PT usa SER para estado civil, a diferencia del español.</div>`},
L2:{icon:'🟡',title:'estar — Estado y ser×estar',html:`<div class="it">El contraste <strong>ser × estar</strong> existe igual en PT. La diferencia: algunos casos donde PT prefiere SER.</div>
<h3>Conjugación</h3>
<div class="tw"><table><thead><tr><th>PT</th><th>ES</th></tr></thead><tbody>
<tr><td class="pt">estou</td><td class="es">estoy</td></tr>
<tr><td class="pt">está</td><td class="es">estás/está</td></tr>
<tr><td class="pt">estamos</td><td class="es">estamos</td></tr>
<tr><td class="pt">estão</td><td class="es">están</td></tr>
</tbody></table></div>
<button class="ab" onclick="speak('estou, está, estamos, estão',this)">🔊 Ouvir estar</button>
<h3>El saludo más importante</h3>
<div class="rb"><strong>Tudo bem?</strong> = ¿Todo bien? (saludo universal BR)<br><strong>Tudo bom!</strong> = ¡Todo bien! (respuesta)<br><strong>E você?</strong> = ¿Y tú?</div>
<button class="ab" onclick="speak('Tudo bem? Tudo bom, e você? Estou bem, obrigado!',this)">🔊 Saludo cotidiano</button>
<div class="cmp"><div class="cs"><div class="cl2">🇪🇸 ESPAÑOL</div><div class="cc">Estoy casado/a.<br>¿Dónde estás?</div></div>
<div class="cs"><div class="cl2">🇧🇷 PORTUGUÊS</div><div class="cc"><span class="pt">Sou casado/a.</span> (estado civil)<br><span class="pt">Onde você está?</span></div></div></div>`},
L3:{icon:'🟢',title:'ter — Tener + reemplaza haber',html:`<div class="it"><strong>ter</strong> hace el trabajo de <em>tener</em> Y de <em>haber</em> en PT moderno.</div>
<h3>Conjugación</h3>
<div class="tw"><table><thead><tr><th>PT</th><th>ES</th></tr></thead><tbody>
<tr><td class="pt">tenho</td><td class="es">tengo</td></tr>
<tr><td class="pt">tem</td><td class="es">tienes/tiene</td></tr>
<tr><td class="pt">temos</td><td class="es">tenemos</td></tr>
<tr><td class="pt">têm</td><td class="es">tienen</td></tr>
</tbody></table></div>
<button class="ab" onclick="speak('tenho, tem, temos, têm',this)">🔊 Ouvir ter</button>
<div class="cmp"><div class="cs"><div class="cl2">🇪🇸 HABER</div><div class="cc">Hay una farmacia.<br>No hay problema.</div></div>

<div class="warn">⚠️ <strong>tem vs têm:</strong> tem (él tiene) vs têm (ellos tienen). Misma pronunciación, diferente significado.</div>`},
L4:{icon:'🔧',title:'fazer — Hacer + expresiones fijas',html:`<div class="it"><strong>fazer</strong> = hacer. Irregular en 1sg (faço).</div>
<div class="tw"><table><thead><tr><th>PT</th><th>ES</th></tr></thead><tbody>
<tr><td class="pt">faço</td><td class="es">hago</td></tr>
<tr><td class="pt">faz</td><td class="es">haces/hace</td></tr>
<tr><td class="pt">fazemos</td><td class="es">hacemos</td></tr>
<tr><td class="pt">fazem</td><td class="es">hacen</td></tr>
</tbody></table></div>
<button class="ab" onclick="speak('faço, faz, fazemos, fazem',this)">🔊 Ouvir fazer</button>
<div class="tw"><table><thead><tr><th>EXPRESSÃO</th><th>ESPAÑOL</th></tr></thead><tbody>
<tr><td class="pt">Faz calor/frio.</td><td>Hace calor/frío.</td></tr>
<tr><td class="pt">Faz sentido.</td><td>Tiene sentido.</td></tr>
<tr><td class="pt">Não faz mal.</td><td>No importa / No pasa nada.</td></tr>
<tr><td class="pt">Tanto faz.</td><td>Me da igual.</td></tr>
<tr><td class="pt">Faz um mês que...</td><td>Hace un mes que...</td></tr>
</tbody></table></div>
<div class="tip">💡 <strong>Pretérito:</strong> fiz (hice) / fez (hizo)</div>`},
L5:{icon:'🚶',title:'ir + vir — Ir y Venir',html:`<div class="it"><strong>ir</strong> = ir. <strong>vir</strong> = venir. Lo más valioso: <strong>vou + infinitivo = futuro próximo</strong>.</div>
<div class="cmp"><div class="cs"><div class="cl2">IR</div><div class="cc"><span class="pt">vou / vai / vamos / vão</span></div></div>
<div class="cs"><div class="cl2">VIR</div><div class="cc"><span class="pt">venho / vem / vimos / vêm</span></div></div></div>
<button class="ab" onclick="speak('vou vai vamos vão. venho vem vimos vêm.',this)">🔊 ir e vir</button>
<div class="rb"><strong>vou + infinitivo</strong> = voy a + infinitivo (¡sin "a"!)<br>
<span class="pt">Vou estudar amanhã.</span> = Voy a estudiar mañana.</div>
<div class="cmp"><div class="cs"><div class="cl2">AO/À — ida rápida</div><div class="cc"><span class="pt">Vou ao mercado.</span><br>Vuelvo pronto</div></div>
<div class="cs"><div class="cl2">PARA — estadía larga</div><div class="cc"><span class="pt">Vou para o Brasil.</span><br>Viaje o cambio permanente</div></div></div>`},
L6:{icon:'💪',title:'poder + querer — Los modales',html:`<div class="it">Los modales funcionan igual que en español: <strong>modal + infinitivo</strong> sin preposición.</div>
<div class="cmp"><div class="cs"><div class="cl2">PODER</div><div class="cc"><span class="pt">posso / pode / podemos / podem</span></div></div>
<div class="cs"><div class="cl2">QUERER</div><div class="cc"><span class="pt">quero / quer / queremos / querem</span></div></div></div>
<button class="ab" onclick="speak('posso pode podemos podem. quero quer queremos querem.',this)">🔊 Ouvir</button>
<div class="tw"><table><thead><tr><th>PT</th><th>ES</th></tr></thead><tbody>
<tr><td class="pt">Posso falar com você?</td><td>¿Puedo hablar contigo?</td></tr>
<tr><td class="pt">Quero ir ao cinema.</td><td>Quiero ir al cine.</td></tr>
<tr><td class="pt">Pode ser.</td><td>Puede ser / Quizás.</td></tr>
<tr><td class="pt">Preciso de ajuda.</td><td>Necesito ayuda.</td></tr>
</tbody></table></div>
<div class="tip">💡 <strong>"Pode ser"</strong> = puede ser / quizás. Expresión cotidiana.</div>`},
L7:{icon:'🗣️',title:'falar + entender — Comunicación',html:`<div class="it"><strong>falar</strong> sigue el patrón -AR. <strong>entender</strong> sigue el patrón -ER.</div>
<div class="cmp"><div class="cs"><div class="cl2">-AR (falar)</div><div class="cc"><span class="pt">falo / fala / falamos / falam</span><br><span style="font-size:11px;color:var(--tm2)">-o / -a / -amos / -am</span></div></div>
<div class="cs"><div class="cl2">-ER (entender)</div><div class="cc"><span class="pt">entendo / entende / entendemos / entendem</span></div></div></div>
<div class="rb"><strong>Patrón -AR:</strong> falar, trabalhar, morar, estudar, gostar, precisar... ¡todos iguales!</div>
<div class="tw"><table><thead><tr><th>SUPERVIVÊNCIA</th><th>ES</th></tr></thead><tbody>
<tr><td class="pt">Não entendo.</td><td>No entiendo.</td></tr>
<tr><td class="pt">Pode repetir?</td><td>¿Puede repetir?</td></tr>
<tr><td class="pt">Fala mais devagar.</td><td>Habla más despacio.</td></tr>
<tr><td class="pt">Como se diz?</td><td>¿Cómo se dice?</td></tr>
</tbody></table></div>
<button class="ab" onclick="speak('Não entendo. Pode repetir? Fala mais devagar, por favor.',this)">🔊 Sobrevivência</button>`},
L8:{icon:'🍽️',title:'comer + beber — En el restaurante',html:`<div class="it"><strong>comer</strong> y <strong>beber</strong> siguen el patrón -ER.</div>
<div class="cmp"><div class="cs"><div class="cl2">COMER</div><div class="cc"><span class="pt">como / come / comemos / comem</span></div></div>
<div class="cs"><div class="cl2">BEBER</div><div class="cc"><span class="pt">bebo / bebe / bebemos / bebem</span></div></div></div>
<div class="tw"><table><thead><tr><th>PT</th><th>ES</th></tr></thead><tbody>
<tr><td class="pt">Quero um cafezinho sem açúcar.</td><td>Quiero un cafecito sin azúcar.</td></tr>
<tr><td class="pt">A conta, por favor.</td><td>La cuenta, por favor.</td></tr>
<tr><td class="pt">Está gostoso!</td><td>¡Está delicioso!</td></tr>
<tr><td class="pt">Não como carne.</td><td>No como carne.</td></tr>
<tr><td class="pt">Bom apetite!</td><td>¡Buen provecho!</td></tr>
</tbody></table></div>
<div class="tip">💡 <strong>Gênero sorpresa:</strong> "o leite" (la leche), "o açúcar" (el azúcar) — masculinos en PT.</div>`},
L9:{icon:'🧠',title:'saber + conhecer — Saber y Conocer',html:`<div class="it">¡Buenas noticias! La distinción funciona <em>exactamente igual</em> que en español.</div>
<div class="cmp"><div class="cs"><div class="cl2">SABER — info/habilidad</div><div class="cc"><span class="pt">sei / sabe / sabemos / sabem</span><br>Sei falar. / Não sei onde fica.</div></div>
<div class="cs"><div class="cl2">CONHECER — persona/lugar</div><div class="cc"><span class="pt">conheço / conhece / conhecemos / conhecem</span><br>Conheço o Brasil.</div></div></div>
<button class="ab" onclick="speak('Sei falar português. Conheço o Brasil. Não sei. Sei lá!',this)">🔊 Ouvir</button>
<div class="tip">💡 <strong>"Sei lá!"</strong> = ¡Qué sé yo! / ¡Ni idea! Expresión muy brasileña.</div>`},
L10:{icon:'❤️',title:'gostar de — El gustar del portugués',html:`<div class="it"><strong>gostar</strong> = gustar, pero el sujeto es quien experimenta el gusto.</div>
<div class="cmp"><div class="cs"><div class="cl2">🇪🇸 ESPAÑOL</div><div class="cc"><em>Me</em> gusta el café.<br><em>Te</em> gustan las películas.</div></div>
<div class="cs"><div class="cl2">🇧🇷 PORTUGUÊS</div><div class="cc">Eu <span class="pt">gosto de</span> café.<br>Você <span class="pt">gosta de</span> filmes?</div></div></div>
<div class="warn">⚠️ <strong>DE es obligatorio siempre:</strong> ✅ Gosto de música. ❌ Gosto música.</div>
<div class="tw"><table><thead><tr><th>INTENSIDAD</th><th>ES</th></tr></thead><tbody>
<tr><td class="pt">Adoro!</td><td>¡Me encanta! (sin DE)</td></tr>
<tr><td class="pt">Gosto muito de</td><td>Me gusta mucho</td></tr>
<tr><td class="pt">Não gosto de</td><td>No me gusta</td></tr>
<tr><td class="pt">Detesto</td><td>Odio / Detesto</td></tr>
</tbody></table></div>
<button class="ab" onclick="speak('Eu gosto de café. Adoro chocolate! Não gosto de chuva.',this)">🔊 gostar em uso</button>`},
L11:{icon:'📜',title:'Pretérito Perfeito — El pasado',html:`<div class="it">El pretérito más usado. Terminaciones similares al español — y varios irregulares son idénticos.</div>
<div class="cmp"><div class="cs"><div class="cl2">-AR (falar)</div><div class="cc">eu <span class="pt">falei</span> (hablé)<br>você <span class="pt">falou</span> (habló)<br>eles <span class="pt">falaram</span></div></div>
<div class="cs"><div class="cl2">-ER/-IR (comer)</div><div class="cc">eu <span class="pt">comi</span> (comí)<br>você <span class="pt">comeu</span> (comió)<br>eles <span class="pt">comeram</span></div></div></div>
<div class="tw"><table><thead><tr><th>IRRUG.</th><th>EU</th><th>ELE</th><th>VS. ES</th></tr></thead><tbody>
<tr><td class="pt">ser/ir</td><td class="pt">fui</td><td class="pt">foi</td><td><span class="tag tg">fui/fue IGUAL</span></td></tr>
<tr><td class="pt">ter</td><td class="pt">tive</td><td class="pt">teve</td><td><span class="tag tg">tuve/tuvo IGUAL</span></td></tr>
<tr><td class="pt">fazer</td><td class="pt">fiz</td><td class="pt">fez</td><td><span class="tag tg">hice/hizo</span></td></tr>
<tr><td class="pt">ver</td><td class="pt">vi</td><td class="pt">viu</td><td><span class="tag tg">vi/vio</span></td></tr>
</tbody></table></div>
<button class="ab" onclick="speak('Ontem fui ao mercado. Comi bem. Fiz tudo. Não tive tempo.',this)">🔊 Pretérito</button>
<div class="tip">💡 ontem=ayer · já=ya · ainda não=todavía no</div>`},
L12:{icon:'📝',title:'Artigos + Gênero — o/a/os/as',html:`<div class="it">Los artículos son casi iguales al español. El reto: <strong>contracciones obligatorias</strong> y géneros que difieren.</div>
<div class="tw"><table><thead><tr><th>PREP+ART</th><th>RESULTADO</th><th>EJEMPLO</th></tr></thead><tbody>
<tr><td>a + o</td><td class="pt">ao</td><td class="pt">Vou ao banco.</td></tr>
<tr><td>a + a</td><td class="pt">à</td><td class="pt">Vou à farmácia.</td></tr>
<tr><td>de + o</td><td class="pt">do</td><td class="pt">Sou do Brasil.</td></tr>
<tr><td>de + a</td><td class="pt">da</td><td class="pt">Sou da Argentina.</td></tr>
<tr><td>em + o</td><td class="pt">no</td><td class="pt">Estou no banco.</td></tr>
<tr><td>em + a</td><td class="pt">na</td><td class="pt">Estou na farmácia.</td></tr>
<tr><td>por + o</td><td class="pt">pelo</td><td class="pt">Obrigado pelo café.</td></tr>
<tr><td>por + a</td><td class="pt">pela</td><td class="pt">Obrigado pela ajuda.</td></tr>
</tbody></table></div>
<button class="ab" onclick="speak('Vou ao banco. Sou do Brasil. Estou na escola.',this)">🔊 Contrações</button>
<div class="warn">⚠️ Géneros distintos: <strong>o leite, o sal, o mel</strong> (masc. en PT, fem. en ES). <strong>a cor, a dor</strong> (fem. en PT, masc. en ES).</div>`},
L13:{icon:'🌸',title:'Diminutivo — el alma del portugués',html:`<div class="it">El diminutivo <strong>-inho/-inha</strong> es omnipresente en BR. No solo indica tamaño pequeño — transmite <em>afecto, cercanía, suavidad</em>.</div>
<div class="rb"><strong>Regla general:</strong> quitar -o/-a, añadir <strong>-inho/-inha</strong><br>
rápido → rapidinho &nbsp; beijo → beijinho &nbsp; bonito → bonitinho<br><br>
<strong>Con -z- cuando la vocal es acentuada:</strong><br>
café → cafe<strong>z</strong>inho &nbsp; avó → avo<strong>z</strong>inha</div>
<div class="tw"><table><thead><tr><th>USO</th><th>EJEMPLO</th><th>CONTEXTO</th></tr></thead><tbody>
<tr><td>Afecto</td><td class="pt">beijinho!</td><td>¡besito! (al despedirse)</td></tr>
<tr><td>Suavizar</td><td class="pt">Um momentinho.</td><td>Un momentito. (cortesía)</td></tr>
<tr><td>Coloquial</td><td class="pt">agorinha</td><td>ahorita</td></tr>
<tr><td>Cultural</td><td class="pt">cafezinho</td><td>el ritual del café BR</td></tr>
</tbody></table></div>
<button class="ab" onclick="speak('Um cafezinho, por favor! Um momentinho. Que bonitinho! Rapidinho.',this)">🔊 Diminutivos</button>
<div class="tip">💡 <strong>Saudade</strong> = nostalgia/añoranza amorosa. Concepto único del PT. "Que saudade de você!"</div>`},
L14:{icon:'🔄',title:'Verbos reflexivos — el "se" em PT',html:`<div class="it">Los reflexivos existen igual que en español. Diferencia principal: en BR el pronombre va <strong>antes</strong> del verbo.</div>
<div class="cmp"><div class="cs"><div class="cl2">🇧🇷 BRASIL</div><div class="cc"><span class="pt">Me chamo Ana.</span><br><span class="pt">Me levanto cedo.</span><br>Pronombre <strong>ANTES</strong></div></div>
<div class="cs"><div class="cl2">🇵🇹 PORTUGAL</div><div class="cc"><span class="pt">Chamo-me Ana.</span><br><span class="pt">Levanto-me cedo.</span><br>Pronombre <strong>DESPUÉS</strong></div></div></div>
<div class="tw"><table><thead><tr><th>VERBO PT</th><th>ES</th><th>EJEMPLO BR</th></tr></thead><tbody>
<tr><td class="pt">chamar-se</td><td>llamarse</td><td class="pt">Me chamo Ana.</td></tr>
<tr><td class="pt">sentir-se</td><td>sentirse</td><td class="pt">Me sinto bem.</td></tr>
<tr><td class="pt">levantar-se</td><td>levantarse</td><td class="pt">Me levanto às 7h.</td></tr>
<tr><td class="pt">esquecer-se</td><td>olvidarse</td><td class="pt">Me esqueci!</td></tr>
</tbody></table></div>
<button class="ab" onclick="speak('Me chamo Ana. Me sinto bem. Me esqueci! Vamos embora!',this)">🔊 Reflexivos</button>`},
L15:{icon:'🔁',title:'Revisão — Todo junto',html:`<div class="it">Sin contenido nuevo. El objetivo es <strong>conectar todo</strong> y producir frases naturales.</div>
<div class="tw"><table><thead><tr><th>VERBO</th><th>1SG</th><th>3SG</th><th>CLAVE</th></tr></thead><tbody>
<tr><td class="pt">ser</td><td class="pt">sou</td><td class="pt">é</td><td>identidad</td></tr>
<tr><td class="pt">estar</td><td class="pt">estou</td><td class="pt">está</td><td>estado/lugar</td></tr>
<tr><td class="pt">ter</td><td class="pt">tenho</td><td class="pt">tem</td><td>tener+hay</td></tr>
<tr><td class="pt">fazer</td><td class="pt">faço</td><td class="pt">faz</td><td>hacer+expr.</td></tr>
<tr><td class="pt">ir</td><td class="pt">vou</td><td class="pt">vai</td><td>ir+futuro</td></tr>
<tr><td class="pt">poder</td><td class="pt">posso</td><td class="pt">pode</td><td>poder+inf</td></tr>
<tr><td class="pt">querer</td><td class="pt">quero</td><td class="pt">quer</td><td>querer+inf</td></tr>
<tr><td class="pt">falar</td><td class="pt">falo</td><td class="pt">fala</td><td>padrão -AR</td></tr>
<tr><td class="pt">comer</td><td class="pt">como</td><td class="pt">come</td><td>padrão -ER</td></tr>
<tr><td class="pt">gostar</td><td class="pt">gosto de</td><td class="pt">gosta de</td><td>sempre DE</td></tr>
<tr><td class="pt">saber</td><td class="pt">sei</td><td class="pt">sabe</td><td>info/habilidad</td></tr>
<tr><td class="pt">conhecer</td><td class="pt">conheço</td><td class="pt">conhece</td><td>persona/lugar</td></tr>
</tbody></table></div>
<button class="ab" onclick="speak('sou estou tenho faço vou posso quero falo como gosto de sei conheço',this)">🔊 1sg de todos</button>`},
L16:{icon:'🏆',title:'Prova Final — Fluência Real',html:`<div class="it">Lección de consolidación. Solo producción y demostración de todo lo aprendido.</div>
<div class="tw"><table><thead><tr><th>ITEM</th><th>TEST RÁPIDO</th></tr></thead><tbody>
<tr><td>ser vs estar</td><td class="pt">Sou casado. / Estou cansado.</td></tr>
<tr><td>ter = hay</td><td class="pt">Tem uma farmácia aqui?</td></tr>
<tr><td>Futuro próximo</td><td class="pt">Vou estudar amanhã.</td></tr>
<tr><td>gostar DE</td><td class="pt">Gosto de café. (DE obrigatório)</td></tr>
<tr><td>saber vs conhecer</td><td class="pt">Sei falar. / Conheço o Brasil.</td></tr>
<tr><td>Pretérito</td><td class="pt">Fui / fiz / comi / falei.</td></tr>
<tr><td>Contracciones</td><td class="pt">ao/à/do/da/no/na</td></tr>
<tr><td>Diminutivo</td><td class="pt">cafezinho, momentinho</td></tr>
<tr><td>Reflexivos BR</td><td class="pt">Me chamo / Me sinto bem.</td></tr>
</tbody></table></div>
<button class="ab" onclick="speak('Sou estudante de português. Estou bem. Tenho muito a aprender. Vou continuar!',this)">🔊 Discurso final</button>
<div class="tip">🏆 <strong>Completaste o curso!</strong> Dominas 12 verbos, ser/estar/ter/fazer, gostar DE, diminutivos, contracciones y conversación básica autónoma.</div>`}
};

// RENDER ENGINE
function renderNav(){
  let h='';
  SEMS.forEach(s=>{
    h+=`<div class="sg"><div class="sgl">${s.s}</div>`;
    s.ls.forEach(l=>{
      const done=S.vl.includes(l.id);
      const act=S.cl===l.id;
      h+=`<button class="lb ${act?'active':''} ${done?'done':''}" onclick="switchL('${l.id}')">
        <span class="ln">${l.id}</span>${l.t}
        <span style="margin-left:auto;font-size:11px;color:var(--v)">${done?'✓':''}</span>
      </button>`;
    });
    h+='</div>';
  });
  document.getElementById('nav').innerHTML=h;
}

function renderTabs(){
  if(!S.cl){document.getElementById('ts').innerHTML='<div class="tsl">SEÇÕES DA LIÇÃO</div>';return;}
  let h='<div class="tsl">SEÇÕES DA LIÇÃO</div>';
  TABS.forEach(t=>{
    const done=S.td[S.cl]&&S.td[S.cl][t];
    const act=S.ct===t;
    h+=`<button class="tb ${act?'active':''}" onclick="switchTab('${t}')">
      <span>${TL[t]}</span>${done?'<span class="td">✓</span>':''}
    </button>`;
  });
  document.getElementById('ts').innerHTML=h;
}

function renderProgress(){
  const total=ALL.length*TABS.length;
  let done=0;
  Object.values(S.td).forEach(d=>done+=Object.values(d).filter(Boolean).length);
  const pct=Math.round(done/total*100);
  document.getElementById('pf').style.width=pct+'%';
  document.getElementById('pct').textContent=pct+'%';
  document.getElementById('stn').textContent=S.vl.length;
  document.getElementById('sw').textContent=S.wl;
  document.getElementById('se').textContent=S.ex;
  document.getElementById('sm').textContent=S.min;
}

function buildVocab(lid){
  const cards=FC[lid]||[];
  let h=`<div class="card"><div class="ch"><span class="ci">📚</span><div><div class="ct">Vocabulário Essencial</div><div class="cd">10 EXPRESSÕES · CLIQUE PARA OUVIR</div></div></div><div class="cb"><div class="vg">`;
  cards.forEach((c,i)=>{
    h+=`<div class="vc">
      <div style="display:flex;align-items:start;justify-content:space-between">
        <div class="vpt">${c.pt}</div>
        <button class="ab" style="margin:0" onclick="speak('${c.pt.replace(/'/g,"\\'")}',this)">🔊</button>
      </div>
      <div class="ves">= ${c.es}</div>
      <div class="vnt">${c.g}</div>
    </div>`;
  });
  h+='</div>';
  const allT=cards.map(c=>c.pt).join('. ');
  h+=`<div style="margin-top:14px"><button class="ab" onclick="speak('${allT.replace(/'/g,"\\'")}',this)">🔊 Ouvir todas</button></div>`;
  h+='</div></div>';
  return h;
}

function buildEx(lid){
  const exs=EX[lid]||[];
  let h=`<div class="card"><div class="ch"><span class="ci">⚡</span><div><div class="ct">Ejercicios</div><div class="cd">COMPLETA · SELECCIONA · ORDENA — mínimo 5 correctos</div></div></div><div class="cb">`;
  exs.forEach((e,i)=>{
    h+=`<div class="eb" id="eb${lid}${i}"><div class="elb">EX. ${i+1} — `;
    if(e.t==='mc')h+='ESCOLHA MÚLTIPLA';
    else if(e.t==='fill')h+='COMPLETAR';
    else h+='ORDENAR';
    h+=`</div><div class="eq">${e.q}</div>`;
    if(e.t==='mc'){
      h+=`<div class="opts">`;
      (e.o||[]).forEach((op,j)=>{
        h+=`<button class="opt" onclick="checkMC('${lid}',${i},${j})" id="opt${lid}${i}${j}">${op}</button>`;
      });
      h+=`</div>`;
    } else if(e.t==='fill'){
      h+=`<input class="fi" id="fi${lid}${i}" placeholder="Escribe en português..." onkeydown="if(event.key==='Enter')checkFill('${lid}',${i})">
      <button class="cbtn" onclick="checkFill('${lid}',${i})">Verificar</button>`;
    } else if(e.t==='reorder'){
      const ws=e.w||[];
      h+=`<div class="cr2b" id="wpool${lid}${i}">`;
      ws.forEach((w,j)=>h+=`<span class="wc" id="wc${lid}${i}${j}" onclick="addWord('${lid}',${i},${j},'${w.replace(/'/g,"\\'")}',this)">${w}</span>`);
      h+=`</div><div class="az" id="az${lid}${i}"></div>
      <button class="cbtn" onclick="checkReorder('${lid}',${i})">Verificar</button>`;
    }
    h+=`<div class="fb" id="fb${lid}${i}"><div class="fbt" id="fbt${lid}${i}"></div><div id="fbm${lid}${i}"></div></div>`;
    h+='</div>';
  });
  h+='</div></div>';
  return h;
}

function buildFC(lid){
  const cards=FC[lid]||[];
  const ci=S.ci[lid]||0;
  const c=cards[ci];
  if(!c)return'';
  const rev=(S.tp[pk(lid,'flashcards')]||0);
  let h=`<div class="card"><div class="ch"><span class="ci">🃏</span><div><div class="ct">Flashcards</div><div class="cd">CARD ${ci+1}/${cards.length} · ${rev} REVISADOS · CLIQUE PARA VIRAR</div></div></div><div class="cb">`;
  h+=`<div class="fcont"><div class="fc" id="fc${lid}" onclick="flipCard()">
    <div class="ff front"><div class="fpt">${c.pt}</div>
      <div class="fhi">← CLIQUE PARA VER TRADUÇÃO →</div>
    </div>
    <div class="ff fb2"><div class="fes">${c.es}</div>
      <div class="fgr">${c.g}</div>
    </div>
  </div></div>`;
  h+=`<div class="fcc">Carte ${ci+1} de ${cards.length}</div>`;
  h+=`<div class="srb">
    <button class="srbt hard" onclick="rateCard('${lid}','hard')">😰 Difícil</button>
    <button class="srbt mid" onclick="rateCard('${lid}','mid')">😐 Regular</button>
    <button class="srbt easy" onclick="rateCard('${lid}','easy')">😊 Fácil</button>
  </div>`;
  h+=`<div style="text-align:center;margin-top:14px">`;
  if(ci>0)h+=`<button class="ab" onclick="navCard('${lid}',-1)">← Anterior</button>`;
  h+=`<button class="ab" onclick="speak('${c.pt.replace(/'/g,"\\'")}',this)">🔊 Ouvir</button>`;
  if(ci<cards.length-1)h+=`<button class="ab" onclick="navCard('${lid}',1)">Próxima →</button>`;
  h+=`</div></div></div>`;
  h+=buildValidation(lid,'flashcards');
  return h;
}

function buildSim(lid){
  const sims=SIM[lid]||[];
  if(!sims.length)return'';
  const sim=sims[0];
  let h=`<div class="card"><div class="ch"><span class="ci">🎭</span><div><div class="ct">${sim.title}</div><div class="cd">DIÁLOGO REAL · ESCUCHA Y PRACTICA</div></div></div><div class="cb">`;
  sim.lines.forEach((l,i)=>{
    const sp=l.s==='A'?'ALUMNO':l.s==='G'?'GARÇOM':'NATIVO';
    const sc=l.s==='A'?'sa':l.s==='G'?'sg2':'sn';
    h+=`<div class="dl">
      <span class="spk ${sc}">${sp}</span>
      <div><div class="dpt">${l.t}</div><div class="des">${l.tr}</div></div>
      <button class="ab" style="margin-left:auto;flex-shrink:0" onclick="speak('${l.t.replace(/'/g,"\\'")}',this)">🔊</button>
    </div>`;
  });
  const allL=sim.lines.map(l=>l.t).join('. ');
  h+=`<div style="margin-top:14px"><button class="ab" onclick="speak('${allL.replace(/'/g,"\\'")}',this)">🔊 Ouvir diálogo completo</button></div>`;
  h+='</div></div>';
  h+=buildValidation(lid,'simulacao');
  return h;
}

function buildProd(lid){
  const wp=WP[lid];
  if(!wp)return'';
  let h=`<div class="card"><div class="ch"><span class="ci">✍️</span><div><div class="ct">Producción Escrita</div><div class="cd">ESCRIBE EN PORTUGUÊS · GUIADO</div></div></div><div class="cb">`;
  h+=`<div class="it"><strong>Prompt:</strong> ${wp.p}</div>`;
  h+=`<div class="tip"><strong>🌱 Estrutura sugerida:</strong><br>`;
  wp.g.forEach(g=>h+=`• ${g}<br>`);
  h+='</div>';
  h+=`<textarea class="wa" id="wa${lid}" placeholder="Escreva aqui em português..." rows="6"></textarea>`;
  h+=`<button class="cbtn" onclick="analyzeWriting('${lid}')">✦ Analizar Texto</button>`;
  h+=`<div class="fb" id="wfb${lid}"></div>`;
  h+='</div></div>';
  h+=buildValidation(lid,'producao');
  return h;
}

function buildValidation(lid,tab){
  const done=S.td[lid]&&S.td[lid][tab];
  const ok=isOk(lid,tab);
  const p=gP(lid,tab);
  if(done){
    return`<div class="vs done"><div class="vst">✓ Sección completada</div></div>`;
  }
  let hint='';
  if(!ok&&TR[tab].label){hint=`<div id="vh-${lid}-${tab}" class="vh2">🔒 ${TR[tab].label.replace('{p}',p)}</div>`;}
  return`<div class="vs ${ok?'ready':''}">
    <div class="vst">${ok?'¡Listo para completar!':'Completa los requisitos'}</div>
    ${hint}
    <button id="vb-${lid}-${tab}" class="vb ${done?'validated':ok?'active':'locked'}" ${done||!ok?'disabled':''} onclick="completeTab('${lid}','${tab}')">
      ${done?'✓ COMPLETADO':'MARCAR COMPLETADO'}
    </button>
    <div class="ub" id="ub-${lid}-${tab}">✨ ¡Sección completada!</div>
  </div>`;
}

  S.cl=lid;S.ct='gramatica';sS();
  renderNav();renderTabs();renderContent();renderProgress();
  document.getElementById('main').scrollTop=0;
}

function switchTab(tab){
  S.ct=tab;sS();
  renderTabs();renderContent();
  document.getElementById('main').scrollTop=0;
}

function checkMC(lid,ei,oi){
  const e=EX[lid][ei];
  if(!e)return;
  const correct=oi===e.c;
  for(let j=0;j<(e.o||[]).length;j++){
    const b=document.getElementById('opt'+lid+ei+j);
    if(b){b.disabled=true;if(j===e.c)b.classList.add('correct');else if(j===oi)b.classList.add('wrong');}
  }
  showFeedback(lid,ei,correct,e.ex);
  if(correct){S.ex++;addP(lid,'exercicios',1);}
  else addP(lid,'exercicios',0);
  renderProgress();
}

function checkFill(lid,ei){
  const e=EX[lid][ei];if(!e)return;
  const inp=document.getElementById('fi'+lid+ei);if(!inp)return;
  const val=inp.value.trim().toLowerCase();
  const ans=(e.a||'').toLowerCase();
  const correct=val===ans||val===ans.replace(/^\w/,c=>c.toLowerCase());
  inp.classList.add(correct?'correct':'wrong');
  inp.disabled=true;
  showFeedback(lid,ei,correct,correct?'✓ '+e.a:e.ex+' → '+e.a);
  if(correct){S.ex++;addP(lid,'exercicios',1);}
  renderProgress();
}

let reorderAns={};
function addWord(lid,ei,wi,w,el){
  if(el.classList.contains('used'))return;
  el.classList.add('used');
  const az=document.getElementById('az'+lid+ei);if(!az)return;
  const k=lid+ei;
  if(!reorderAns[k])reorderAns[k]=[];
  reorderAns[k].push({wi,w});
  const sp=document.createElement('span');
  sp.className='ac';sp.textContent=w;
  sp.onclick=()=>{
    reorderAns[k]=reorderAns[k].filter(x=>x.wi!==wi);
    az.removeChild(sp);
    const orig=document.getElementById('wc'+lid+ei+wi);
    if(orig)orig.classList.remove('used');
  };
  az.appendChild(sp);
}

function checkReorder(lid,ei){
  const e=EX[lid][ei];if(!e)return;
  const k=lid+ei;
  const ans=(reorderAns[k]||[]).map(x=>x.w).join(' ');
  const correct=ans.toLowerCase()===(e.c||'').toLowerCase();
  showFeedback(lid,ei,correct,correct?'✓ Correcto!':'Respuesta: '+e.c);
  if(correct){S.ex++;addP(lid,'exercicios',1);}
  renderProgress();
}

function showFeedback(lid,ei,correct,msg){
  const fb=document.getElementById('fb'+lid+ei);
  const fbt=document.getElementById('fbt'+lid+ei);
  const fbm=document.getElementById('fbm'+lid+ei);
  if(!fb)return;
  fb.className='fb '+(correct?'correct':'wrong')+' show';
  if(fbt)fbt.textContent=correct?'✓ CORRETO':'✗ INCORRECTO';
  if(fbm)fbm.textContent=msg||'';
}

function flipCard(){
  const fc=document.querySelector('.fc');
  if(fc)fc.classList.toggle('flipped');
}

function rateCard(lid,rating){
  addP(lid,'flashcards',1);
  S.wl=Math.max(S.wl,(FC[lid]||[]).length);
  sS();renderProgress();
  const cards=FC[lid]||[];
  if(!S.ci[lid])S.ci[lid]=0;
  if(rating==='hard'){}
  else S.ci[lid]=Math.min(S.ci[lid]+1,cards.length-1);
  sS();renderContent();
}

function navCard(lid,dir){
  const cards=FC[lid]||[];
  if(!S.ci[lid])S.ci[lid]=0;
  S.ci[lid]=Math.max(0,Math.min(cards.length-1,S.ci[lid]+dir));
  sS();renderContent();
}

function analyzeWriting(lid){
  const wa=document.getElementById('wa'+lid);
  if(!wa)return;
  const txt=wa.value.trim();
  if(!txt){showToast('Escreve algo primeiro!');return;}
  const words=txt.split(/\s+/).length;
  const fb=document.getElementById('wfb'+lid);
  if(fb){
    fb.className='fb correct show';
    fb.innerHTML=`<div class="fbt">✦ ANÁLISE</div>
    <div>Texto com ~${words} palavras. ${words>=30?'✓ Buen desarrollo.':''}</div>
    <div style="margin-top:6px;color:var(--v)">Parabéns por praticar a escrita! 🌿</div>`;
  }
  addP(lid,'producao',1);
  renderProgress();
}

function completeTab(lid,tab){
  if(!S.td[lid])S.td[lid]={};
  S.td[lid][tab]=true;
  if(!S.vl.includes(lid)&&TABS.every(t=>S.td[lid]&&S.td[lid][t]))S.vl.push(lid);
  sS();
  const ub=document.getElementById('ub-'+lid+'-'+tab);
  if(ub)ub.classList.add('show');
  const vb=document.getElementById('vb-'+lid+'-'+tab);
  if(vb){vb.className='vb validated';vb.innerHTML='✓ COMPLETADO';vb.disabled=true;}
  showToast('¡Sección completada! 🌿');
  renderNav();renderTabs();renderProgress();
  setTimeout(()=>{
    const nextTab=TABS[TABS.indexOf(tab)+1];
    if(nextTab)switchTab(nextTab);
  },800);
}

function showToast(msg){
  const t=document.getElementById('toast');
  if(!t)return;
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}

// TIMER
setInterval(()=>{if(S.cl){S.min++;sS();renderProgress();}},60000);

// INIT
renderNav();renderTabs();renderContent();renderProgress();
if(!S.cl){document.getElementById('ttl').textContent='Português para Hispanohablantes';}
</script>
</body>
</html>
