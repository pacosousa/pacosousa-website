// ─── SOUND ────────────────────────────────────────────────────────────────────
const playSound = (type) => {
    try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        const now = ctx.currentTime;
        if (type === 'correct') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(300, now);
            osc.frequency.exponentialRampToValueAtTime(600, now + 0.15);
            gain.gain.setValueAtTime(0.1, now); gain.gain.linearRampToValueAtTime(0, now + 0.2);
        } else if (type === 'error') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(300, now);
            osc.frequency.linearRampToValueAtTime(150, now + 0.1);
            gain.gain.setValueAtTime(0.08, now); gain.gain.linearRampToValueAtTime(0, now + 0.15);
        } else if (type === 'complete') {
            [261.6, 329.6, 392].forEach((f, i) => {
                const o2 = ctx.createOscillator(); const g2 = ctx.createGain();
                o2.connect(g2); g2.connect(ctx.destination);
                o2.frequency.setValueAtTime(f, now + i*0.1);
                g2.gain.setValueAtTime(0.1, now + i*0.1); g2.gain.linearRampToValueAtTime(0, now + i*0.1 + 0.15);
                o2.start(now + i*0.1); o2.stop(now + i*0.1 + 0.25);
            });
        } else if (type === 'flip') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(200, now);
            gain.gain.setValueAtTime(0.04, now); gain.gain.linearRampToValueAtTime(0, now + 0.06);
        }
        osc.start(); osc.stop(now + 0.3);
    } catch(e) {}
};

                <div className="shrink-0 flex justify-between mt-4 items-center">
                    <Button onClick={() => slide > 0 && setSlide(slide-1)} variant="ghost" className={`text-sm ${slide===0?'invisible':''}`}>← Atrás</Button>
                    <div className="flex gap-1.5">{data.map((_,i)=><div key={i} className={`h-2.5 rounded-full transition-all ${slide===i?'bg-white w-7':'bg-white/30 w-2.5'}`}/>)}</div>
                    <Button onClick={()=>slide<data.length-1?setSlide(slide+1):onComplete()} variant="accent" className="text-sm">
                        {slide===data.length-1?'¡Listo! 🎉':'Próximo →'}
                    </Button>
                </div>
            </div>
        </div>
    );
};

// ─── MEMORY GAME ─────────────────────────────────────────────────────────────
const MemoryGame = ({ data, onComplete, type='text-text', title }) => {
    const [cards, setCards] = useState([]);
    const [flipped, setFlipped] = useState([]);
    const [matched, setMatched] = useState([]);
    const [locked, setLocked] = useState(false);
    const [errors, setErrors] = useState(0);
    const [shakeId, setShakeId] = useState(null);
    const [done, setDone] = useState(false);

    useEffect(() => {
        let pool = [];
        if (type==='text-text') {
            pool = data.flatMap((item,idx) => [
                {id:`${idx}-pt`, content:item.pt, pairId:idx, side:'pt'},
                {id:`${idx}-es`, content:item.es, pairId:idx, side:'es'},
            ]);
        } else if (type==='emoji-text') {
            pool = data.flatMap((item,idx) => [
                {id:`${idx}-emoji`, content:item.emoji, sub:item.es, pairId:idx, side:'emoji'},
                {id:`${idx}-pt`,    content:item.pt,                 pairId:idx, side:'pt'},
            ]);
        }
        setCards(shuffleArray(pool));
    }, [data, type]);

    const handleFlip = (card) => {
        if (locked || flipped.includes(card.id) || matched.includes(card.pairId)) return;
        playSound('flip');
        const nf = [...flipped, card.id];
        setFlipped(nf);
        if (nf.length === 2) {
            setLocked(true);
            const c1 = cards.find(c=>c.id===nf[0]);
            const c2 = cards.find(c=>c.id===nf[1]);
            if (c1.pairId === c2.pairId) {
                const nm = [...matched, c1.pairId];
                setMatched(nm); setFlipped([]); setLocked(false);
                playSound('correct');
                if (nm.length === data.length) setTimeout(()=>{ setDone(true); playSound('complete'); }, 400);
            } else {
                setShakeId(c1.id);
                setTimeout(()=>{ setFlipped([]); setLocked(false); setShakeId(null); setErrors(e=>e+1); playSound('error'); }, 900);
            }
        }
    };

    const reset = () => { setCards(shuffleArray(cards)); setFlipped([]); setMatched([]); setLocked(false); setErrors(0); setDone(false); };

    // Fit cards in viewport: use fixed grid rows
    const numCols = data.length <= 6 ? 3 : 4;

    if (done) return (
        <div className="flex flex-col items-center gap-6 slide-up">
            <Confetti />
            <div className="text-center p-8 bg-[#1A1035] border-2 border-[#00F5D4]/50 rounded-[32px] max-w-lg mx-auto">
                <div className="text-5xl mb-3">🎉</div>
                <h3 className="text-2xl font-black text-[#00F5D4] mb-1">
                    {errors===0 ? '¡Perfecta! ¡Sin errores! 🏆' : `¡Muy bien! ${errors} error${errors>1?'es':''} ⭐`}
                </h3>
                <div className="flex gap-3 justify-center mt-6">
                    <Button onClick={reset} variant="ghost">🔀 Jogar de novo</Button>
                    <Button onClick={onComplete} variant="accent">Continuar ➜</Button>
                </div>
            </div>
        </div>
    );

    return (
        <div className="flex flex-col items-center gap-3 w-full">
            {title && <h2 className="text-2xl font-black text-[#00F5D4]">{title}</h2>}
            <div className="flex gap-4 text-sm font-bold text-white/60">
                <span>✅ {matched.length}/{data.length} pares</span>
                <span>❌ {errors} erros</span>
            </div>
            {/* Grid fits viewport: calc card height so grid doesn't scroll */}
            <div style={{
                display:'grid',
                gridTemplateColumns:`repeat(${numCols}, 1fr)`,
                gap:'10px',
                width:'100%',
                maxWidth:'700px',
                perspective:'1000px',
            }}>
                {cards.map(card => {
                    const isFlipped = flipped.includes(card.id) || matched.includes(card.pairId);
                    const isMatched = matched.includes(card.pairId);
                    const isShaking = shakeId === card.id;
                    return (
                        <div key={card.id} onClick={()=>handleFlip(card)}
                            className={`relative cursor-pointer transform-style-3d card-flip ${isFlipped?'rotate-y-180':''} ${isShaking?'animate-shake':''}`}
                            style={{height:'clamp(75px, 11vw, 120px)'}}>
                            {/* Hidden face */}
                            <div className="absolute inset-0 bg-[#7B2FFF] rounded-xl flex items-center justify-center border-b-4 border-indigo-900 backface-hidden z-20 hover:brightness-110">
                                <span className="text-2xl text-white/40 font-black select-none">?</span>
                            </div>
                            {/* Visible face */}
                            <div className={`absolute inset-0 rounded-xl flex flex-col items-center justify-center p-2 text-center rotate-y-180 backface-hidden border-b-4 z-10 ${isMatched?'matched-glow opacity-60':''} ${card.side==='pt'?'bg-[#FF3CAC] border-pink-900':'bg-[#00F5D4] border-teal-900'}`}>
                                {card.side==='emoji'
                                    ? <><span className="text-3xl">{card.content}</span><span className="text-[9px] text-black/50 font-black uppercase mt-0.5">{card.sub}</span></>
                                    : <span className={`font-black leading-tight break-words text-center select-none px-1 ${card.content.length>14?'text-[10px]':card.content.length>8?'text-xs':'text-sm md:text-base'} ${card.side==='pt'?'text-white':'text-[#0F0A1E]'}`}>{card.content}</span>
                                }
                            </div>
                        </div>
                    );
                })}
            </div>
            <Button onClick={reset} variant="ghost" className="text-xs mt-1">🔀 Embaralhar de novo</Button>
        </div>
    );
};

// ─── QUIZ ─────────────────────────────────────────────────────────────────────
const QuizGame = ({ data, onComplete, title }) => {
    const [qIndex, setQIndex] = useState(0);
    const [selected, setSelected] = useState(null);
    const [score, setScore] = useState(0);
    const [showResult, setShowResult] = useState(false);
    const [shakeIdx, setShakeIdx] = useState(null);
    const [done, setDone] = useState(false);

    const q = data[qIndex];

    const handleAnswer = (idx) => {
        if (selected !== null) return;
        setSelected(idx);
        if (idx === q.correct) { playSound('correct'); setScore(s=>s+1); }
        else { playSound('error'); setShakeIdx(idx); setTimeout(()=>setShakeIdx(null), 500); }
        setTimeout(()=>setShowResult(true), 600);
    };

    const next = () => {
        setSelected(null); setShowResult(false); setShakeIdx(null);
        if (qIndex < data.length-1) setQIndex(q=>q+1);
        else setDone(true);
    };

    if (done) {
        const pct = score/data.length;
        const msg = pct===1?'¡Perfecta! ¡Una crack! 🏆🌟':pct>=0.7?'¡Muy bien! ⭐⭐':'¡Buen intento! 💪';
        return (
            <div className="flex flex-col items-center gap-5 slide-up">
                {pct===1&&<Confetti/>}
                <div className="text-center p-8 bg-[#1A1035] border-2 border-[#FF3CAC]/40 rounded-[28px] max-w-md w-full">
                    <div className="text-5xl mb-3">{pct===1?'🏆':pct>=0.7?'⭐':'💪'}</div>
                    <h3 className="text-2xl font-black text-white mb-1">{msg}</h3>
                    <p className="text-[#00F5D4] text-4xl font-black my-3">{score} / {data.length}</p>
                    <div className="flex justify-center gap-1 mb-5">
                        {data.map((_,i)=><span key={i} className={`text-lg ${i<score?'star-anim':''}`}>{i<score?'⭐':'☆'}</span>)}
                    </div>
                    <div className="flex gap-3 justify-center">
                        <Button onClick={()=>{setQIndex(0);setScore(0);setDone(false);setSelected(null);setShowResult(false);}} variant="ghost">🔄 Repetir</Button>
                        <Button onClick={onComplete} variant="accent">Continuar ➜</Button>
                    </div>
                </div>
            </div>
        );
    }

    return (
        <div className="flex flex-col items-center gap-4 max-w-xl mx-auto slide-up w-full">
            {title && <h2 className="text-xl font-black text-[#FF3CAC] text-center">{title}</h2>}
            <ProgressBar current={qIndex+1} total={data.length} color="#FF3CAC" />
            <div className="flex justify-between w-full text-xs font-bold text-white/50 -mt-1">
                <span>Pergunta {qIndex+1}/{data.length}</span>
                <span>⭐ {score} pts</span>
            </div>
            {/* Question */}
            <div className="w-full bg-[#1A1035] border-2 border-[#7B2FFF]/40 rounded-[24px] p-6 text-center">
                <div className="text-4xl mb-3">{q.icon}</div>
                <p className="text-base md:text-lg font-bold text-white leading-snug">{q.situation}</p>
            </div>
            {/* Options */}
            <div className="flex flex-col gap-2.5 w-full">
                {q.options.map((opt, idx) => {
                    let bg = 'bg-[#1A1035] border-2 border-white/20 hover:border-[#FF3CAC]/60 hover:bg-[#FF3CAC]/10';
                    if (selected !== null) {
                        if (idx===q.correct) bg='bg-green-600/30 border-2 border-green-400';
                        else if (idx===selected) bg='bg-red-600/30 border-2 border-red-400';
                        else bg='bg-[#1A1035] border-2 border-white/10 opacity-40';
                    }
                    return (
                        <button key={idx} onClick={()=>handleAnswer(idx)}
                            className={`w-full p-3.5 rounded-2xl text-left font-bold text-white transition-all ${bg} ${shakeIdx===idx?'animate-shake':''}`}>
                            <span className="text-[#00F5D4] font-black mr-2">{String.fromCharCode(65+idx)}.</span>
                            {opt}
                            {selected!==null&&idx===q.correct&&<span className="float-right text-green-400"><IconCheck/></span>}
                            {selected!==null&&idx===selected&&idx!==q.correct&&<span className="float-right text-red-400"><IconX/></span>}
                        </button>
                    );
                })}
            </div>
            {showResult && (
                <div className="slide-up w-full bg-[#0F0A1E] border border-[#00F5D4]/30 rounded-2xl p-3.5 flex flex-col gap-2.5">
                    <p className="text-[#00F5D4] font-bold text-sm">💡 {q.explanation}</p>
                    <Button onClick={next} variant={selected===q.correct?'accent':'primary'} className="w-full">
                        {qIndex<data.length-1?'Próxima ➜':'Ver resultado 🏆'}
                    </Button>
                </div>
            )}
        </div>
    );
};

const AnkiCreator = ({ onComplete }) => {
    const [cards, setCards] = useState(() => {
        try { const s = localStorage.getItem('anki_cards_1b'); return s ? JSON.parse(s) : DEFAULT_ANKI_CARDS; }
        catch { return DEFAULT_ANKI_CARDS; }
    });
    const [mode, setMode] = useState('view'); // view | create | study
    const [newFront, setNewFront] = useState('');
    const [newBack, setNewBack] = useState('');
    const [newEmoji, setNewEmoji] = useState('');
    const [newTag, setNewTag] = useState('');
    const [studyIdx, setStudyIdx] = useState(0);
    const [studyFlipped, setStudyFlipped] = useState(false);
    const [studyDeck, setStudyDeck] = useState([]);
    const [studyDone, setStudyDone] = useState(false);

    const save = (nc) => { setCards(nc); try { localStorage.setItem('anki_cards_1b', JSON.stringify(nc)); } catch {} };
    const addCard = () => {
        if (!newFront.trim() || !newBack.trim()) return;
        save([...cards, {id:Date.now(), front:newFront.trim(), back:newBack.trim(), emoji:newEmoji.trim()||'✏️', tag:newTag.trim()||'meu'}]);
        setNewFront(''); setNewBack(''); setNewEmoji(''); setNewTag('');

    const deleteCard = (id) => save(cards.filter(c=>c.id!==id));
    const startStudy = () => { setStudyDeck(shuffleArray(cards)); setStudyIdx(0); setStudyFlipped(false); setStudyDone(false); setMode('study'); };
    const nextStudy = () => {
        setStudyFlipped(false);
        setTimeout(()=>{ if (studyIdx < studyDeck.length-1) setStudyIdx(i=>i+1); else setStudyDone(true); }, 200);
    };

    const tagColors = {saudações:'#7B2FFF', escola:'#FF6B35', cores:'#FF3CAC', pronomes:'#4361EE', meu:'#059669', geral:'#475569'};

    // ── STUDY mode ──

        if (studyDone) return (
            <div className="flex flex-col items-center gap-5 slide-up">

                ))}
            </div>
            {step===0 && <TheoryLesson data={CLASS_1B_THEORY} onComplete={()=>setStep(1)} title="Aula 1B — Gostos, Moradia e Pronomes"/>}
            {step===1 && <QuizGame    data={CLASS_1B_QUIZ}   onComplete={()=>setStep(2)} title="🧠 Quiz — Aulas 1A + 1B"/>}
            {step===2 && <AnkiCreator onComplete={onComplete}/>}
        </div>
    );
};

// ─── HOME ─────────────────────────────────────────────────────────────────────
const HomeView = ({ onStartModule }) => {
    const phrase = useMemo(()=>MOTIVATIONAL_PHRASES[Math.floor(Math.random()*MOTIVATIONAL_PHRASES.length)],[]);
    const modules = [
        {id:'m1a', emoji:'💜', label:'Aula 1A', sub:'Saudações e Identidade', color:'#7B2FFF', highlight:false},
        {id:'m1b', emoji:'❤️', label:'Aula 1B', sub:'Gostos, Moradia, Pronomes', color:'#FF3CAC', highlight:true},
        {id:'m2',  emoji:'📖', label:'Aula 2',  sub:'Números e Cores', color:'#00a89c', textDark:true},
        {id:'m2p', emoji:'🎒', label:'Prática', sub:'Objetos da Escola', color:'#FF6B35'},
        {id:'m3',  emoji:'🧪', label:'Revisão', sub:'Super Revisão!', color:'#059669'},
    ];
    return (
        <div className="flex flex-col items-center justify-center text-center px-3 py-6 slide-up"
            style={{minHeight:'calc(100vh - 80px)'}}>
            <h1 className="text-5xl md:text-7xl font-black mb-2 text-white drop-shadow-[0_5px_15px_rgba(255,60,172,0.6)] animate-bounce-slow">Oi, Brasil! 🇧🇷</h1>
            <p className="text-base font-bold text-[#00F5D4] mb-8 uppercase tracking-widest">¡Aprendé jogando!</p>
            <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-3 w-full max-w-4xl">
                {modules.map(m => (
                    <button key={m.id} onClick={()=>onStartModule(m.id)}
                        className={`relative rounded-[24px] p-5 transition-all hover:scale-105 hover:brightness-110 shadow-xl border-4 ${m.highlight?'ring-2 ring-white/40':''}`}
                        style={{backgroundColor:m.color, borderColor:m.color}}>
                        {m.highlight && <span className="absolute -top-2 -right-2 bg-yellow-400 text-yellow-900 text-[9px] font-black px-2 py-0.5 rounded-full">NOVO ✨</span>}
                        <span className="text-3xl mb-2 block">{m.emoji}</span>
                        <h2 className={`text-sm font-black ${m.textDark?'text-[#0F0A1E]':'text-white'}`}>{m.label}</h2>
                        <p className={`text-[11px] mt-0.5 ${m.textDark?'text-[#0F0A1E]/70':'text-white/70'}`}>{m.sub}</p>
                    </button>
                ))}
            </div>
            <div className="mt-8 bg-[#1A1035] rounded-3xl px-6 py-3 border border-white/10 max-w-sm">
                <p className="italic text-white/50 font-medium text-sm">"{phrase}"</p>
            </div>
        </div>
    );
};

// ─── APP ──────────────────────────────────────────────────────────────────────
function App() {
    const [view, setView] = useState('home');
    const goHome = () => setView('home');
    const labels = {m1a:'Aula 1A', m1b:'Aula 1B', m2:'Aula 2', m2p:'Prática', m3:'Revisão'};

    return (
        <div className="min-h-screen bg-[#0F0A1E] text-white">
            <header className="px-4 py-3 bg-[#0F0A1E]/90 backdrop-blur-md sticky top-0 border-b border-white/5 flex justify-between items-center z-50" style={{height:64}}>
                <div onClick={goHome} className="flex items-center gap-2 cursor-pointer hover:opacity-80 transition-opacity">
                    <span className="text-2xl">👩‍🚀</span>
                    <h1 className="text-lg font-black hidden sm:block">Oi, Brasil! 🇧🇷</h1>
                </div>
                {view!=='home' && (
                    <div className="flex items-center gap-3">
                        <span className="text-white/40 text-sm font-bold hidden sm:block">{labels[view]||''}</span>
                        <Button onClick={goHome} variant="ghost" className="px-3 py-2 text-sm flex items-center gap-1.5"><IconArrowLeft/>Voltar</Button>
                    </div>
                )}
            </header>

            <main className="px-4 py-5 max-w-5xl mx-auto">
                {view==='home' && <HomeView onStartModule={setView}/>}
                {view==='m1a'  && <Module1A onComplete={goHome}/>}
                {view==='m1b'  && <Module1B onComplete={goHome}/>}
                {view==='m2'   && <TheoryLesson data={CLASS_2_THEORY}  onComplete={goHome} title="Aula 2 — Números e Cores"/>}
                {view==='m2p'  && <MemoryGame   data={CLASS_2_MEM_A}   onComplete={goHome} type="emoji-text" title="🎒 Objetos da Escola"/>}
                {view==='m3'   && <TheoryLesson data={CLASS_3_THEORY}  onComplete={goHome} title="🧪 Super Revisão — Materiais Escolares"/>}
            </main>
        </div>
    );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
