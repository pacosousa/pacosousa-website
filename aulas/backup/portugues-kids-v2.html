const numberToExtensive = (num) => {
    const map = {
        10: "Dez", 20: "Vinte", 30: "Trinta", 40: "Quarenta", 50: "Cinquenta",
        60: "Sessenta", 70: "Setenta", 80: "Oitenta", 90: "Noventa", 100: "Cem",
        200: "Duzentos", 300: "Trezentos", 400: "Quatrocentos", 500: "Quinhentos"
    };
    return map[num] || num.toString();
};

const playSound = (type) => {
    try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        const now = ctx.currentTime;
        if (type === 'correct') {
            osc.frequency.setValueAtTime(300, now);
            osc.frequency.exponentialRampToValueAtTime(600, now + 0.15);
            gain.gain.setValueAtTime(0.1, now); gain.gain.linearRampToValueAtTime(0, now + 0.2);
        } else if (type === 'error') {
            osc.frequency.setValueAtTime(200, now);
            osc.frequency.linearRampToValueAtTime(100, now + 0.15);
            gain.gain.setValueAtTime(0.1, now); gain.gain.linearRampToValueAtTime(0, now + 0.2);
        }
        osc.start(); osc.stop(now + 0.2);
    } catch(e) {}
};

    const totalLessons = curriculum.length;
    
    const sumScores = completedLessons.reduce((acc, curr) => acc + (userProgress[curr.id]?.score || 0), 0);

        <div className="max-w-4xl mx-auto slide-up">

                            <div className="text-[10px] text-white/40 font-black uppercase mt-1">Média Geral</div>

                            <div className="text-[10px] text-white/40 font-black uppercase mt-1">Concluído</div>
                        </div>
                    </div>
                </div>

                        return (

const FillBlanks = ({ data, onComplete, title, subtitle }) => {
    const [index, setIndex] = useState(0);
    const [input, setInput] = useState('');
    const [feedback, setFeedback] = useState(null); 
    const [attempts, setAttempts] = useState(0);
    const [missedIndices, setMissedIndices] = useState([]);
    const [stats, setStats] = useState({ hits: 0, errors: 0 });
    const [isReviewMode, setIsReviewMode] = useState(false);
    const [reviewIndex, setReviewIndex] = useState(0);

    const currentData = isReviewMode ? data[missedIndices[reviewIndex]] : data[index];

    const handleCheck = () => {
        if (input.trim().toLowerCase() === currentData.a.toLowerCase()) {
            playSound('correct'); setFeedback('correct');
            if (!isReviewMode && attempts === 0) setStats(s => ({ ...s, hits: s.hits + 1 }));
            setTimeout(() => { moveToNext(); }, 1000);
        } else {
            playSound('error');
            if (attempts === 0) { 
                setFeedback('wrong-first'); 
                setAttempts(1); 
                if (!isReviewMode) { 
                    setStats(s => ({ ...s, errors: s.errors + 1 })); 
                    setMissedIndices(m => [...m, index]); 
                } 
            } else { setFeedback('wrong-second'); }
        }
    };

    const moveToNext = () => {
        setFeedback(null); setAttempts(0); setInput('');
        if (isReviewMode) { 
            if (reviewIndex + 1 < missedIndices.length) setReviewIndex(reviewIndex + 1); 
            else setFeedback('finished'); 
        } else { 
            const nextIdx = index + 1; 
            if (nextIdx < data.length) setIndex(nextIdx); 
            else missedIndices.length > 0 ? (setIsReviewMode(true), setReviewIndex(0)) : setFeedback('finished'); 
        }
    };

    if (feedback === 'finished') {
        const adjustedHits = stats.hits + ((data.length - stats.hits) * 0.5);

    return (

// ─── MEMORY GAME ─────────────────────────────────────────────────────────────
const MemoryGame = ({ data, onComplete, type='text-text' }) => {
    const [cards, setCards] = useState([]);
    const [flipped, setFlipped] = useState([]);
    const [matched, setMatched] = useState([]);
    const [locked, setLocked] = useState(false);
    const [isFinished, setIsFinished] = useState(false);
    const [errors, setErrors] = useState(0);

    const numPairs = data.length;
    const pointsPerMatch = 100 / numPairs;
    const pointsLostPerError = 2;

    useEffect(() => {
        let pool = type==='text-text' ? data.flatMap((item,idx) => [{id:`${idx}-pt`, content:item.pt, pairId:idx, side:'pt'}, {id:`${idx}-es`, content:item.es, pairId:idx, side:'es'}]) : data.flatMap((item,idx) => [{id:`${idx}-emoji`, content:item.emoji, pairId:idx, side:'emoji'}, {id:`${idx}-pt`, content:item.pt, pairId:idx, side:'pt'}]);
        setCards([...pool].sort(() => Math.random() - 0.5));
    }, [data, type]);

    const handleFlip = (card) => {
        if (locked || flipped.includes(card.id) || matched.includes(card.pairId) || isFinished) return;
        const nf = [...flipped, card.id]; setFlipped(nf);
        if (nf.length === 2) {
            setLocked(true); const c1 = cards.find(c=>c.id===nf[0]), c2 = cards.find(c=>c.id===nf[1]);
            if (c1.pairId === c2.pairId) { 
                playSound('correct');
                const newMatched = [...matched, c1.pairId];
                setMatched(newMatched); 
                setFlipped([]); 
                setLocked(false); 
                // Verificar vitória IMEDIATAMENTE aqui para garantir que o botão apareça sem atrasos
                if (newMatched.length === numPairs) {
                    setIsFinished(true);
                }
            } else { 
                playSound('error');
                setErrors(e => e + 1);
                setTimeout(() => { setFlipped([]); setLocked(false); }, 1000); 
            }
        }
    };

    const currentScore = isFinished 
        ? Math.max(60, 100 - (errors * pointsLostPerError))
        : Math.round(matched.length * pointsPerMatch);

    return (
        <div className="flex flex-col items-center w-full max-w-4xl mx-auto slide-up">
            <div className="flex justify-between w-full mb-6 px-4">
                <div className="flex flex-col text-left">
                    <span className="text-[10px] font-black text-white/40 uppercase">Erros: {errors}</span>
                    <span className="text-[10px] font-black text-[#FF3CAC] uppercase">Impacto: -{errors * pointsLostPerError} pts</span>
                </div>
                <div className="text-right">
                    <span className="text-[10px] font-black text-[#00F5D4] uppercase block">Nota</span>
                    <span className="text-3xl font-black text-[#00F5D4]">{isFinished ? currentScore : Math.round(matched.length * pointsPerMatch)}</span>
                </div>
            </div>
            <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4 w-full perspective-1000">
                {cards.map(card => {
                    const isFlipped = flipped.includes(card.id) || matched.includes(card.pairId);
                    return (
                        <div key={card.id} onClick={()=>handleFlip(card)} className={`relative h-28 md:h-36 cursor-pointer transition-transform duration-500 transform-style-3d ${isFlipped ? 'rotate-y-180' : ''}`}>
                            <div className="absolute inset-0 bg-[#7B2FFF] rounded-2xl flex items-center justify-center border-b-4 border-indigo-900 backface-hidden z-20"><span className="text-3xl text-white/50 font-black">?</span></div>
                            <div className={`absolute inset-0 rounded-2xl flex items-center justify-center p-2 rotate-y-180 backface-hidden border-b-4 shadow-xl z-10 ${card.side==='pt'?'bg-[#FF3CAC] border-pink-900':'bg-[#00F5D4] border-teal-900'}`}>
                                <span className="font-black text-lg md:text-2xl text-center leading-tight">{card.content}</span>
                            </div>
                        </div>
                    );
                })}
            </div>
            {isFinished && <div className="mt-8 flex flex-col items-center gap-4 w-full slide-up">
                <div className="bg-[#00F5D4]/10 p-6 rounded-[32px] border-2 border-[#00F5D4]/20 text-center w-full max-w-sm">
                    <p className="text-[#00F5D4] font-black text-sm uppercase mb-1 tracking-widest">Excelente Trabalho!</p>
                    <p className="text-white text-5xl font-black leading-none">{currentScore}</p>
                    <p className="text-white/40 text-[10px] font-black mt-2">PONTUAÇÃO FINAL</p>
                </div>
                <Button onClick={() => onComplete(currentScore)} variant="accent" className="px-12 py-4 text-xl w-full max-w-sm">Próximo ➜</Button>
            </div>}
        </div>
    );
};

            const auth = getAuth(app);
            const firestore = getFirestore(app);
            setDb(firestore);

            const initAuth = async () => {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else { await signInAnonymously(auth); }
            };
            initAuth();

            onAuthStateChanged(auth, (u) => {
                setUser(u);
                if (u) {
                    const progressRef = doc(firestore, 'artifacts', appId, 'users', u.uid, 'progress', 'data');
                    onSnapshot(progressRef, (snap) => {
                        if (snap.exists()) {
                            setUserProgress(snap.data());
                        }
                    }, (err) => console.error(err));
                }
            });
        };
        initFirebase();
    }, []);

    const completeLesson = async (lessonId, score = 100) => {
        // 1. Atualizar imediatamente o estado local para Margo ver o check verde na hora
        const newProgress = { ...userProgress, [lessonId]: { completed: true, score: score } };
        setUserProgress(newProgress);

        // 2. Tentar salvar no Firebase de forma prioritária
        if (user && db) {
            try {
                const { doc, setDoc } = window.firebaseCore;
                const progressRef = doc(db, 'artifacts', appId, 'users', user.uid, 'progress', 'data');
                await setDoc(progressRef, newProgress, { merge: true });
            } catch (e) {
                console.error("Erro ao salvar no Firebase:", e);
            }
        }
        
        // 3. Voltar para a Home
        goHome();
    };

    const goHome = () => { setView('home'); setStep(0); };

    return (
        <div className="min-h-screen bg-[#0F0A1E] text-white">
            <header className="px-4 py-3 border-b border-white/5 flex justify-between items-center sticky top-0 bg-[#0F0A1E] z-50">
                <div onClick={goHome} className="flex items-center gap-2 cursor-pointer transition-opacity hover:opacity-80"><span className="text-2xl">👩‍🚀</span><h1 className="text-lg font-black tracking-tight">Oi, Brasil!</h1></div>
                <div className="flex gap-2">
                    {view === 'home' && (
                        <Button onClick={() => setView('boletim')} variant="ghost" className="text-xs flex items-center gap-1 border-[#00F5D4]/20 hover:border-[#00F5D4]/40">📊 Boletim</Button>
                    )}
                    {view !== 'home' && <Button onClick={goHome} variant="ghost" className="text-xs">Voltar</Button>}
                </div>
            </header>
            <main className="px-4 py-10 max-w-6xl mx-auto">
                {view==='home' && (
                    <div className="flex flex-col items-center justify-center text-center px-3 slide-up min-h-[70vh]">
                        <h1 className="text-5xl md:text-7xl font-black mb-2 text-white animate-bounce-slow">Oi, Brasil! 🇧🇷</h1>
                        <p className="text-base font-bold text-[#00F5D4] mb-12 uppercase tracking-widest">¡Aprendé jogando!</p>
                        <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-3 w-full">
                            {[
                                {id:'m1a', emoji:'💜', label:'Aula 1A', color:'#7B2FFF'},
                                {id:'m1b', emoji:'🏠', label:'Aula 1B', color:'#4361EE'},
                                {id:'m2',  emoji:'📖', label:'Aula 1A - Comp', color:'#00a89c'},
                                {id:'m3',  emoji:'🧪', label:'Aula 1B - Comp', color:'#FF6B35'},
                                {id:'m2a', emoji:'💎', label:'Aula 2A', color:'#4361EE'},
                                {id:'m_rev', emoji:'🔥', label:'Super Revisão', color:'#00F5D4', textDark: true},
                            ].map(m => {
                                const isDone = userProgress[m.id]?.completed;
                                return (
                                    <button key={m.id} onClick={()=>setView(m.id)} className={`relative rounded-[24px] p-5 transition-all hover:scale-105 shadow-xl border-4 ${isDone ? 'border-[#00F5D4]' : 'border-transparent'}`} style={{backgroundColor:m.color}}>
                                        {isDone && <span className="absolute -top-2 -right-2 bg-[#00F5D4] text-[#0F0A1E] text-[10px] font-black w-6 h-6 flex items-center justify-center rounded-full border-2 border-[#0F0A1E]">✓</span>}
                                        <span className="text-3xl mb-2 block">{m.emoji}</span>
                                        <h2 className={`text-[10px] font-black ${m.textDark?'text-[#0F0A1E]':'text-white'} leading-tight uppercase`}>{m.label}</h2>
                                        {userProgress[m.id]?.score !== undefined && <div className="text-[9px] mt-1 font-black opacity-60">Nota: {userProgress[m.id].score}</div>}
                                    </button>
                                );
                            })}
                        </div>
                    </div>
                )}
                {view==='boletim' && <ProgressReport userProgress={userProgress} onBack={goHome} />}
                {view==='m1a' && <MemoryGame data={CLASS_1A_GREETINGS} onComplete={(s) => completeLesson('m1a', s)}/>}
                {view==='m1b' && (
                    <>
                        {step === 0 && <TheoryLesson data={CLASS_1B_THEORY} title="Aula 1B" onComplete={() => setStep(1)}/>}
                        {step === 1 && <FillBlanks data={CLASS_1B_EXERCISES} title="Praticando Gostos e Pronomes" subtitle="Preencha os espaços observando a tradução em espanhol" onComplete={(s) => completeLesson('m1b', s)}/>}
                    </>
                )}
                {view==='m2' && <TheoryLesson data={CLASS_1A_COMP_THEORY} title="Aula 1A - Complementar" onComplete={(s) => completeLesson('m2', s)}/>}
                {view==='m3' && (
                    <>
                        {step === 0 && <TheoryLesson data={CLASS_1B_COMP_THEORY} title="Aula 1B - Complementar" onComplete={() => setStep(1)}/>}
                        {step === 1 && <MemoryGame data={CLASS_1B_COMP_MEM} type="emoji-text" onComplete={(s) => completeLesson('m3', s)}/>}
                    </>
                )}
                {view==='m2a' && (
                    <>
                        {step === 0 && <TheoryLesson data={CLASS_2A_THEORY} title="Aula 2A" onComplete={() => setStep(1)}/>}
                        {step === 1 && <MemoryGame data={CLASS_2A_MEM_DATA} onComplete={() => setStep(2)}/>}
                        {step === 2 && <RobuxMarket onComplete={(inv, errs) => { setCurrentInv(inv); setM2aMarketErrors(errs); setStep(3); }}/>}
                        {step === 3 && <TerPractice inventory={currentInv} onComplete={(s) => {
                            const marketScore = Math.max(60, 100 - (m2aMarketErrors * 3));
                            completeLesson('m2a', Math.round((marketScore + s) / 2));
                        }}/>}
                    </>
                )}
                {view==='m_rev' && <FillBlanks data={REVISION_DATA} title="Super Revisão" subtitle="Observe a tradução em espanhol e mostre o que você aprendeu!" onComplete={(s) => completeLesson('m_rev', s)} />}
            </main>
        </div>
    );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
