<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Português para hispanohablantes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,700;0,9..144,900;1,9..144,400&family=DM+Mono:ital,wght@0,400;0,500;1,400&family=Lora:ital,wght@0,400;0,600;1,400;1,600&display=swap" rel="stylesheet">
<style>
:root {
  --verde:#00704A;--verde2:#005538;--verde3:#003D28;
  --lima:#B8E04A;--lima2:#D4F06A;
  --branco:#F7F5EF;--papel:#EFEDE5;--papel2:#E5E2D8;
  --escuro:#1A1A18;--cinza:#6B6B60;--cinza2:#9A9A8E;
  --borda:rgba(0,112,74,.15);--borda2:rgba(0,112,74,.08);
  --sombra:0 2px 20px rgba(0,112,74,.1);
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;overflow:hidden;}
body{background:var(--branco);color:var(--escuro);font-family:'Lora',serif;display:flex;height:100vh;}
#sidebar{width:280px;height:100vh;background:var(--verde3);display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto;position:relative;}
#sidebar::after{content:'';position:absolute;top:0;right:0;width:1px;height:100%;background:linear-gradient(to bottom,transparent,var(--lima),transparent);}
.sb-header{padding:26px 22px 18px;border-bottom:1px solid rgba(184,224,74,.18);}
.sb-logo{font-family:'Fraunces',serif;font-size:20px;font-weight:900;color:var(--lima);line-height:1.15;}
.sb-logo em{display:block;font-style:italic;font-weight:300;font-size:13px;color:rgba(184,224,74,.6);margin-top:3px;}
.sb-logo span{display:block;font-family:'DM Mono',monospace;font-size:9px;letter-spacing:3px;color:rgba(184,224,74,.35);margin-top:5px;}
.prog-wrap{margin-top:12px;}
.prog-label{font-family:'DM Mono',monospace;font-size:9px;color:rgba(184,224,74,.45);letter-spacing:2px;margin-bottom:5px;}
.prog-bar{height:2px;background:rgba(255,255,255,.08);border-radius:1px;overflow:hidden;}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--lima),var(--lima2));transition:width .8s ease;}
.days-nav{padding:12px 0;flex:1;}
.day-btn{width:100%;padding:11px 20px;background:none;border:none;color:rgba(247,245,239,.45);font-family:'Fraunces',serif;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:10px;transition:all .25s;text-align:left;position:relative;}
.day-btn:hover{background:rgba(184,224,74,.07);color:rgba(247,245,239,.8);}
.day-btn.active{background:rgba(184,224,74,.12);color:var(--lima);}
.day-btn.active::before{content:'';position:absolute;left:0;top:0;width:3px;height:100%;background:var(--lima);border-radius:0 2px 2px 0;}
.day-btn.locked{opacity:.3;cursor:not-allowed;}
.day-btn.locked:hover{background:none;}
.day-btn.done-day{color:rgba(184,224,74,.7);}
.day-num{font-family:'DM Mono',monospace;font-size:10px;background:rgba(255,255,255,.06);padding:3px 7px;border-radius:3px;min-width:28px;text-align:center;flex-shrink:0;}
.day-btn.active .day-num{background:rgba(184,224,74,.2);color:var(--lima);}
.lock-icon{margin-left:auto;font-size:11px;opacity:.5;}
.tab-section{padding:2px 12px 10px;}
.tab-label{font-family:'DM Mono',monospace;font-size:9px;color:rgba(184,224,74,.3);letter-spacing:2px;padding:6px 8px 4px;}
.tab-btn{width:100%;padding:7px 10px;background:none;border:none;border-radius:5px;color:rgba(247,245,239,.38);font-family:'DM Mono',monospace;font-size:10px;letter-spacing:1px;cursor:pointer;display:flex;align-items:center;gap:8px;transition:all .2s;text-align:left;}
.tab-btn:hover{background:rgba(255,255,255,.05);color:rgba(247,245,239,.65);}
.tab-btn.active{background:rgba(184,224,74,.1);color:var(--lima);}
.tab-done{margin-left:auto;color:var(--lima);font-size:11px;}
.sb-footer{padding:14px 18px;border-top:1px solid rgba(184,224,74,.1);}
.streak-wrap{display:flex;align-items:center;gap:12px;background:rgba(184,224,74,.07);border:1px solid rgba(184,224,74,.12);border-radius:8px;padding:10px 14px;}
.streak-num{font-family:'Fraunces',serif;font-size:26px;font-weight:700;color:var(--lima);}
.streak-txt{font-family:'DM Mono',monospace;font-size:8px;color:rgba(184,224,74,.45);letter-spacing:1px;}
#main{flex:1;height:100vh;overflow-y:auto;display:flex;flex-direction:column;}
.topbar{padding:14px 32px;border-bottom:2px solid var(--borda);background:var(--branco);position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;}
.topbar-title{font-family:'Fraunces',serif;font-size:19px;font-weight:700;color:var(--verde2);}
.topbar-sub{font-family:'DM Mono',monospace;font-size:9px;color:var(--cinza2);letter-spacing:2px;margin-top:2px;}
.stats-row{display:flex;gap:22px;}
.stat{text-align:center;}
.stat-val{font-family:'Fraunces',serif;font-size:17px;font-weight:700;color:var(--verde);}
.stat-lbl{font-family:'DM Mono',monospace;font-size:8px;color:var(--cinza2);letter-spacing:1px;}
.content{padding:28px 32px 48px;flex:1;max-width:900px;}
.card{background:#fff;border:1.5px solid var(--borda);border-radius:14px;margin-bottom:20px;overflow:hidden;box-shadow:var(--sombra);}
.card-header{padding:15px 22px;border-bottom:1.5px solid var(--borda2);background:var(--papel);display:flex;align-items:center;gap:12px;}
.card-icon{font-size:20px;}
.card-title{font-family:'Fraunces',serif;font-size:16px;font-weight:700;color:var(--verde2);}
.card-sub{font-family:'DM Mono',monospace;font-size:9px;color:var(--cinza2);letter-spacing:2px;margin-top:2px;}
.card-body{padding:22px;}
.intro{font-size:14px;line-height:1.85;color:var(--escuro);margin-bottom:14px;}
.intro strong{color:var(--verde2);}
h3{font-family:'Fraunces',serif;font-size:15px;font-weight:700;color:var(--verde2);margin:18px 0 10px;}
h3:first-child{margin-top:0;}
.pt-word{font-family:'Fraunces',serif;font-size:14px;font-weight:700;color:var(--verde2);}
.phon{font-family:'DM Mono',monospace;font-size:10px;color:var(--cinza2);}
.rule-box{background:linear-gradient(135deg,rgba(0,112,74,.05),rgba(184,224,74,.05));border-left:3px solid var(--verde);border-radius:0 8px 8px 0;padding:12px 16px;margin:12px 0;font-size:13px;line-height:1.75;}
.rule-box strong{color:var(--verde2);}
.rule-box em{color:var(--verde);}
.tip-box{background:rgba(184,224,74,.1);border:1px solid rgba(184,224,74,.35);border-radius:8px;padding:12px 16px;margin:12px 0;font-size:13px;line-height:1.75;}
.tip-box strong{color:var(--verde2);}
.alerta-box{background:rgba(200,60,50,.05);border:1px solid rgba(200,60,50,.2);border-radius:8px;padding:12px 16px;margin:12px 0;font-size:13px;line-height:1.75;}
.alerta-box strong{color:#b83030;}
.table-wrap{overflow-x:auto;margin:10px 0;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{background:var(--verde3);color:var(--lima);font-family:'DM Mono',monospace;font-size:9px;letter-spacing:2px;padding:9px 12px;text-align:left;}
td{padding:9px 12px;border-bottom:1px solid var(--borda2);vertical-align:top;line-height:1.5;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:rgba(0,112,74,.025);}
.tag{display:inline-block;padding:2px 7px;border-radius:3px;font-family:'DM Mono',monospace;font-size:9px;font-weight:600;letter-spacing:1px;}
.tag-igual{background:rgba(0,112,74,.12);color:var(--verde2);}
.tag-diff{background:rgba(184,224,74,.25);color:#4a6b1f;}
.tag-falso{background:rgba(200,60,50,.1);color:#b83030;}
.tag-cuidado{background:rgba(200,140,0,.12);color:#8b6500;}
.audio-btn{background:none;border:1.5px solid var(--verde);color:var(--verde);padding:5px 12px;border-radius:20px;font-family:'DM Mono',monospace;font-size:10px;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:5px;margin:3px 4px 3px 0;}
.audio-btn:hover{background:var(--verde);color:#fff;}
.audio-btn.playing{background:var(--verde);color:#fff;animation:pulse .8s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
.vocab-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:11px;margin:10px 0;}
.vocab-card{background:var(--papel);border:1.5px solid var(--borda);border-radius:10px;padding:13px;transition:all .2s;}
.vocab-card:hover{border-color:var(--verde);transform:translateY(-2px);box-shadow:0 4px 14px rgba(0,112,74,.13);}
.vocab-pt{font-family:'Fraunces',serif;font-size:16px;font-weight:700;color:var(--verde2);}
.vocab-es{font-size:11px;color:var(--cinza);margin-top:2px;}
.vocab-phon{font-family:'DM Mono',monospace;font-size:10px;color:var(--cinza2);margin-top:2px;}
.ex-block{background:var(--papel);border:1.5px solid var(--borda);border-radius:10px;padding:17px;margin-bottom:13px;}
.ex-label{font-family:'DM Mono',monospace;font-size:9px;color:var(--cinza2);letter-spacing:2px;margin-bottom:7px;}
.ex-q{font-size:14px;font-weight:600;color:var(--escuro);margin-bottom:11px;line-height:1.5;}
.opts-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:9px;}
.opt-btn{padding:10px 13px;background:#fff;border:1.5px solid var(--borda);border-radius:8px;font-family:'Lora',serif;font-size:13px;cursor:pointer;transition:all .2s;text-align:left;}
.opt-btn:hover{border-color:var(--verde);background:rgba(0,112,74,.03);}
.opt-btn.correct{background:rgba(0,112,74,.1);border-color:var(--verde);color:var(--verde2);}
.opt-btn.wrong{background:rgba(200,60,50,.07);border-color:#c0392b;color:#c0392b;}
.opt-btn:disabled{cursor:not-allowed;}
.feedback{margin-top:9px;padding:9px 13px;border-radius:8px;font-size:13px;display:none;}
.feedback.show{display:block;}
.feedback.ok{background:rgba(0,112,74,.08);border:1px solid rgba(0,112,74,.2);color:var(--verde2);}
.feedback.ko{background:rgba(200,60,50,.06);border:1px solid rgba(200,60,50,.2);color:#c0392b;}
.fb-title{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:1px;margin-bottom:4px;font-weight:600;}
.ex-explain{margin-top:7px;padding:8px 12px;background:var(--papel2);border-radius:6px;font-size:12px;color:var(--cinza);display:none;line-height:1.65;}
.fill-input{padding:9px 12px;border:1.5px solid var(--borda);border-radius:8px;font-family:'Lora',serif;font-size:14px;color:var(--escuro);background:#fff;width:220px;transition:all .2s;outline:none;}
.fill-input:focus{border-color:var(--verde);}
.fill-input.ok{border-color:var(--verde);background:rgba(0,112,74,.04);}
.fill-input.ko{border-color:#c0392b;background:rgba(200,60,50,.04);}
.check-btn{padding:9px 17px;background:var(--verde);color:#fff;border:none;border-radius:8px;font-family:'DM Mono',monospace;font-size:11px;letter-spacing:1px;cursor:pointer;transition:all .2s;}
.check-btn:hover{background:var(--verde2);}
.word-chips{display:flex;flex-wrap:wrap;gap:7px;margin:9px 0;padding:11px;background:#fff;border:1.5px solid var(--borda);border-radius:8px;min-height:46px;}
.word-chip{padding:6px 12px;background:var(--papel2);border:1.5px solid var(--borda);border-radius:20px;font-family:'Lora',serif;font-size:13px;cursor:pointer;transition:all .15s;user-select:none;}
.word-chip:hover{border-color:var(--verde);background:rgba(0,112,74,.05);}
.word-chip.used{opacity:.3;cursor:not-allowed;pointer-events:none;}
.answer-zone{min-height:42px;padding:8px 12px;background:rgba(0,112,74,.04);border:1.5px dashed var(--verde);border-radius:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:9px;}
.answer-chip{padding:5px 12px;background:var(--verde);color:#fff;border-radius:20px;font-family:'Lora',serif;font-size:13px;cursor:pointer;}
.fc-wrap{perspective:900px;width:100%;max-width:460px;margin:0 auto;}
.fc{width:100%;height:230px;position:relative;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.4,0,.2,1);cursor:pointer;}
.fc.flipped{transform:rotateY(180deg);}
.fc-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:22px;text-align:center;}
.fc-front{background:var(--verde3);border:2px solid var(--lima);}
.fc-back{background:var(--papel);border:2px solid var(--verde);transform:rotateY(180deg);}
.fc-hint{font-family:'DM Mono',monospace;font-size:9px;color:rgba(184,224,74,.45);letter-spacing:2px;margin-bottom:10px;}
.fc-pt{font-family:'Fraunces',serif;font-size:30px;font-weight:900;color:var(--lima);}
.fc-phon{font-family:'DM Mono',monospace;font-size:11px;color:rgba(184,224,74,.55);margin-top:5px;}
.fc-es{font-family:'Fraunces',serif;font-size:20px;font-weight:400;color:var(--verde2);margin-bottom:5px;}
.fc-gram{font-family:'DM Mono',monospace;font-size:10px;color:var(--cinza);line-height:1.65;white-space:pre-line;}
.fc-count{text-align:center;font-family:'DM Mono',monospace;font-size:10px;color:var(--cinza2);margin-top:9px;}
.srs-btns{display:flex;gap:9px;justify-content:center;margin-top:14px;}
.srs-btn{padding:8px 16px;border:none;border-radius:8px;font-family:'DM Mono',monospace;font-size:10px;letter-spacing:1px;cursor:pointer;transition:all .2s;}
.srs-hard{background:rgba(200,60,50,.1);color:#c0392b;border:1px solid rgba(200,60,50,.2);}
.srs-ok{background:rgba(200,140,0,.1);color:#8b6500;border:1px solid rgba(200,140,0,.2);}
.srs-easy{background:rgba(0,112,74,.1);color:var(--verde2);border:1px solid rgba(0,112,74,.2);}
.dialogue-line{display:flex;gap:13px;margin-bottom:13px;align-items:flex-start;}
.dialogue-speaker{font-family:'DM Mono',monospace;font-size:10px;color:var(--cinza2);letter-spacing:1px;min-width:76px;padding-top:2px;flex-shrink:0;}
.dialogue-pt{font-family:'Fraunces',serif;font-size:14px;font-weight:600;color:var(--verde2);}
.dialogue-es{font-size:12px;color:var(--cinza);font-style:italic;margin-top:2px;}
.validate-section{background:var(--papel);border:2px dashed var(--borda);border-radius:12px;padding:22px;margin-top:26px;text-align:center;transition:all .4s;}
.validate-section.ready{border-color:var(--verde);border-style:solid;background:rgba(0,112,74,.02);}
.validate-section.done{border-color:var(--lima);background:rgba(184,224,74,.06);}
.val-title{font-family:'Fraunces',serif;font-size:16px;color:var(--cinza);}
.validate-section.ready .val-title,.validate-section.done .val-title{color:var(--verde2);}
.val-desc{font-family:'DM Mono',monospace;font-size:10px;color:var(--cinza2);letter-spacing:1px;margin:7px 0 11px;}
.val-hint{font-family:'DM Mono',monospace;font-size:11px;color:var(--cinza2);margin:7px 0 11px;}
.hint-bar{height:4px;background:var(--papel2);border-radius:2px;margin-top:4px;overflow:hidden;}
.hint-fill{height:100%;background:linear-gradient(90deg,var(--verde),var(--lima));border-radius:2px;transition:width .4s;}
.vp-row{display:flex;gap:5px;justify-content:center;flex-wrap:wrap;margin-bottom:13px;}
.vp-item{font-family:'DM Mono',monospace;font-size:9px;padding:3px 8px;border-radius:10px;border:1px solid var(--borda);}
.vp-done{background:rgba(0,112,74,.1);color:var(--verde2);border-color:rgba(0,112,74,.25);}
.vp-ready{background:rgba(184,224,74,.18);color:#4a6b1f;border-color:rgba(184,224,74,.45);}
.vp-pend{background:var(--papel2);color:var(--cinza2);}
.val-btn{padding:11px 26px;border-radius:10px;font-family:'DM Mono',monospace;font-size:11px;letter-spacing:2px;font-weight:500;transition:all .3s;border:2px solid;cursor:pointer;}
.val-btn.locked-btn{background:var(--papel2);border-color:var(--borda);color:var(--cinza2);cursor:not-allowed;}
.val-btn.active{background:var(--verde);border-color:var(--verde);color:#fff;box-shadow:0 4px 18px rgba(0,112,74,.22);}
.val-btn.active:hover{background:var(--verde2);transform:translateY(-1px);}
.val-btn.validated{background:rgba(0,112,74,.1);border-color:var(--verde);color:var(--verde2);cursor:default;}
.unlock-banner{display:none;margin-top:12px;padding:11px 15px;background:rgba(184,224,74,.13);border:1px solid rgba(184,224,74,.45);border-radius:8px;font-family:'DM Mono',monospace;font-size:11px;color:#4a6b1f;letter-spacing:1px;}
.unlock-banner.show{display:block;}
.locked-overlay{display:none;text-align:center;padding:80px 36px;}
.locked-overlay.show{display:block;}
.lock-big{font-size:50px;margin-bottom:14px;}
.lock-msg{font-family:'Fraunces',serif;font-size:21px;font-weight:700;color:var(--verde2);}
.lock-sub{font-family:'DM Mono',monospace;font-size:10px;color:var(--cinza2);letter-spacing:2px;margin-top:7px;}
.ex-complete{display:none;padding:11px 15px;background:rgba(0,112,74,.09);border:1px solid rgba(0,112,74,.25);border-radius:8px;margin-bottom:14px;font-family:'DM Mono',monospace;font-size:11px;color:var(--verde2);letter-spacing:1px;}
.toast{position:fixed;bottom:26px;right:26px;background:var(--escuro);border-radius:10px;padding:12px 18px;font-family:'DM Mono',monospace;font-size:12px;color:var(--lima);transform:translateY(120px);opacity:0;transition:all .4s;z-index:1000;max-width:280px;box-shadow:0 8px 28px rgba(0,0,0,.18);}
.toast.show{transform:translateY(0);opacity:1;}
.writing-area{width:100%;min-height:155px;background:var(--papel);border:1.5px solid var(--borda);border-radius:10px;padding:13px;font-family:'Lora',serif;font-size:14px;color:var(--escuro);resize:vertical;outline:none;transition:border-color .2s;line-height:1.8;}
.writing-area:focus{border-color:var(--verde);}
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--borda);border-radius:2px;}
</style>
</head>
<body>
<nav id="sidebar">
  <div class="sb-header">
    <div class="sb-logo">Português<em>para hispanohablantes</em><span>INTENSIVO · 7 DÍAS</span></div>
    <div class="prog-wrap">
      <div class="prog-label">PROGRESO TOTAL</div>
      <div class="prog-bar"><div class="prog-fill" id="totalProg" style="width:0%"></div></div>
    </div>
  </div>
  <div class="days-nav" id="daysNav"></div>
  <div class="tab-section"><div class="tab-label">SECCIONES DEL DÍA</div><div id="tabSection"></div></div>
  <div class="sb-footer">
    <div class="streak-wrap">
      <div><div class="streak-num" id="streakNum">1</div><div class="streak-txt">DÍA DE<br>RACHA</div></div>
      <div style="margin-left:auto;font-size:26px">🔥</div>
    </div>
  </div>
</nav>
<main id="main">
  <div class="topbar">
    <div><div class="topbar-title" id="dayTitle">Día 1</div><div class="topbar-sub" id="daySub">VERBO SER</div></div>
    <div class="stats-row">
      <div class="stat"><div class="stat-val" id="wordsCount">0</div><div class="stat-lbl">PALABRAS</div></div>
      <div class="stat"><div class="stat-val" id="exCount">0</div><div class="stat-lbl">EJERCICIOS</div></div>
      <div class="stat"><div class="stat-val" id="minCount">0</div><div class="stat-lbl">MIN</div></div>
    </div>
  </div>
  <div class="content" id="mainContent"></div>
</main>
<div class="toast" id="toast"></div>
<script>

// ══ TTS ══
const synth = window.speechSynthesis;
let ptBR = null;
function initVoice() {
  const vs = synth.getVoices();
  ptBR = vs.find(v=>v.lang==='pt-BR') || vs.find(v=>v.lang.startsWith('pt')) || vs.find(v=>/portuguese|brasil/i.test(v.name)) || null;
}
if (synth) { synth.onvoiceschanged = initVoice; initVoice(); }

function speak(text, btn) {
  if (!synth) return;
  synth.cancel();
  if (btn && btn.classList.contains('playing')) { btn.classList.remove('playing'); if(btn._orig) btn.innerHTML=btn._orig; return; }
  const u = new SpeechSynthesisUtterance(text);
  if (ptBR) u.voice = ptBR;
  u.lang = 'pt-BR'; u.rate = 0.84; u.pitch = 1.0;
  if (btn) { btn._orig=btn.innerHTML; btn.classList.add('playing'); btn.innerHTML='🔊 Reproduciendo...';
    u.onend=()=>{ btn.classList.remove('playing'); btn.innerHTML=btn._orig; };
    u.onerror=()=>{ btn.classList.remove('playing'); btn.innerHTML=btn._orig; }; }
  synth.speak(u);
  if (state.currentTab==='simulation') addProg(state.currentDay,'simulation',1);
  if (state.currentTab==='grammar'||state.currentTab==='vocab') addProg(state.currentDay,state.currentTab,1);
}

function pKey(d,t){ return d+'-'+t; }
function getProg(d,t){ return state.tabProgress[pKey(d,t)]||0; }
function addProg(d,t,n){ const k=pKey(d,t); state.tabProgress[k]=(state.tabProgress[k]||0)+n; saveState(); updateValBtn(d,t); }
function setProg(d,t,v){ const k=pKey(d,t); state.tabProgress[k]=Math.max(state.tabProgress[k]||0,v); saveState(); updateValBtn(d,t); }
function canValidate(d,t){ if(state.tabsDone[d]?.[t]) return true; return getProg(d,t)>=TAB_REQ[t].min; }

function updateValBtn(day,tab){
  if(state.currentDay!==day||state.currentTab!==tab) return;
  const btn=document.getElementById('vbtn-'+day+'-'+tab);
  const hint=document.getElementById('vhint-'+day+'-'+tab);
  if(!btn||state.tabsDone[day]?.[tab]) return;
  const ok=canValidate(day,tab); const req=TAB_REQ[tab]; const p=getProg(day,tab);
  if(ok){ btn.className='val-btn active'; btn.disabled=false; if(hint) hint.style.display='none'; }
  else { btn.className='val-btn locked-btn'; btn.disabled=true;
    if(hint){ hint.style.display='block'; hint.innerHTML='🔒 '+req.label.replace('{p}',p)+'<div class="hint-bar"><div class="hint-fill" style="width:'+Math.min(100,Math.round(p/req.min*100))+'%"></div></div>'; } }
}

// ══ EXERCISE HELPERS ══
let reorderBufs = {};

function checkMC(id, idx, isCorrect, day){
  const block=document.getElementById(id);
  if(block?.dataset?.done) return;
  const opts=block.querySelectorAll('.opt-btn');
  opts.forEach(b=>b.disabled=true);
  opts[idx].classList.add(isCorrect?'correct':'wrong');
  if(!isCorrect){ opts.forEach((b,i)=>{ if(b.getAttribute('data-correct')==='true') b.classList.add('correct'); }); }
  const fb=document.getElementById(id+'-fb');
  const ex=document.getElementById(id+'-ex');
  fb.classList.add('show'); fb.classList.add(isCorrect?'ok':'ko');
  fb.innerHTML='<div class="fb-title">'+(isCorrect?'✅ CORRECTO':'❌ INCORRECTO')+'</div>'+(isCorrect?'¡Muy bien!':'Revisa la explicación abajo.');
  if(ex) ex.style.display='block';
  if(isCorrect){ block.dataset.done='1'; markExDone(day); }
}

function checkFill(id, answers, day){
  const block=document.getElementById(id);
  if(block?.dataset?.done) return;
  const inp=document.getElementById(id+'-inp');
  const fb=document.getElementById(id+'-fb');
  const ex=document.getElementById(id+'-ex');
  const val=inp.value.trim().toLowerCase();
  const ok=answers.split('|').some(a=>val===a.trim().toLowerCase());
  inp.classList.add(ok?'ok':'ko');
  fb.classList.add('show'); fb.classList.add(ok?'ok':'ko');
  fb.innerHTML='<div class="fb-title">'+(ok?'✅ CORRECTO':'❌ INCORRECTO')+'</div>'+(ok?'¡Perfecto!':'Respuesta esperada: <strong>'+answers.split('|')[0]+'</strong>');
  if(ex) ex.style.display='block';
  if(ok){ block.dataset.done='1'; markExDone(day); }
  else { setTimeout(()=>{ inp.classList.remove('ko'); inp.value=''; },1800); }
}

function selectChip(chip, id){
  chip.classList.add('used');
  if(!reorderBufs[id]) reorderBufs[id]=[];
  reorderBufs[id].push(chip.textContent);
  updateAnswerZone(id);
}
function updateAnswerZone(id){
  const zone=document.getElementById(id+'-zone');
  if(!zone) return;
  zone.innerHTML='';
  const buf=reorderBufs[id]||[];
  if(!buf.length){ zone.innerHTML='<span style="color:var(--cinza2);font-size:11px">Haz clic en las palabras arriba...</span>'; return; }
  buf.forEach((w,i)=>{
    const c=document.createElement('div'); c.className='answer-chip'; c.textContent=w;
    c.onclick=()=>{ reorderBufs[id].splice(i,1); const chips=document.querySelectorAll('#'+id+'-chips .word-chip'); chips.forEach(ch=>{ if(ch.textContent===w&&ch.classList.contains('used')){ ch.classList.remove('used'); } }); updateAnswerZone(id); };
    zone.appendChild(c);
  });
}
function checkReorder(id, correct, day){
  const block=document.getElementById(id);
  if(block?.dataset?.done) return;
  const ans=(reorderBufs[id]||[]).join(' ');
  const fb=document.getElementById(id+'-fb');
  const ex=document.getElementById(id+'-ex');
  fb.classList.add('show');
  if(ans.toLowerCase()===correct.toLowerCase()){
    fb.classList.add('ok'); fb.innerHTML='<div class="fb-title">✅ CORRECTO</div>¡Perfecto!';
    block.dataset.done='1'; markExDone(day);
  } else {
    fb.classList.add('ko'); fb.innerHTML='<div class="fb-title">❌ INCORRECTO</div>Tu respuesta: "'+ans+'"<br>Correcta: <strong>'+correct+'</strong>';
    if(ex) ex.style.display='block';
  }
}
function resetReorder(id){
  reorderBufs[id]=[];
  document.querySelectorAll('#'+id+'-chips .word-chip').forEach(c=>c.classList.remove('used'));
  updateAnswerZone(id);
  const fb=document.getElementById(id+'-fb'); if(fb){fb.classList.remove('show','ok','ko');fb.innerHTML='';}
}

function markExDone(day){
  setProg(day,'exercises',getProg(day,'exercises')+1);
  state.exercisesDone++;
  document.getElementById('exCount').textContent=state.exercisesDone;
  saveState();
  const total=document.querySelectorAll('.ex-block').length;
  if(getProg(day,'exercises')>=Math.min(6,total)){
    const c=document.getElementById('ex-complete-'+day); if(c) c.style.display='block';
  }
}

// ══ FLASHCARDS ══
function flipCard(day){ const fc=document.getElementById('fc-'+day); if(fc) fc.classList.toggle('flipped'); }
function srsRate(day,rating){
  const cards=FC[day]||[];
  if(!state.cardIndexes[day]) state.cardIndexes[day]=0;
  const card=cards[state.cardIndexes[day]%cards.length];
  const labels={hard:'mañana',ok:'3 días',easy:'7 días'};
  showToast('"'+card.pt+'" — próxima revisión en '+labels[rating]);
  state.cardIndexes[day]=(state.cardIndexes[day]+1)%cards.length;
  state.wordsLearned=Math.max(state.wordsLearned,Object.values(state.cardIndexes).reduce((a,b)=>a+b,0));
  document.getElementById('wordsCount').textContent=state.wordsLearned;
  addProg(day,'flashcards',1);
  saveState();
  renderContent();
}

// ══ WRITING ══
function analyzeWriting(day){
  const ta=document.getElementById('writing-'+day);
  if(!ta||ta.value.trim().length<10){ showToast('Escribe al menos una oración primero.'); return; }
  const text=ta.value.trim();
  const corrBox=document.getElementById('wcorr-'+day);
  const corrContent=document.getElementById('wcontent-'+day);
  if(!corrBox||!corrContent) return;
  corrBox.style.display='block';
  // Simple feedback based on keywords
  const hasPT = /\b(sou|estou|tenho|faço|vou|venho|posso|quero|é|está|tem|faz|vai|vem|pode|quer)\b/i.test(text);
  const hasES = /\b(soy|estoy|tengo|hago|voy|vengo|puedo|quiero|es|está|tiene|hace|va|viene|puede|quiere)\b/i.test(text);
  const wordCount = text.split(/\s+/).length;
  let feedback = '<div style="font-size:13px;line-height:1.8;color:var(--verde2)"><strong>✅ Análise do texto:</strong></div>';
  feedback += '<div style="font-size:13px;line-height:1.8;margin-top:8px;color:var(--escuro)">';
  feedback += '📝 <strong>'+wordCount+'</strong> palavras escritas.<br>';
  if(hasPT) feedback += '✅ Detectados verbos em português — ótimo!<br>';
  if(hasES) feedback += '⚠️ Cuidado: alguns verbos parecem estar em espanhol. Lembrar: <em>sou</em> (não "soy"), <em>estou</em> (não "estoy"), <em>tenho</em> (não "tengo").<br>';
  if(!hasPT && !hasES) feedback += '💡 Tente usar os verbos do dia: ser, estar, ter, fazer, ir/vir, poder, querer.<br>';
  feedback += '<br><em style="color:var(--cinza)">Para feedback detalhado, compartilhe seu texto com um professor nativo!</em>';
  feedback += '</div>';
  corrContent.innerHTML = feedback;
  setProg(day,'writing',1);
}

// ══ VALIDATE ══
function validateTab(day, tab){
  if(state.tabsDone[day]?.[tab]) return;
  if(!canValidate(day,tab)){ showToast('🔒 '+TAB_REQ[tab].label.replace('{p}',getProg(day,tab))); return; }
  if(!state.tabsDone[day]) state.tabsDone[day]={};
  state.tabsDone[day][tab]=true;
  const allDone=TABS.every(t=>state.tabsDone[day]?.[t]);
  if(allDone && !state.validatedDays.includes(day)){
    state.validatedDays.push(day);
    const next=day+1;
    if(next<=7 && !state.unlockedDays.includes(next)){
      state.unlockedDays.push(next);
      showToast('🎉 ¡Día '+next+' desbloqueado!');
    }
  }
  saveState();
  renderSidebar();
  renderContent();
}

// ══ NAVIGATION ══
function switchDay(day){
  if(!state.unlockedDays.includes(day)) return;
  state.currentDay=day; state.currentTab='grammar';
  saveState(); renderSidebar(); renderContent();
  document.getElementById('main').scrollTop=0;
}
function switchTab(tab){
  state.currentTab=tab;
  saveState(); renderSidebar(); renderContent();
  document.getElementById('main').scrollTop=0;
}

  const ok=canValidate(day,tab);
  const req=TAB_REQ[tab]; const p=getProg(day,tab);
  const tabStatus=TABS.map(t=>{
    const d=state.tabsDone[day]?.[t];
    const r=canValidate(day,t)&&!d;
    return '<span class="vp-item '+(d?'vp-done':r?'vp-ready':'vp-pend')+'">'+(d?'✓ ':r?'→ ':'')+TAB_LABELS[t].replace(/[^\w\s]/g,'').trim().split(' ')[0]+'</span>';
  }).join('');

  const btnCls='val-btn '+(isDone?'validated':ok?'active':'locked-btn');
  const btnTxt=isDone?'✓ COMPLETADO':ok?'VALIDAR SECCIÓN ✓':'SECCIÓN BLOQUEADA 🔒';
  const btnDisabled=(isDone||!ok)?'disabled':'';
  const hintHTML=(!isDone&&!ok)?'<div class="val-hint" id="vhint-'+day+'-'+tab+'">🔒 '+req.label.replace('{p}',p)+'<div class="hint-bar"><div class="hint-fill" style="width:'+Math.min(100,Math.round(p/req.min*100))+'%"></div></div></div>':'<div id="vhint-'+day+'-'+tab+'" style="display:none"></div>';
  const unlockBanner=allDone&&!state.validatedDays.includes(day)?'<div class="unlock-banner show">🔓 ¡Todas las secciones completadas! El Día '+(day+1)+' se ha desbloqueado.</div>':state.validatedDays.includes(day)?'<div class="unlock-banner show">✅ ¡Día '+day+' completado al 100%!</div>':'<div class="unlock-banner" id="ub-'+day+'"></div>';

  return '<div class="validate-section '+(isDone?'done':ok?'ready':'')+'" id="vsec-'+day+'-'+tab+'"><div class="val-title">Validar Sección — '+TAB_LABELS[tab]+'</div><div class="val-desc">PROGRESO DEL DÍA '+day+'</div>'+hintHTML+'<div class="vp-row">'+tabStatus+'</div><button class="'+btnCls+'" '+btnDisabled+' onclick="validateTab('+day+',\''+tab+'\')" id="vbtn-'+day+'-'+tab+'">'+btnTxt+'</button>'+unlockBanner+'</div>';
}

// ══ WRITING CONTENT ══
function writingContent(day) {
const tasks = {
1:{title:'Quién soy yo',prompt:'Escribe una presentación de 5–8 frases usando solo ser. Incluye: nombre, origen (ser de + lugar), profesión, características físicas o de personalidad, y una descripción de tu país.',guide:['Sou [nome].','Sou de [país/cidade].','Sou [profissão].','Sou [característica: alto/a, simpático/a...].','[País] é [adjetivo: grande, bonito, quente...].','A minha cidade é [adjetivo].']},
2:{title:'Cómo estoy hoy',prompt:'Describe tu día de hoy usando estar. Incluye: cómo estás, sensaciones físicas (com fome/frio/sono...), dónde estás, qué estás haciendo ahora y cómo estabas ayer.',guide:['Hoje estou [estado].','Estou com [sensação].','Estou em [lugar].','Estou [gerúndio: estudando/trabalhando...].','Ontem estava [estado diferente].']},
3:{title:'Lo que tengo y lo que debo hacer',prompt:'Escribe sobre lo que tienes (familia, objetos, tiempo) y lo que tienes que/debes hacer esta semana. Usa ter en diferentes contextos.',guide:['Tenho [família/objetos].','Tenho [X] anos.','Não tenho [algo que falta].','Tenho de/que [obrigação] esta semana.','Tem [coisa] aqui perto. (= hay)']},
4:{title:'Mi rutina con fazer',prompt:'Describe tu rutina diaria usando fazer. Incluye qué haces cada día, qué hiciste ayer, el tiempo que hace en tu ciudad y algo que haces como hobby.',guide:['Todo dia faço [atividade].','Ontem fiz [ação].','No meu país faz [clima] no inverno.','Faço [hobby] nos fins de semana.','Faz [X] meses/anos que [algo].']},
5:{title:'Mis desplazamientos',prompt:'Cuenta cómo vas y vienes a diferentes lugares. Usa ir y vir con diferentes transportes, destinos (ao/à) y el futuro próximo.',guide:['Todo dia vou ao/à [lugar] de [transporte].','Ontem vim de [lugar] de/a pé.','Amanhã vou [futuro: vou + inf.].','Vou ao [masc.] / à [fem.] [lugar].','Ela veio / Eles vieram [pretérito vir].']},
6:{title:'Lo que puedo y lo que quiero',prompt:'Escribe sobre tus capacidades y deseos en portugués. Combina poder y querer con los verbos de los días anteriores (ser, estar, ter, fazer, ir, vir).',guide:['Posso [verbo] mas não posso [verbo].','Quero [verbo] + mais em português.','Não quero [algo] porque [razão].','Posso fazer [algo]? = Puedo hacer algo.','Quero poder [verbo] melhor.']},

// ══ FLASHCARD SECTION HTML ══
function flashcardsContent(day) {
  const cards = FC[day]||[];

  const idx = state.cardIndexes[day]%cards.length;
  const card = cards[idx];
  return `<div class="card">
<div class="card-header"><span class="card-icon">🃏</span><div><div class="card-title">Flashcards — Día ${day}</div><div class="card-sub">${cards.length} TARJETAS · SRS · DIFERENÇAS PT/ES</div></div></div>
<div class="card-body">
<div class="fc-wrap">
  <div class="fc" id="fc-${day}" onclick="flipCard(${day})">
    <div class="fc-face fc-front">
      <div class="fc-hint">PORTUGUÉS → ESPAÑOL · CLICA PARA VER</div>
      <div class="fc-pt">${card.pt}</div>
      ${card.phon?'<div class="fc-phon">'+card.phon+'</div>':''}
      <button class="audio-btn" style="margin-top:12px" onclick="event.stopPropagation();speak('${card.pt.replace(/'/g,"\\'")}',this)">🔊 Ouvir</button>
    </div>
    <div class="fc-face fc-back">
      <div class="fc-hint">ESPAÑOL</div>
      <div class="fc-es">${card.es}</div>
      <div class="fc-gram">${card.g}</div>
    </div>
  </div>
</div>
<div class="fc-count">Tarjeta ${idx+1} de ${cards.length} · Revisadas hoy: ${getProg(day,'flashcards')}</div>
<div class="srs-btns">
  <button class="srs-btn srs-hard" onclick="srsRate(${day},'hard')">😰 DIFÍCIL<br><span style="font-size:9px">mañana</span></button>
  <button class="srs-btn srs-ok" onclick="srsRate(${day},'ok')">😊 BIEN<br><span style="font-size:9px">3 días</span></button>
  <button class="srs-btn srs-easy" onclick="srsRate(${day},'easy')">🌟 FÁCIL<br><span style="font-size:9px">7 días</span></button>
</div>
<div class="tip-box" style="margin-top:16px">💡 <strong>Cómo usar:</strong> Lee el portugués, intenta recordar el español y la gramática, luego clica para ver la respuesta. Usa los botones SRS para programar la próxima revisión.</div>
</div></div>`;
}

// ══ RENDER ENGINE ══
function renderSidebar(){
  // Days nav
  let daysHTML = '';
  DAYS_META.forEach(m => {
    const locked = !state.unlockedDays.includes(m.day);
    const active = state.currentDay === m.day;
    const done = state.validatedDays.includes(m.day);
    const cls = 'day-btn'+(active?' active':'')+(locked?' locked':'')+(done&&!active?' done-day':'');
    daysHTML += `<button class="${cls}" onclick="switchDay(${m.day})" ${locked?'disabled':''}>
      <span class="day-num">D${m.day}</span>
      <span style="flex:1">${m.title}</span>
      ${done?'<span style="color:var(--lima);font-size:11px">✓</span>':locked?'<span class="lock-icon">🔒</span>':''}
    </button>`;
  });
  document.getElementById('daysNav').innerHTML = daysHTML;

  // Tabs
  let tabsHTML = '';
  TABS.forEach(t => {
    const active = state.currentTab === t;
    const done = state.tabsDone[state.currentDay]?.[t];
    const cls = 'tab-btn'+(active?' active':'');
    tabsHTML += `<button class="${cls}" onclick="switchTab('${t}')">
      ${TAB_LABELS[t]}
      ${done?'<span class="tab-done">✓</span>':''}
    </button>`;
  });
  document.getElementById('tabSection').innerHTML = tabsHTML;

  // Progress
  const totalSections = 7 * TABS.length;
  const done = Object.values(state.tabsDone).reduce((a,d)=>a+Object.keys(d).length,0);
  document.getElementById('totalProg').style.width = Math.round(done/totalSections*100)+'%';
}

function renderContent(){
  const day = state.currentDay;
  const tab = state.currentTab;
  const meta = DAYS_META[day-1];

  document.getElementById('dayTitle').textContent = 'Día '+day+' — '+meta.title;
  document.getElementById('daySub').textContent = meta.sub;

  const locked = !state.unlockedDays.includes(day);
  if(locked){
    document.getElementById('mainContent').innerHTML = `<div class="locked-overlay show"><div class="lock-big">🔒</div><div class="lock-msg">Día ${day} bloqueado</div><div class="lock-sub">COMPLETA EL DÍA ${day-1} PARA DESBLOQUEAR</div></div>`;
    return;
  }

  let html = '';
  if(tab==='grammar') { html = grammarContent(day); setProg(day,'grammar',1); }
  else if(tab==='vocab') { html = vocabContent(day); setProg(day,'vocab',1); }
  else if(tab==='exercises') html = exercisesContent(day);
  else if(tab==='flashcards') html = flashcardsContent(day);
  else if(tab==='simulation') html = simulationContent(day);
  else if(tab==='writing') html = writingContent(day);

  html += validateSectionHTML(day, tab);
  document.getElementById('mainContent').innerHTML = html;

  // Restore done states
  document.querySelectorAll('.ex-block').forEach(b=>{
    if(state.tabsDone[day]?.exercises) b.dataset.done='1';
  });
  const total = document.querySelectorAll('.ex-block').length;
  if(getProg(day,'exercises')>=Math.min(6,total)){
    const c=document.getElementById('ex-complete-'+day); if(c) c.style.display='block';
  }

  updateValBtn(day,tab);
}

// ══ TIMER ══
setInterval(()=>{
  state.minutesElapsed++;
  document.getElementById('minCount').textContent=state.minutesElapsed;
  saveState();
},60000);

// ══ STREAK ══
function updateStreak(){
  const today = new Date().toDateString();
  if(state.lastVisit!==today){
    const yesterday = new Date(Date.now()-86400000).toDateString();
    if(state.lastVisit===yesterday) state.streak=(state.streak||1)+1;
    else if(state.lastVisit!==today) state.streak=1;
    state.lastVisit=today;
    saveState();
  }
  document.getElementById('streakNum').textContent=state.streak||1;
}
updateStreak();
document.getElementById('exCount').textContent=state.exercisesDone||0;
document.getElementById('wordsCount').textContent=state.wordsLearned||0;
document.getElementById('minCount').textContent=state.minutesElapsed||0;

// ══ INIT ══
renderSidebar();
renderContent();
</script></body></html>
