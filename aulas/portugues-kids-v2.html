// ─── SOUND ────────────────────────────────────────────────────────────────────
const playSound = (type) => {
    try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        const now = ctx.currentTime;
        if (type === 'correct') {
            osc.frequency.setValueAtTime(300, now);
            osc.frequency.exponentialRampToValueAtTime(600, now + 0.15);
            gain.gain.setValueAtTime(0.1, now); gain.gain.linearRampToValueAtTime(0, now + 0.2);
        } else if (type === 'error') {
            osc.frequency.setValueAtTime(200, now);
            osc.frequency.linearRampToValueAtTime(100, now + 0.15);
            gain.gain.setValueAtTime(0.1, now); gain.gain.linearRampToValueAtTime(0, now + 0.2);
        }
        osc.start(); osc.stop(now + 0.2);
    } catch(e) {}
};

// ─── REVISION COMPONENT (WITH FIRESTORE) ──────────────────────────────────────
const TotalRevision = ({ onComplete }) => {
    const [index, setIndex] = useState(0);
    const [input, setInput] = useState('');
    const [feedback, setFeedback] = useState(null);
    const [score, setScore] = useState(0);
    const [db, setDb] = useState(null);
    const [user, setUser] = useState(null);
    const [loading, setLoading] = useState(true);

    const appId = typeof __app_id !== 'undefined' ? __app_id : 'oi-brasil-default';

    // Firebase Init
    useEffect(() => {
        const { initializeApp, getAuth, signInAnonymously, onAuthStateChanged, getFirestore } = window.firebaseCore;
        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const firestore = getFirestore(app);
        setDb(firestore);

        signInAnonymously(auth).catch(console.error);
        
        const unsubscribe = onAuthStateChanged(auth, (u) => {
            if (u) {
                setUser(u);
                loadProgress(firestore, u.uid);
            }
        });
        return () => unsubscribe();
    }, []);

    const loadProgress = async (firestore, uid) => {
        const { doc, getDoc } = window.firebaseCore;
        const progressDoc = doc(firestore, 'artifacts', appId, 'users', uid, 'data', 'revision');
        try {
            const snap = await getDoc(progressDoc);
            if (snap.exists()) {
                const data = snap.data();
                setIndex(data.index || 0);
                setScore(data.score || 0);
            }
        } catch (e) { console.error(e); }
        setLoading(false);
    };

    const saveProgress = async (newIdx, newScore) => {
        if (!user || !db) return;
        const { doc, setDoc } = window.firebaseCore;
        const progressDoc = doc(db, 'artifacts', appId, 'users', user.uid, 'data', 'revision');
        await setDoc(progressDoc, { index: newIdx, score: newScore }, { merge: true });
    };

    const handleCheck = () => {
        const current = REVISION_DATA[index];
        const isCorrect = input.trim().toLowerCase() === current.a.toLowerCase();
        
        if (isCorrect) {
            playSound('correct');
            setFeedback('correct');
            const nextScore = score + 1;
            setScore(nextScore);
            setTimeout(() => {
                const nextIdx = index + 1;
                if (nextIdx < REVISION_DATA.length) {
                    setIndex(nextIdx);
                    setInput('');
                    setFeedback(null);
                    saveProgress(nextIdx, nextScore);
                } else {
                    setFeedback('finished');
                    saveProgress(nextIdx, nextScore);
                }
            }, 1000);
        } else {
            playSound('error');
            setFeedback('error');
            setTimeout(() => setFeedback(null), 1000);
        }
    };

    const resetRevision = async () => {
        if (!confirm("Deseja realmente recomeçar toda a revisão?")) return;
        setIndex(0);
        setScore(0);
        setInput('');
        setFeedback(null);
        saveProgress(0, 0);
    };

    if (loading) return <div className="text-center py-20 text-[#00F5D4] font-black animate-pulse text-2xl">Carregando progresso...</div>;

    if (feedback === 'finished' || index >= REVISION_DATA.length) {
        return (
            <div className="flex flex-col items-center gap-6 slide-up text-center">
                <div className="text-6xl">🏆</div>
                <h2 className="text-4xl font-black text-[#00F5D4]">Revisão Concluída!</h2>
                <p className="text-xl text-white/60">Você acertou {score} de {REVISION_DATA.length} frases.</p>
                <div className="flex gap-4">
                    <Button onClick={resetRevision} variant="ghost">Recomeçar Revisão</Button>
                    <Button onClick={onComplete} variant="accent">Voltar ao Menu</Button>
                </div>
            </div>
        );
    }

    const current = REVISION_DATA[index];

    return (
        <div className="max-w-xl mx-auto slide-up">
            <div className="flex justify-between items-center mb-6 text-xs font-black text-white/40 uppercase tracking-widest">
                <span>Frase {index + 1} de {REVISION_DATA.length}</span>
                <span className="text-[#00F5D4]">Acertos: {score}</span>
            </div>

            <div className="w-full bg-white/5 rounded-full h-2 mb-8 overflow-hidden">
                <div className="bg-[#00F5D4] h-full transition-all duration-500" style={{width: `${(index/REVISION_DATA.length)*100}%`}}></div>
            </div>

            <div className={`bg-[#1A1035] border-2 rounded-[32px] p-8 md:p-12 text-center transition-all duration-300 ${feedback === 'correct' ? 'border-green-500' : feedback === 'error' ? 'border-red-500 animate-shake' : 'border-[#FF3CAC]/30'}`}>
                <span className="text-xs font-black text-[#FF3CAC] block mb-4 uppercase">{current.h}</span>
                <div className="text-2xl md:text-3xl font-black text-white mb-8 leading-relaxed">
                    {current.q.split('____').map((part, i) => (
                        <React.Fragment key={i}>
                            {part}
                            {i === 0 && (
                                <input 
                                    type="text" 
                                    value={input} 
                                    onChange={e => setInput(e.target.value)}
                                    onKeyPress={e => e.key === 'Enter' && handleCheck()}
                                    className={`mx-2 bg-transparent border-b-4 border-white/20 text-center text-[#00F5D4] transition-colors focus:border-[#00F5D4] w-24 md:w-32 ${feedback === 'correct' ? 'text-green-400' : feedback === 'error' ? 'text-red-400' : ''}`}
                                    autoFocus
                                />
                            )}
                        </React.Fragment>
                    ))}
                </div>
                <p className="text-white/30 italic text-sm mb-10">"{current.trans}"</p>
                
                <div className="flex flex-col gap-4">
                    <Button onClick={handleCheck} variant="accent" className="w-full text-lg">Verificar</Button>
                    <button onClick={resetRevision} className="text-xs font-black text-white/20 hover:text-white/60 transition-colors uppercase py-2">Recomeçar Lição</button>
                </div>
            </div>
        </div>
    );
};

// ─── MEMORY GAME ─────────────────────────────────────────────────────────────
const MemoryGame = ({ data, onComplete, type='text-text' }) => {
    const [cards, setCards] = useState([]);
    const [flipped, setFlipped] = useState([]);
    const [matched, setMatched] = useState([]);
    const [locked, setLocked] = useState(false);

    useEffect(() => {
        let pool = [];
        if (type==='text-text') pool = data.flatMap((item,idx) => [{id:`${idx}-pt`, content:item.pt, pairId:idx, side:'pt'}, {id:`${idx}-es`, content:item.es, pairId:idx, side:'es'}]);
        else if (type==='emoji-text') pool = data.flatMap((item,idx) => [{id:`${idx}-emoji`, content:item.emoji, sub:item.es, pairId:idx, side:'emoji'}, {id:`${idx}-pt`, content:item.pt, pairId:idx, side:'pt'}]);
        setCards(shuffleArray(pool));
    }, [data, type]);

    const handleFlip = (card) => {
        if (locked || flipped.includes(card.id) || matched.includes(card.pairId)) return;
        const nf = [...flipped, card.id];
        setFlipped(nf);
        if (nf.length === 2) {
            setLocked(true);
            const c1 = cards.find(c=>c.id===nf[0]); const c2 = cards.find(c=>c.id===nf[1]);
            if (c1.pairId === c2.pairId) {
                const nm = [...matched, c1.pairId]; setMatched(nm); setFlipped([]); setLocked(false);
                if (nm.length === data.length) setTimeout(onComplete, 1200);
            } else { setTimeout(() => { setFlipped([]); setLocked(false); }, 1000); }
        }
    };

    return (
        <div className="grid grid-cols-2 sm:grid-cols-4 gap-4 w-full max-w-4xl mx-auto p-4 perspective-1000">
            {cards.map(card => {
                const isFlipped = flipped.includes(card.id) || matched.includes(card.pairId);
                return (
                    <div key={card.id} onClick={()=>handleFlip(card)} className={`relative h-32 md:h-40 cursor-pointer transition-transform duration-500 transform-style-3d ${isFlipped ? 'rotate-y-180' : ''}`}>
                        <div className="absolute inset-0 bg-[#7B2FFF] rounded-2xl flex items-center justify-center border-b-4 border-indigo-900 backface-hidden z-20"><span className="text-4xl text-white/50 font-black">?</span></div>
                        <div className={`absolute inset-0 rounded-2xl flex flex-col items-center justify-center p-2 text-center rotate-y-180 backface-hidden border-b-4 shadow-xl z-10 ${card.side==='pt'?'bg-[#FF3CAC] border-pink-900':'bg-[#00F5D4] border-teal-900'}`}>
                            <span className="font-black text-sm">{card.content}</span>
                        </div>
                    </div>
                );
            })}
        </div>
    );
};

// ─── THEORY LESSON ────────────────────────────────────────────────────────────
const TheoryLesson = ({ data, onComplete, title }) => {
    const [slide, setSlide] = useState(0);
    const cur = data[slide];
    return (
        <div className="max-w-4xl mx-auto slide-up flex flex-col theory-card">
            <h2 className="text-2xl font-black text-[#00F5D4] text-center mb-6">{title}</h2>
            <div className={`rounded-[40px] p-8 md:p-12 shadow-2xl transition-all duration-500 ${cur.bg} text-white relative overflow-hidden flex-1 flex flex-col justify-between`}>
                <div>
                    <h2 className="text-3xl md:text-5xl font-black mb-4 drop-shadow-lg">{cur.title}</h2>
                    <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mt-8">
                        {cur.items.map((item, i) => (
                            <div key={i} className="bg-white/20 backdrop-blur-md rounded-3xl p-6 text-center border border-white/30">
                                <div className="text-4xl mb-2">{item.n}</div>
                                <div className="text-xl font-black">{item.pt}</div>
                            </div>
                        ))}
                    </div>
                </div>
                <div className="flex justify-between mt-12 items-center">
                    <Button onClick={() => slide > 0 && setSlide(slide-1)} variant="ghost" className={slide === 0 ? 'invisible' : ''}>Atrás</Button>
                    <Button onClick={()=>slide < data.length - 1 ? setSlide(slide+1) : onComplete()} variant="accent">{slide === data.length - 1 ? 'Pronto!' : 'Próximo'}</Button>
                </div>
            </div>
        </div>
    );
};

// ─── HOME VIEW ────────────────────────────────────────────────────────────────
const HomeView = ({ onStartModule }) => {
    const phrase = useMemo(()=>MOTIVATIONAL_PHRASES[Math.floor(Math.random()*MOTIVATIONAL_PHRASES.length)],[]);
    const modules = [
        {id:'m1a', emoji:'💜', label:'Aula 1A', sub:'Saludos', color:'#7B2FFF'},
        {id:'m1b', emoji:'🏠', label:'Aula 1B', sub:'Gostos', color:'#4361EE'},
        {id:'m2',  emoji:'📖', label:'Aula 2',  sub:'Números', color:'#00a89c'},
        {id:'m2p', emoji:'🎒', label:'Prática', sub:'Escola', color:'#FF3CAC'},
        {id:'m3',  emoji:'🧪', label:'Aula 3',  sub:'Revisão', color:'#FF6B35'},
        {id:'m_rev', emoji:'🔥', label:'Super Revisão', sub:'50 Questões', color:'#00F5D4', textDark: true, highlight: true},
    ];
    return (
        <div className="flex flex-col items-center justify-center text-center px-3 py-6 slide-up min-h-[80vh]">
            <h1 className="text-5xl md:text-7xl font-black mb-2 text-white animate-bounce-slow">Oi, Brasil! 🇧🇷</h1>
            <p className="text-base font-bold text-[#00F5D4] mb-12 uppercase tracking-widest">¡Aprendé jogando!</p>
            <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-3 w-full max-w-6xl">
                {modules.map(m => (
                    <button key={m.id} onClick={()=>onStartModule(m.id)} className={`relative rounded-[24px] p-5 transition-all hover:scale-105 shadow-xl border-4 ${m.highlight ? 'ring-4 ring-[#00F5D4]/40 animate-pulse' : ''}`} style={{backgroundColor:m.color, borderColor:m.color}}>
                        <span className="text-3xl mb-2 block">{m.emoji}</span>
                        <h2 className={`text-sm font-black ${m.textDark?'text-[#0F0A1E]':'text-white'}`}>{m.label}</h2>
                    </button>
                ))}
            </div>
            <div className="mt-12 bg-[#1A1035] rounded-3xl px-6 py-3 border border-white/10 max-w-sm">
                <p className="italic text-white/50 font-medium text-sm">"{phrase}"</p>
            </div>
        </div>
    );
};

// ─── APP ──────────────────────────────────────────────────────────────────────
function App() {
    const [view, setView] = useState('home');
    const goHome = () => setView('home');

    return (
        <div className="min-h-screen bg-[#0F0A1E] text-white">
            <header className="px-4 py-3 bg-[#0F0A1E]/90 backdrop-blur-md sticky top-0 border-b border-white/5 flex justify-between items-center z-50">
                <div onClick={goHome} className="flex items-center gap-2 cursor-pointer">
                    <span className="text-2xl">👩‍🚀</span>
                    <h1 className="text-lg font-black">Oi, Brasil! 🇧🇷</h1>
                </div>
                {view!=='home' && <Button onClick={goHome} variant="ghost" className="px-3 py-2 text-sm flex items-center gap-1.5"><IconArrowLeft/>Voltar</Button>}
            </header>

            <main className="px-4 py-10 max-w-5xl mx-auto">
                {view==='home' && <HomeView onStartModule={setView}/>}
                {view==='m1a' && <MemoryGame data={CLASS_1A_GREETINGS} onComplete={goHome}/>}
                {view==='m1b' && <TheoryLesson data={CLASS_1B_THEORY} title="Aula 1B" onComplete={goHome}/>}
                {view==='m2' && <TheoryLesson data={CLASS_2_THEORY} title="Aula 2" onComplete={goHome}/>}
                {view==='m2p' && <MemoryGame data={CLASS_2_MEM_A} type="emoji-text" onComplete={goHome}/>}
                {view==='m3' && <TheoryLesson data={CLASS_3_THEORY} title="Aula 3" onComplete={goHome}/>}
                {view==='m_rev' && <TotalRevision onComplete={goHome} />}
            </main>
        </div>
    );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
