const playSound = (type) => {
    try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        const now = ctx.currentTime;
        if (type === 'correct') {
            osc.frequency.setValueAtTime(300, now);
            osc.frequency.exponentialRampToValueAtTime(600, now + 0.15);
            gain.gain.setValueAtTime(0.1, now); gain.gain.linearRampToValueAtTime(0, now + 0.2);
        } else if (type === 'error') {
            osc.frequency.setValueAtTime(200, now);
            osc.frequency.linearRampToValueAtTime(100, now + 0.15);
            gain.gain.setValueAtTime(0.1, now); gain.gain.linearRampToValueAtTime(0, now + 0.2);
        }
        osc.start(); osc.stop(now + 0.2);
    } catch(e) {}
};

const MemoryGame = ({ data, onComplete }) => {
    const [cards, setCards] = useState([]);
    const [flipped, setFlipped] = useState([]);
    const [matched, setMatched] = useState([]);
    const [locked, setLocked] = useState(false);
    useEffect(() => {
        let pool = data.flatMap((it,idx) => [{id:`${idx}-pt`, content:it.pt, pairId:idx, side:'pt'}, {id:`${idx}-es`, content:it.es, pairId:idx, side:'es'}]);
        setCards([...pool].sort(() => Math.random() - 0.5));
    }, [data]);
    const handleFlip = (c) => {
        if (locked || flipped.includes(c.id) || matched.includes(c.pairId)) return;
        const nf = [...flipped, c.id]; setFlipped(nf);
        if (nf.length === 2) {
            setLocked(true);
            if (cards.find(x=>x.id===nf[0]).pairId === cards.find(x=>x.id===nf[1]).pairId) {
                playSound('correct'); setMatched([...matched, cards.find(x=>x.id===nf[0]).pairId]); setFlipped([]); setLocked(false);
            } else { playSound('error'); setTimeout(() => { setFlipped([]); setLocked(false); }, 1000); }
        }
    };
    if (matched.length === data.length && data.length > 0) return <div className="text-center slide-up text-white py-10"><h2 className="text-4xl font-black text-[#00F5D4] mb-8">Muito bem! 🎉</h2><Button onClick={() => onComplete(100)}>Próximo</Button></div>;
    return (
        <div className="grid grid-cols-2 md:grid-cols-4 gap-4 max-w-4xl mx-auto slide-up h-full overflow-y-auto pb-32 custom-scrollbar">
            {cards.map(c => {
                const isF = flipped.includes(c.id) || matched.includes(c.pairId);
                return (
                    <div key={c.id} onClick={()=>handleFlip(c)} className={`relative h-28 md:h-36 cursor-pointer transition-transform duration-500 transform-style-3d ${isF ? 'rotate-y-180' : ''}`}>
                        <div className="absolute inset-0 bg-[#7B2FFF] rounded-2xl flex items-center justify-center border-b-4 border-indigo-900 backface-hidden z-20 font-black text-2xl text-white/50">?</div>
                        <div className={`absolute inset-0 rounded-2xl flex items-center justify-center p-2 rotate-y-180 backface-hidden border-b-4 shadow-xl z-10 ${c.side==='pt'?'bg-[#FF3CAC]':'bg-[#00F5D4]'}`}><span className="font-black text-lg text-center leading-tight">{c.content}</span></div>
                    </div>
                );
            })}
        </div>
    );
};

const MatchingGame = ({ pairs, onComplete, title }) => {
    const [leftItems, setLeftItems] = useState([]);
    const [rightItems, setRightItems] = useState([]);
    const [selectedLeft, setSelectedLeft] = useState(null);
    const [matched, setMatched] = useState([]);
    useEffect(() => { setLeftItems(pairs.map(p => p.pt).sort(() => Math.random() - 0.5)); setRightItems(pairs.map(p => p.es).sort(() => Math.random() - 0.5)); }, [pairs]);
    const handleMatch = (rightWord) => { if (!selectedLeft) return; if (pairs.find(p => p.pt === selectedLeft).es === rightWord) { playSound('correct'); setMatched([...matched, selectedLeft]); setSelectedLeft(null); } else { playSound('error'); setSelectedLeft(null); } };
    useEffect(() => { if (matched.length === pairs.length && pairs.length > 0) setTimeout(onComplete, 1000); }, [matched]);
    return (
        <div className="max-w-xl mx-auto slide-up h-full overflow-y-auto pb-32 custom-scrollbar">
            <h3 className="text-center text-xl font-black text-[#00F5D4] mb-8 uppercase tracking-widest">{title}</h3>
            <div className="grid grid-cols-2 gap-4 md:gap-8 px-2">
                <div className="space-y-3">{leftItems.map(word => (<button key={word} disabled={matched.includes(word)} onClick={() => setSelectedLeft(word)} className={`w-full p-4 rounded-xl font-black border-2 transition-all ${matched.includes(word) ? 'bg-[#00F5D4] border-[#00F5D4] text-[#0F0A1E] opacity-50' : selectedLeft === word ? 'bg-[#FF3CAC] border-[#FF3CAC] text-white scale-105' : 'bg-white/5 border-white/10 text-white active:scale-95'}`}>{word}</button>))}</div>
                <div className="space-y-3">{rightItems.map(word => { const isMatched = matched.some(m => pairs.find(p => p.pt === m).es === word); return <button key={word} disabled={isMatched} onClick={() => handleMatch(word)} className={`w-full p-4 rounded-xl font-black border-2 transition-all ${isMatched ? 'bg-[#00F5D4] border-[#00F5D4] text-[#0F0A1E] opacity-50' : 'bg-white/5 border-white/10 text-white hover:bg-white/20 active:scale-95'}`}>{word}</button> })}</div>

const SentenceMatching = ({ items, onComplete }) => {

const HangmanGame = ({ words, onComplete }) => {
    const [wordIdx, setWordIdx] = useState(0);
    const [guessed, setGuessed] = useState([]);
    const [errors, setErrors] = useState(0);
    const currentData = words[wordIdx];
    const maxErrors = 15;
    const handleGuess = (letter) => {
        if (guessed.includes(letter) || errors >= maxErrors) return;
        setGuessed([...guessed, letter]);
        if (!currentData.word.includes(letter)) { setErrors(errors + 1); playSound('error'); }
        else { playSound('correct'); }
    };
    const isWon = currentData.word.split('').every(l => guessed.includes(l));
    const isLost = errors >= maxErrors;
    const reset = () => { if (wordIdx + 1 < words.length) { setWordIdx(wordIdx + 1); setGuessed([]); setErrors(0); } else { onComplete(); } };
    const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split('');
    return (
        <div className="max-w-xl mx-auto text-center slide-up flex flex-col items-center h-full overflow-y-auto pb-32 custom-scrollbar">
            <h3 className="text-xl font-black text-[#00F5D4] mb-4 uppercase">Jogo da Forca! 😵</h3>
            <div className="bg-white/5 p-4 rounded-2xl mb-6 border border-white/10 w-full"><p className="text-[#FF3CAC] font-black uppercase text-xs mb-2">Dica:</p><p className="text-white font-bold">{currentData.hint}</p></div>
            <div className="text-5xl md:text-6xl mb-8 font-mono tracking-widest text-white flex justify-center flex-wrap gap-2">
                {currentData.word.split('').map((l, i) => (<span key={i} className="border-b-4 border-[#00F5D4] min-w-[35px]">{guessed.includes(l) ? l : "_"}</span>))}
            </div>
            <div className="mb-6 flex items-center gap-3"><span className="text-sm font-black text-white/50 uppercase">Erros:</span>
                <div className="h-4 w-48 bg-white/10 rounded-full overflow-hidden border border-white/5"><div className={`h-full transition-all duration-300 ${errors > 10 ? 'bg-red-500' : 'bg-[#FF3CAC]'}`} style={{ width: `${(errors / maxErrors) * 100}%` }}></div></div>
                <span className={`font-black ${errors > 12 ? 'text-red-500' : 'text-white'}`}>{errors}/{maxErrors}</span>
            </div>
            <div className="grid grid-cols-6 sm:grid-cols-9 gap-2 mb-8">
                {alphabet.map(l => (<button key={l} disabled={guessed.includes(l) || isWon || isLost} onClick={() => handleGuess(l)} className={`p-3 rounded-xl font-black border-2 transition-all text-sm ${guessed.includes(l) ? (currentData.word.includes(l) ? 'bg-[#00F5D4] border-[#00F5D4] text-[#0F0A1E]' : 'bg-red-500 border-red-500 opacity-40') : 'bg-white/10 border-white/20 text-white hover:bg-white/20 active:scale-95'}`}>{l}</button>))}
            </div>
            {(isWon || isLost) && (<div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm"><div className="bg-[#1A1035] p-8 rounded-[40px] border-4 border-[#00F5D4] shadow-2xl text-center max-w-sm w-full animate-bounce-slow">
                <h2 className="text-3xl font-black text-white mb-4">{isWon ? "Muito bem! 🎉" : "Ops! 😢"}</h2><p className="mb-6 text-lg">Era: <span className="text-[#00F5D4] font-black">{currentData.word}</span></p>
                <Button onClick={reset} variant="accent" className="w-full py-4 text-xl">{wordIdx + 1 < words.length ? "Próxima" : "Finalizar"}</Button></div></div>)}
        </div>
    );
};

const DialogueChallenge = ({ onComplete, dialogueData = DIALOGUE_TEST, storageKey = 'margo_dialogue', db, user, appId }) => {
    const [currentStep, setCurrentStep] = useState(0);
    const [history, setHistory] = useState([]);
    const [feedback, setFeedback] = useState(null);
    const [showFull, setShowFull] = useState(false);
    const [loading, setLoading] = useState(true);
    const currentLine = dialogueData[currentStep];
    useEffect(() => {
        if (!user || !db) return;
        const loadProgress = async () => {
            const { doc, getDoc } = window.firebaseCore;
            const docRef = doc(db, 'artifacts', appId, 'users', user.uid, 'dialogueProgress', storageKey);
            try { const snap = await getDoc(docRef); if (snap.exists()) { const data = snap.data(); if (data.step !== undefined) setCurrentStep(data.step); if (data.history) setHistory(data.history); if (data.step >= dialogueData.length) setShowFull(true); } } catch(e) {}
            setLoading(false);
        };
        loadProgress();
    }, [user, db]);
    const saveDialogueState = async (step, hist) => { if (!user || !db) return; const { doc, setDoc } = window.firebaseCore; await setDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'dialogueProgress', storageKey), { step, history: hist }, { merge: true }); };
    const handleAnswer = async (opt) => {
        if (feedback) return;
        if (opt === currentLine.correct) { playSound('correct'); const filledText = currentLine.text.replace('____', opt); const newHistory = [...history, { ...currentLine, filledText }]; setFeedback({ type: 'correct', choice: opt }); setHistory(newHistory); setTimeout(async () => { const nextStep = currentStep + 1; await saveDialogueState(nextStep, newHistory); if (nextStep < dialogueData.length) { setCurrentStep(nextStep); setFeedback(null); } else { setShowFull(true); } }, 1000); } 
        else { playSound('error'); setFeedback({ type: 'wrong', choice: opt }); setTimeout(() => setFeedback(null), 800); }
    };
    if (loading) return <div className="text-center py-20 text-white/20">Carregando...</div>;
    if (showFull) return (
        <div className="max-w-2xl mx-auto slide-up bg-[#1A1035] p-8 rounded-[40px] border-2 border-[#00F5D4] shadow-2xl h-full overflow-y-auto pb-20 custom-scrollbar">
            <h2 className="text-3xl font-black text-[#00F5D4] mb-8 text-center uppercase">Diálogo Completo 🏆</h2>
            <div className="space-y-4 mb-10">{history.map((h, i) => (<div key={i} className={`flex items-start gap-3 ${h.speaker !== 'Margo' ? 'flex-row' : 'flex-row-reverse'}`}><div className="text-3xl">{h.avatar}</div><div className={`p-4 rounded-2xl ${h.speaker !== 'Margo' ? 'bg-[#7B2FFF] rounded-tl-none' : 'bg-[#FF3CAC] rounded-tr-none'}`}><p className="font-bold text-white leading-tight">{h.filledText}</p></div></div>))}</div>
            <div className="text-center"><Button onClick={() => onComplete(100)} variant="accent" className="px-12 py-4">Finalizar</Button></div>
        </div>
    );
    return (
        <div className="max-w-2xl mx-auto slide-up h-full overflow-y-auto pb-20 custom-scrollbar">
            <h2 className="text-center text-2xl font-black text-[#00F5D4] mb-8 uppercase tracking-tighter">Desafio de Diálogo</h2>
            <div className={`flex items-end gap-4 mb-8 ${currentLine.speaker === 'Margo' ? 'flex-row-reverse' : 'flex-row'}`}><div className="text-7xl animate-bounce-slow">{currentLine.avatar}</div><div className={`dialogue-bubble flex-1 shadow-2xl ${currentLine.speaker === 'Margo' ? 'after:left-auto after:right-5' : ''}`}><div className="text-[10px] font-black text-[#FF3CAC] mb-1 uppercase tracking-widest">{currentLine.speaker}</div><div className="text-2xl text-white font-black leading-tight">{currentLine.text.split('____').map((part, i, arr) => (<span key={i}>{part}{i < arr.length - 1 && <span className="text-[#00F5D4] border-b-4 border-dotted border-[#00F5D4]">_______</span>}</span>))}</div></div></div>
            <div className="grid grid-cols-1 gap-3">{currentLine.options.map((opt, idx) => (<button key={idx} onClick={() => handleAnswer(opt)} className={`option-btn ${feedback?.choice === opt ? (feedback.type === 'correct' ? 'correct' : 'wrong animate-shake') : ''}`}>{opt}</button>))}</div>
        </div>
    );
};

                                <button key={m.id} onClick={()=>setView(m.id)} className={`relative rounded-[24px] p-5 transition-all hover:scale-105 shadow-xl border-4 ${userProgress[m.id]?.completed ? 'border-[#00F5D4]' : 'border-transparent'}`} style={{backgroundColor:m.color}}>
                                    <span className="text-3xl mb-2 block">{m.emoji}</span><h2 className="text-[10px] font-black text-white uppercase leading-tight">{m.label}</h2>
                                    {userProgress[m.id]?.completed && <span className="absolute -top-2 -right-2 bg-[#00F5D4] text-[#0F0A1E] text-[10px] font-black w-6 h-6 flex items-center justify-center rounded-full border-2 border-[#0F0A1E]">✓</span>}
                                </button>
                            ))}
                        </div>
                    </div>
                )}
                
                {view==='m1a' && <MemoryGame data={CLASS_1A_GREETINGS} onComplete={() => completeLesson('m1a')}/>}
                {view==='m1b' && (<>{step === 0 && <TheoryLesson data={CLASS_1B_THEORY} title="Aula 1B" onComplete={() => setStep(1)}/>}{step === 1 && <ChoiceQuiz data={CLASS_1B_QUIZ_DATA} title="Praticando" onComplete={() => completeLesson('m1b')}/>}</>)}
                {view==='m2a' && (<>{step === 0 && <TheoryLesson data={CLASS_2A_THEORY} title="Aula 2A" onComplete={() => completeLesson('m2a')}/>}</>)}
                {view==='m2b' && <TheoryLesson data={CLASS_2B_THEORY} title="Aula 2B" onComplete={() => completeLesson('m2b')}/>}
                {view==='m3a' && <TheoryLesson data={CLASS_3A_THEORY} title="Aula 3A" onComplete={() => completeLesson('m3a')}/>}
                {view==='m3b' && (<>{step === 0 && <TheoryLesson data={CLASS_3B_THEORY} title="Aula 3B" onComplete={() => setStep(1)}/>}{step === 1 && <ChoiceQuiz data={CLASS_3B_QUIZ} title="Personalidade" onComplete={() => completeLesson('m3b')}/>}</>)}
                {view==='m_calendar' && (<>{step === 0 && <TheoryLesson data={CLASS_CALENDAR_THEORY} title="Aula 4A" onComplete={() => setStep(1)}/>}{step === 1 && <MemoryGame data={CALENDAR_MEM_DATA} onComplete={() => completeLesson('m_calendar')}/>}</>)}
                {view==='m_beach' && (<>{step === 0 && <TheoryLesson data={CLASS_BEACH_THEORY} title="Aula 4B" onComplete={() => setStep(1)}/>}{step === 1 && <MemoryGame data={BEACH_MEMORY_DATA} onComplete={() => completeLesson('m_beach')}/>}</>)}

                {/* AULA 5A - ESPAÇO E PREPOSIÇÕES */}
                {view==='m5a' && (
                    <>
                        {step === 0 && <ApartmentMap onComplete={() => setStep(1)} />}
                        {step === 1 && <MatchingGame pairs={CLASS_5A_MATCHING} title="Ligue os Pares da Casa! 🏠" onComplete={() => setStep(2)} />}
                        {step === 2 && <TheoryLesson data={CLASS_5A_PREPOSITIONS_THEORY} title="Aula 5A - Preposições" onComplete={() => setStep(3)} />}
                        {step === 3 && <ChoiceQuiz data={CLASS_5A_DETETIVE_QUIZ} title="Detetive de Objetos 🔍" onComplete={() => completeLesson('m5a')} />}
                    </>
                )}

                {/* AULA 5B - ROTINA */}
                {view==='m5b' && (
                    <>
                        {step === 0 && <TheoryLesson data={[{ title: "Minha Rotina ⏰", items: [{ n: "🌅", pt: "despertar", es: "despertarse" },{ n: "🍎", pt: "comer", es: "comer" },{ n: "🎮", pt: "jogar", es: "jugar" },{ n: "😴", pt: "dormir", es: "dormir" }], bg: "bg-[#7B2FFF]" }]} title="Aula 5B" onComplete={() => setStep(1)} />}
                        {step === 1 && <HangmanGame words={FORCA_WORDS} onComplete={() => setStep(2)} />}
                        {step === 2 && <SentenceMatching items={CLASS_5B_MATCH_SENTENCES} onComplete={() => completeLesson('m5b')} />}
                    </>
                )}

                {/* OUTROS */}
                {view==='m_roleplay_beach' && <DialogueChallenge dialogueData={DIALOGUE_BEACH_ROLEPLAY} storageKey="margo_beach_roleplay" db={db} user={user} appId={appId} onComplete={() => completeLesson('m_roleplay_beach')} />}
                {view==='m_test' && <DialogueChallenge onComplete={() => completeLesson('m_test')} db={db} user={user} appId={appId} />}
                {view==='m_fix' && <ChoiceQuiz data={COMPLEMENTARY_QUIZ_EXERCISES} title="Super Fixação" onComplete={() => completeLesson('m_fix')} />}
                {view==='m_word' && <WordSearch onComplete={() => completeLesson('m_word')} />}
                {view==='m_rev' && <ChoiceQuiz data={REVISION_QUIZ_DATA} title="Super Revisão" onComplete={() => completeLesson('m_rev')} />}
            </main>
        </div>
    );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
