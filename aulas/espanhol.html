const playSound = (type) => {
    try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        const now = ctx.currentTime;
        if (type === 'correct') {
            osc.frequency.setValueAtTime(300, now);
            osc.frequency.exponentialRampToValueAtTime(600, now + 0.15);
            gain.gain.setValueAtTime(0.1, now); gain.gain.linearRampToValueAtTime(0, now + 0.2);
        } else if (type === 'error') {
            osc.frequency.setValueAtTime(200, now);
            osc.frequency.linearRampToValueAtTime(100, now + 0.15);
            gain.gain.setValueAtTime(0.1, now); gain.gain.linearRampToValueAtTime(0, now + 0.2);
        }
        osc.start(); osc.stop(now + 0.2);
    } catch(e) {}
};

const Button = ({ children, onClick, variant='primary', className='', disabled=false }) => {

    };
    return (

            {children}
        </button>
    );
};

const FillBlanks = ({ data, onComplete }) => {
    const [index, setIndex] = useState(0);
    const [input, setInput] = useState('');
    const [feedback, setFeedback] = useState(null); 
    const [attempts, setAttempts] = useState(0);
    const [hits, setHits] = useState(0);

    const current = data[index];

    const handleCheck = () => {
        if (input.trim().toLowerCase() === current.a.toLowerCase()) {
            playSound('correct');
            setFeedback('correct');
            if (attempts === 0) setHits(h => h + 1);
            setTimeout(() => moveToNext(), 1000);
        } else {
            playSound('error');
            if (attempts === 0) {
                setFeedback('wrong-first');
                setAttempts(1);
            } else {
                setFeedback('wrong-second');
            }
        }
    };

    const moveToNext = () => {
        setFeedback(null);
        setAttempts(0);
        setInput('');
        if (index + 1 < data.length) {
            setIndex(index + 1);
        } else {
            onComplete(Math.round((hits / data.length) * 100));
        }
    };

    return (
        <div className="max-w-2xl mx-auto slide-up">
            <div className="glass-card rounded-[32px] p-10 border-white/10 shadow-2xl relative overflow-hidden">
                <div className="flex justify-between items-center mb-10 text-[10px] font-black text-slate-500 uppercase tracking-widest">
                    <span>Ejercicio {index + 1} de {data.length}</span>
                    <span className="text-blue-500">Aciertos: {hits}</span>
                </div>

                <div className="text-2xl font-bold mb-10 leading-relaxed text-white">
                    {current.q.split('____').map((p, i) => (
                        <span key={i}>
                            {p}
                            {i === 0 && (
                                <input 
                                    type="text" 
                                    value={input} 
                                    onChange={e => setInput(e.target.value)}
                                    disabled={feedback === 'correct' || feedback === 'wrong-second'}
                                    onKeyDown={e => e.key === 'Enter' && feedback === null && handleCheck()}
                                    className={`mx-2 w-48 text-center border-b-2 code-font transition-all ${feedback === 'correct' ? 'text-emerald-400 border-emerald-500' : feedback?.startsWith('wrong') ? 'text-red-400 border-red-500 animate-shake' : 'text-blue-400 border-slate-700'}`}
                                    autoFocus
                                />
                            )}
                        </span>
                    ))}
                </div>

                {feedback === 'wrong-second' && (
                    <div className="mb-8 p-4 bg-red-500/10 rounded-xl border border-red-500/20 text-red-400 animate-fade">
                        La respuesta correcta era: <span className="font-mono font-bold">{current.a}</span>
                    </div>
                )}

                <div className="flex flex-col gap-4">
                    {feedback === null && <Button onClick={handleCheck} className="w-full">Verificar</Button>}
                    {feedback === 'wrong-first' && <Button onClick={() => { setFeedback(null); setInput(''); }} variant="accent" className="w-full">Intentar de nuevo</Button>}
                    {feedback === 'wrong-second' && <Button onClick={moveToNext} className="w-full">Siguiente ➜</Button>}
                </div>

                <div className="mt-8 flex items-center gap-3 text-xs text-slate-500">
                    <div className="w-1.5 h-1.5 rounded-full bg-blue-500"></div>
                    <span>Pista: {current.h}</span>
                </div>
            </div>
        </div>
    );
};

const MemoryGame = ({ data, onComplete }) => {
    const [cards, setCards] = useState([]);
    const [flipped, setFlipped] = useState([]);
    const [matched, setMatched] = useState([]);
    const [locked, setLocked] = useState(false);
    const [finished, setFinished] = useState(false);

    useEffect(() => {
        const pool = data.flatMap((item, idx) => [{ id: `${idx}-pt`, content: item.pt, pairId: idx, type: 'pt' }, { id: `${idx}-es`, content: item.es, pairId: idx, type: 'es' }]).sort(() => Math.random() - 0.5);
        setCards(pool);
    }, [data]);

    const handleFlip = (card) => {
        if (locked || flipped.includes(card.id) || matched.includes(card.pairId)) return;
        const nf = [...flipped, card.id]; setFlipped(nf);
        if (nf.length === 2) {
            setLocked(true);
            const c1 = cards.find(c => c.id === nf[0]), c2 = cards.find(c => c.id === nf[1]);
            if (c1.pairId === c2.pairId) {
                const nm = [...matched, c1.pairId]; setMatched(nm); setFlipped([]); setLocked(false);
                if (nm.length === data.length) setFinished(true);
            } else { setTimeout(() => { setFlipped([]); setLocked(false); }, 1000); }
        }
    };

    return (
        <div className="w-full max-w-4xl mx-auto slide-up">
            <div className="grid grid-cols-2 sm:grid-cols-4 gap-4 perspective-1000">
                {cards.map(card => {
                    const isFlipped = flipped.includes(card.id) || matched.includes(card.pairId);
                    return (
                        <div key={card.id} onClick={() => handleFlip(card)} className={`relative h-24 md:h-32 cursor-pointer transition-transform duration-500 transform-style-3d ${isFlipped ? 'rotate-y-180' : ''}`}>
                            <div className="absolute inset-0 bg-slate-800 rounded-xl flex items-center justify-center border-b-4 border-slate-950 backface-hidden z-20 text-2xl">?</div>
                            <div className={`absolute inset-0 rounded-xl flex items-center justify-center p-2 text-center rotate-y-180 backface-hidden border-b-4 shadow-xl z-10 ${card.type === 'pt' ? 'bg-indigo-600 border-indigo-900' : 'bg-emerald-600 border-emerald-900'}`}><span className="font-bold text-sm md:text-base">{card.content}</span></div>
                        </div>
                    );
                })}
            </div>
            {finished && <div className="mt-10 text-center animate-fade"><Button onClick={() => onComplete(100)} variant="accent">Concluir Aula</Button></div>}
        </div>
    );
};

function App() {
    const [view, setView] = useState('home');
    const [step, setStep] = useState(0);
    const [user, setUser] = useState(null);
    const [db, setDb] = useState(null);
    const [progress, setProgress] = useState({});
    const [loading, setLoading] = useState(true);

    const appId = typeof __app_id !== 'undefined' ? __app_id : 'espanol-pro-v5';

    useEffect(() => {
        let unsubAuth = null;
        let unsubSnap = null;

        const init = async () => {
            try {
                const { initializeApp, getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken, getFirestore, doc, onSnapshot } = window.firebaseCore;
                
                const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null;
                if (!firebaseConfig) {
                    setLoading(false);
                    return;
                }

                const app = initializeApp(firebaseConfig);
                const auth = getAuth(app);
                const firestore = getFirestore(app);
                setDb(firestore);

                const token = typeof __initial_auth_token !== 'undefined' && __initial_auth_token ? __initial_auth_token : null;
                if (token) {
                    await signInWithCustomToken(auth, token).catch(() => signInAnonymously(auth));
                } else {
                    await signInAnonymously(auth);
                }

                unsubAuth = onAuthStateChanged(auth, (u) => {
                    setUser(u);
                    if (u) {
                        const pRef = doc(firestore, 'artifacts', appId, 'users', u.uid, 'data', 'progress');
                        unsubSnap = onSnapshot(pRef, (snap) => {
                            if (snap.exists()) setProgress(snap.data());
                            setLoading(false);
                        }, (err) => {
                            setLoading(false);
                        });
                    } else {
                        setLoading(false);
                    }
                });
            } catch (err) {
                console.error("Firebase Init Error:", err);
                setLoading(false);
            }
        };

        init();
        return () => {
            if (unsubAuth) unsubAuth();
            if (unsubSnap) unsubSnap();
        };
    }, []);

    const saveResult = async (lessonId, score) => {
        if (!user || !db) return;
        const { doc, setDoc } = window.firebaseCore;
        const newProgress = { ...progress, [lessonId]: { completed: true, score } };
        setProgress(newProgress);
        await setDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'data', 'progress'), newProgress, { merge: true });
        setView('home'); setStep(0);
    };

    const ProgressReport = ({ userProgress, onBack }) => {
        const curriculum = [
            { id: 'm1a', name: 'Aula 1A: Fundamentos & Fonética', emoji: '💜' },
            { id: 'm1b', name: 'Aula 1B: Pasado & Datos', emoji: '📊' },
            { id: 'm2a', name: 'Aula 2A: Verbos Esenciales', emoji: '⚡' }
        ];
        const completed = curriculum.filter(c => userProgress[c.id]?.completed);
        const avg = completed.length > 0 ? Math.round(completed.reduce((a,b) => a + (userProgress[b.id]?.score || 0), 0) / completed.length) : 0;
        return (
            <div className="max-w-3xl mx-auto slide-up">
                <div className="glass-card rounded-[32px] p-10 border-white/10 shadow-2xl">
                    <div className="flex justify-between items-center mb-10"><h2 className="text-3xl font-black text-white">Boletín de Progreso</h2><div className="text-right"><div className="text-4xl font-black text-emerald-400">{avg}</div><div className="text-[10px] text-slate-500 font-bold uppercase">Promedio</div></div></div>
                    <div className="space-y-4 text-white">{curriculum.map(lesson => (<div key={lesson.id} className={`flex items-center gap-4 p-5 rounded-2xl border transition-all ${lesson.locked ? 'opacity-30 border-dashed border-white/5' : 'bg-white/5 border-white/10'}`}><div className="text-3xl">{lesson.emoji}</div><div className="flex-1"><div className="text-sm font-bold text-white">{lesson.name}</div>{userProgress[lesson.id]?.completed && <div className="text-[10px] text-emerald-500 font-black">✓ COMPLETADO</div>}</div>{userProgress[lesson.id]?.score !== undefined && <div className="font-black text-xl text-blue-400">{userProgress[lesson.id].score}</div>}</div>))}</div>
                    <div className="mt-10 text-center"><Button onClick={onBack} variant="ghost">Volver</Button></div>
                </div>
            </div>
        );
    };

    if (loading) return <div className="h-screen flex items-center justify-center bg-[#020617] text-blue-500 font-mono text-xs animate-pulse tracking-widest uppercase">Cargando Dashboard...</div>;

    return (
        <div className="min-h-screen">
            <header className="px-6 py-4 border-b border-white/5 flex justify-between items-center sticky top-0 bg-[#020617]/90 backdrop-blur-md z-50">
                <div onClick={() => {setView('home'); setStep(0);}} className="flex items-center gap-3 cursor-pointer">
                    <div className="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center font-black">E</div>
                    <h1 className="text-lg font-black tracking-tight text-white uppercase">Español <span className="text-blue-500">Pro</span></h1>
                </div>
                <div className="flex gap-4">
                    {view === 'home' ? <Button onClick={() => setView('report')} variant="ghost" className="text-xs py-2 px-4">📊 Boletín</Button> : <Button onClick={() => {setView('home'); setStep(0);}} variant="ghost" className="text-xs py-2 px-4">Volver</Button>}
                </div>
            </header>

            <main className="px-4 py-12">
                {view === 'home' && (
                    <div className="text-center slide-up min-h-[70vh] flex flex-col justify-center">
                        <h2 className="text-xs font-mono text-blue-400 uppercase tracking-[0.3em] mb-4">Inmersión Profesional</h2>
                        <h1 className="text-4xl md:text-6xl font-black mb-12 text-white">Hola, ¿qué tal hoy? 👋</h1>
                        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 max-w-4xl mx-auto w-full">
                            {[
                                { id: 'm1a', title: 'Aula 1A: Fundamentos', emoji: '💜', color: 'from-indigo-600 to-indigo-800' },
                                { id: 'm1b', title: 'Aula 1B: Profesional', emoji: '📊', color: 'from-blue-600 to-blue-800' },
                                { id: 'm2a', title: 'Aula 2A: Verbos Esenciales', emoji: '⚡', color: 'from-purple-600 to-purple-800' }
                            ].map(m => (
                                <button key={m.id} disabled={m.locked} onClick={() => setView(m.id)} className={`relative overflow-hidden p-8 rounded-[32px] text-left transition-all hover:scale-[1.03] group ${m.locked ? 'opacity-40 cursor-not-allowed' : `bg-gradient-to-br ${m.color} shadow-xl`}`}>
                                    <div className="text-4xl mb-4 group-hover:animate-bounce">{m.emoji}</div>
                                    <h3 className="font-bold text-xl mb-1 text-white">{m.title}</h3>
                                    {progress[m.id]?.completed ? <div className="text-xs font-black text-emerald-400 mt-2">✓ COMPLETADO ({progress[m.id].score})</div> : <div className="text-xs font-bold text-white/50 mt-2">Iniciar →</div>}
                                </button>
                            ))}
                        </div>
                    </div>
                )}

                {view === 'report' && <ProgressReport userProgress={progress} onBack={() => setView('home')} />}

                {view === 'm1a' && (
                    <>
                        {step === 0 && <TheoryLesson data={CLASS_1A_THEORY} title="Aula 1A: Fundamentos" onComplete={() => setStep(1)} />}
                        {step === 1 && <MemoryGame data={CLASS_1A_EXERCISES} onComplete={(s) => saveResult('m1a', s)} />}
                    </>
                )}

                {view === 'm1b' && (
                    <>
                        {step === 0 && <TheoryLesson data={CLASS_1B_THEORY} title="Aula 1B: Profesional" onComplete={() => setStep(1)} />}
                        {step === 1 && <FillBlanks data={CLASS_1B_EXERCISES} onComplete={(s) => saveResult('m1b', s)} />}
                    </>
                )}

                {view === 'm2a' && (
                    <>
                        {step === 0 && <TheoryLesson data={CLASS_2A_THEORY} title="Aula 2A: Verbos Esenciales" onComplete={() => setStep(1)} />}
                        {step === 1 && <FillBlanks data={CLASS_2A_EXERCISES} onComplete={(s) => saveResult('m2a', s)} />}
                    </>
                )}
            </main>
        </div>
    );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
