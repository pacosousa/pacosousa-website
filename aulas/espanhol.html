<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Español Pro | Data & Business Edition</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        window.firebaseCore = { initializeApp, getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken, getFirestore, doc, getDoc, setDoc, updateDoc, collection, onSnapshot };
    </script>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #020617; color: #F8FAFC; }
        .code-font { font-family: 'JetBrains Mono', monospace; }
        .glass-card { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.05); }
        input[type="text"] { background: #1E293B; border: 1px solid #334155; transition: all 0.2s; }
        input[type="text"]:focus { border-color: #3b82f6; outline: none; box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2); }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade { animation: fadeIn 0.4s ease-out forwards; }
    </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useMemo } = React;

// ─── CONTEÚDO DA AULA ────────────────────────────────────────────────────────
const EXERCISES = [
    { q: "Hoy yo ____ (revisar) los logs del servidor.", a: "he revisado", h: "Ação concluída hoje: He + revisado", trans: "Hoje eu revisei os logs do servidor." },
    { q: "¿Tú ____ (limpiar) ya la base de datos?", a: "has limpiado", h: "Pergunta sobre hoje: Has + limpiado", trans: "Você já limpou o banco de dados?" },
    { q: "Nosotros ____ (encontrar) un bug crítico en el dashboard.", a: "hemos encontrado", h: "Nós encontramos: Hemos + encontrado", trans: "Nós encontramos um bug crítico no dashboard." },
    { q: "Esta tarde el equipo ____ (enviar) los insights a Madrid.", a: "ha enviado", h: "A equipe (singular): Ha + enviado", trans: "Esta tarde a equipe enviou os insights para Madri." },
    { q: "Ustedes ____ (probar) el nuevo algoritmo, ¿verdad?", a: "han probado", h: "Vocês testaram: Han + probado", trans: "Vocês testaram o novo algoritmo, certo?" },
    { q: "No puedo hablar ahora, estoy en una ____ (reunião).", a: "reunión", h: "Vocabulário: Reunión", trans: "Não posso falar agora, estou em uma reunião." },
    { q: "Dame un ____ (momento), voy a por un café.", a: "rato", h: "Falso amigo: Rato = Tempo/Instante", trans: "Me dá um tempo/instante, vou buscar um café." },
    { q: "He guardado el archivo en la ____ (pasta) de proyectos.", a: "carpeta", h: "Falso amigo: Carpeta = Pasta", trans: "Salvei o arquivo na pasta de projetos." },
    { q: "La ____ (planilha) tiene demasiadas columnas.", a: "hoja de cálculo", h: "Técnico: Hoja de cálculo", trans: "A planilha tem colunas demais." },
    { q: "He tenido un ____ (tempo curto) muy productivo hoy.", a: "rato", h: "Tempo de duração", trans: "Tive um tempo muito produtivo hoje." },
    { q: "He ____ (baixar) el dataset de producción.", a: "descargado", h: "Download = Descargar", trans: "Baixei o conjunto de dados de produção." },
    { q: "¿Has ____ (subir) los cambios al repositorio?", a: "subido", h: "Upload = Subir", trans: "Você subiu as mudanças para o repositório?" },
    { q: "He ____ (fazer) una consulta SQL compleja.", a: "hecho", h: "Irregular: Hacer -> Hecho", trans: "Fiz uma consulta SQL complexa." },
    { q: "Ya hemos ____ (ver) los resultados finales.", a: "visto", h: "Irregular: Ver -> Visto", trans: "Já vimos os resultados finais." },
    { q: "El sistema ha ____ (dar) un error inesperado.", a: "dado", h: "Verbo Dar -> Dado", trans: "O sistema deu um erro inesperado." },
    { q: "Hoy he ____ (tentar) contactar con el socio español.", a: "intentado", h: "Tentar = Intentar", trans: "Hoje tentei contatar o sócio espanhol." },
    { q: "¿Has ____ (escrever) el resumen de la semana?", a: "escrito", h: "Irregular: Escribir -> Escrito", trans: "Você escreveu o resumo da semana?" },
    { q: "He pasado un ____ (momento) largo filtrando datos.", a: "rato", h: "Duração de tempo", trans: "Passei um tempo longo filtrando dados." },
    { q: "Esta mañana el jefe ha ____ (dizer) que vamos por buen camino.", a: "dicho", h: "Irregular: Decir -> Dicho", trans: "Esta manhã o chefe disse que estamos no caminho certo." },
    { q: "En un ____ (instante) te envío el enlace de Zoom.", a: "ratito", h: "Diminutivo de Rato", trans: "Em um instantinho te envio o link do Zoom." }
];

// ─── COMPONENTES UI ──────────────────────────────────────────────────────────

const ProgressBar = ({ current, total }) => (
    <div className="w-full bg-slate-800 h-2 rounded-full overflow-hidden mb-6">
        <div className="bg-blue-500 h-full transition-all duration-700" style={{ width: `${(current / total) * 100}%` }} />
    </div>
);

// ─── APLICAÇÃO PRINCIPAL ─────────────────────────────────────────────────────

function App() {
    const [user, setUser] = useState(null);
    const [db, setDb] = useState(null);
    const [index, setIndex] = useState(0);
    const [answers, setAnswers] = useState(Array(EXERCISES.length).fill(''));
    const [feedback, setFeedback] = useState(null);
    const [loading, setLoading] = useState(true);
    const [tab, setTab] = useState('theory');

    const appId = typeof __app_id !== 'undefined' ? __app_id : 'espanol-pro-analytics';

    useEffect(() => {
        const init = async () => {
            const { initializeApp, getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged, getFirestore } = window.firebaseCore;
            
            try {
                const firebaseConfig = JSON.parse(__firebase_config);
                const app = initializeApp(firebaseConfig);
                const auth = getAuth(app);
                const firestore = getFirestore(app);
                setDb(firestore);

                const token = typeof __initial_auth_token !== 'undefined' && __initial_auth_token ? __initial_auth_token : null;
                
                if (token) {
                    await signInWithCustomToken(auth, token);
                } else {
                    await signInAnonymously(auth);
                }

                const unsubscribe = onAuthStateChanged(auth, (u) => {
                    setUser(u);
                    if (u) {
                        loadProgress(firestore, u.uid);
                    } else {
                        setLoading(false);
                    }
                });

                return () => unsubscribe();
            } catch (err) {
                console.error("Erro na inicialização:", err);
                setLoading(false);
            }
        };
        init();
    }, []);

    const loadProgress = async (firestore, uid) => {
        const { doc, getDoc } = window.firebaseCore;
        const pDoc = doc(firestore, 'artifacts', appId, 'users', uid, 'progress', 'v2');
        try {
            const snap = await getDoc(pDoc);
            if (snap.exists()) {
                const data = snap.data();
                setIndex(data.index || 0);
                setAnswers(data.answers || Array(EXERCISES.length).fill(''));
            }
        } catch (e) { 
            console.error("Erro ao carregar progresso:", e); 
        } finally {
            setLoading(false);
        }
    };

    const saveProgress = async (newIdx, newAnswers) => {
        if (!user || !db) return;
        const { doc, setDoc } = window.firebaseCore;
        const pDoc = doc(db, 'artifacts', appId, 'users', user.uid, 'progress', 'v2');
        await setDoc(pDoc, { index: newIdx, answers: newAnswers }, { merge: true });
    };

    const handleCheck = () => {
        const current = EXERCISES[index];
        const isCorrect = answers[index].trim().toLowerCase() === current.a.toLowerCase();
        
        if (isCorrect) {
            setFeedback('correct');
            setTimeout(() => {
                const n = index + 1;
                if (n < EXERCISES.length) {
                    setIndex(n);
                    setFeedback(null);
                    saveProgress(n, answers);
                } else {
                    setFeedback('done');
                }
            }, 800);
        } else {
            setFeedback('error');
            setTimeout(() => setFeedback(null), 1200);
        }
    };

    if (loading) return (
        <div className="h-screen flex flex-col items-center justify-center bg-[#020617]">
            <div className="w-10 h-10 border-4 border-blue-500 border-t-transparent rounded-full animate-spin mb-4"></div>
            <p className="text-slate-500 font-mono text-xs uppercase tracking-widest">Sincronizando Dashboard...</p>
        </div>
    );

    return (
        <div className="min-h-screen p-4 md:p-8 max-w-5xl mx-auto">
            <header className="flex flex-col md:flex-row justify-between items-center mb-10 border-b border-white/10 pb-6 gap-4">
                <div className="text-center md:text-left">
                    <h1 className="text-2xl font-black tracking-tighter text-white">ESPAÑOL <span className="text-blue-500">DATA PRO</span></h1>
                    <p className="text-slate-500 text-xs font-mono">Clase 01: Inmersión en el Trabajo</p>
                </div>
                <div className="flex bg-slate-900 p-1 rounded-lg border border-white/5">
                    {['theory', 'vocab', 'practice'].map(t => (
                        <button key={t} onClick={() => setTab(t)}
                            className={`px-4 py-2 rounded text-xs font-bold uppercase tracking-widest transition-all ${tab === t ? 'bg-blue-600 text-white shadow-lg' : 'text-slate-500 hover:text-slate-300'}`}>
                            {t === 'theory' ? 'Gramática' : t === 'vocab' ? 'Vocabulario' : 'Práctica'}
                        </button>
                    ))}
                </div>
            </header>

            <main className="animate-fade">
                {tab === 'theory' && (
                    <div className="grid gap-8">
                        <div className="glass-card rounded-2xl p-8 border-l-4 border-blue-500">
                            <h2 className="text-xl font-bold mb-6 text-blue-400">📚 El Pasado Reciente</h2>
                            <p className="text-slate-300 mb-6 leading-relaxed">
                                No espanhol, usamos o <strong>Pretérito Perfecto Compuesto</strong> para ações concluídas hoje ou recentemente. 
                                É vital para o seu dia a dia com o time da Espanha e amplamente usado em toda a LatAm.
                            </p>
                            <div className="bg-slate-900/50 p-6 rounded-xl border border-white/5">
                                <p className="text-blue-400 font-mono text-sm mb-4">// Estrutura: Haber (he, has, ha...) + Participio (-ado, -ido)</p>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4 text-sm font-mono">
                                    <div className="p-3 bg-slate-800 rounded">Yo <span className="text-emerald-400">he hablado</span></div>
                                    <div className="p-3 bg-slate-800 rounded">Tú <span className="text-emerald-400">has enviado</span></div>
                                    <div className="p-3 bg-slate-800 rounded">Él <span className="text-emerald-400">ha dicho</span></div>
                                    <div className="p-3 bg-slate-800 rounded">Nosotros <span className="text-emerald-400">hemos visto</span></div>
                                </div>
                            </div>
                        </div>
                    </div>
                )}

                {tab === 'vocab' && (
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div className="glass-card rounded-2xl p-6">
                            <h3 className="font-bold text-blue-400 mb-4 uppercase text-xs">💻 Infra & Data</h3>
                            <ul className="space-y-2 text-sm">
                                <li className="flex justify-between border-b border-white/5 pb-2"><span>Hoja de cálculo</span> <span className="text-slate-500">Planilha</span></li>
                                <li className="flex justify-between border-b border-white/5 pb-2"><span>Carpeta</span> <span className="text-slate-500">Pasta</span></li>
                                <li className="flex justify-between border-b border-white/5 pb-2"><span>Descargar/Subir</span> <span className="text-slate-500">Download/Upload</span></li>
                            </ul>
                        </div>
                        <div className="glass-card rounded-2xl p-6 bg-blue-900/10">
                            <h3 className="font-bold text-indigo-400 mb-4 uppercase text-xs">⏳ El Rato (Falso Amigo)</h3>
                            <p className="text-xs text-slate-400 mb-4">Lembre-se: "Rato" é tempo, não o animal!</p>
                            <ul className="space-y-2 text-sm">
                                <li className="flex justify-between border-b border-white/5 pb-2"><span>Un rato</span> <span className="text-slate-500">Um tempo</span></li>
                                <li className="flex justify-between border-b border-white/5 pb-2"><span>Un ratito</span> <span className="text-slate-500">Um instantinho</span></li>
                            </ul>
                        </div>
                    </div>
                )}

                {tab === 'practice' && (
                    <div className="max-w-2xl mx-auto">
                        <ProgressBar current={index} total={EXERCISES.length} />
                        {feedback === 'done' || index >= EXERCISES.length ? (
                            <div className="glass-card rounded-3xl p-12 text-center shadow-2xl">
                                <div className="text-5xl mb-6">🚀</div>
                                <h2 className="text-3xl font-bold mb-4 text-blue-400">¡Nivel Superado!</h2>
                                <p className="text-slate-400 mb-8">Has completado los ejercicios. ¡Buen trabajo!</p>
                                <button onClick={() => {setIndex(0); setFeedback(null);}} className="bg-blue-600 px-8 py-3 rounded-xl font-bold">Reiniciar</button>
                            </div>
                        ) : (
                            <div className="glass-card rounded-3xl p-8 md:p-12 shadow-2xl relative overflow-hidden">
                                <div className="mb-10">
                                    <h3 className="text-2xl font-semibold leading-relaxed text-white">
                                        {EXERCISES[index].q.split('____').map((p, i) => (
                                            <span key={i}>{p}{i === 0 && (
                                                <input type="text" value={answers[index]}
                                                    onChange={e => { const n = [...answers]; n[index] = e.target.value; setAnswers(n); }}
                                                    onKeyDown={e => e.key === 'Enter' && handleCheck()}
                                                    className={`mx-2 w-44 md:w-56 text-center border-b-2 py-1 code-font font-bold transition-all bg-transparent ${feedback === 'correct' ? 'text-emerald-400 border-emerald-500' : feedback === 'error' ? 'text-red-400 border-red-500' : 'text-blue-300 border-slate-700'}`}
                                                    placeholder="..." autoFocus />
                                            )}</span>
                                        ))}
                                    </h3>
                                    <p className="mt-4 text-slate-500 italic text-sm">"{EXERCISES[index].trans}"</p>
                                </div>
                                <button onClick={handleCheck} className={`mt-8 w-full py-4 rounded-xl font-bold transition-all ${feedback === 'correct' ? 'bg-emerald-600' : feedback === 'error' ? 'bg-red-600' : 'bg-blue-600'}`}>
                                    {feedback === 'correct' ? '¡Correcto!' : feedback === 'error' ? 'Intenta de nuevo' : 'Verificar'}
                                </button>
                            </div>
                        )}
                    </div>
                )}
            </main>
            <footer className="mt-16 text-center text-slate-600 font-mono text-[10px] uppercase tracking-widest pb-10">
                Data Science Professional Spanish | V2.1 | Persistência Corrigida
            </footer>
        </div>
    );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
