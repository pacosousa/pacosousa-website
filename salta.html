        const translations = {
            'pt': {
                'main_title': 'Salta, la linda',
                'author_line': 'Paco Sousa • 15 min de leitura • Escrito em 11/01/2026',
                'diary_date': 'Salta, Argentina. 18 de abril de 2023.',
                'category_tag': 'Argentina',
                'p1': 'Depois de todo o <a href="./onibus-quebrado-atacama" class="text-[#FF3366] hover:underline">perrengue para chegar a Salta</a>, vindo do <a href="./o-deserto-do-atacama" class="text-[#FF3366] hover:underline">Deserto do Atacama</a> no dia anterior, me permiti acordar um pouco mais tarde. Não muito. O café da manhã estava incluso e eu não ia desperdiçar esse pequeno luxo.',
                'p2': 'Eu teria apenas um dia e meio para conhecer a cidade. No dia seguinte, seguiria viagem rumo a San Miguel de Tucumán. Enquanto tomava café, fui organizando o roteiro ali mesmo, na base do tempo disponível e da curiosidade.',
                'p3': 'Antes de sair para explorar Salta, precisei resolver uma questão básica: dinheiro. Olhando no mapa, encontrei um Carrefour relativamente perto que tinha uma unidade da Western Union. Eu já havia feito a transferência na noite anterior, então foi só sacar e sair de lá com um bolo considerável de pesos argentinos, algo que se tornaria tradição ao longo daquele ano. Para quem viaja pela Argentina, a Western Union costuma ser a solução mais prática para lidar com o câmbio paralelo.',
                'p4': 'Com isso resolvido, finalmente comecei a conhecer a cidade.',
                'h2_1': 'Salta, no norte da Argentina',
                'p5': 'Salta é a capital da província de mesmo nome e fica no norte da Argentina, cercada por montanhas e paisagens que já entregam bastante do que é o noroeste do país. Apesar de ser capital, tem um ritmo tranquilo, arquitetura colonial bem preservada e uma sensação constante de que tudo acontece sem pressa.',
                'h2_2': 'O plano que não aconteceu: o Tren a las Nubes',
                'p6': 'Logo no início, descobri que o passeio que eu mais queria fazer não estava disponível: o <a href="https://www.argentina.gob.ar/jefatura/turismo/viaja-por-argentina/viajar-las-nubes-en-tren" target="_blank" rel="noopener noreferrer" class="text-[#75AADB] hover:underline">Tren a las Nubes</a>, um dos passeios mais famosos da Argentina. O trem cruza viadutos a mais de 4.000 metros de altitude e costuma ser vendido como uma experiência única.',
                'p7': 'O problema era o preço. Pelo site oficial, só aceitavam cartão, e na época o valor já estava inflado pela diferença entre o câmbio oficial e o paralelo. Deixei para tentar comprar pessoalmente, mas nos pontos oficiais já estava esgotado. Nas agências, custava praticamente a mesma coisa.',
                'p8': 'Depois de insistir um pouco além do razoável, aceitei que não fazia sentido seguir atrás disso. Ajustei o roteiro e segui com o que Salta oferecia ali, no nível da rua.',
                'h2_3': 'Subida ao Cerro San Bernardo',
                'p9': 'Decidi explorar a cidade a pé. Saí do microcentro em direção à estação do teleférico que leva ao Cerro San Bernardo. Era uma terça-feira de abril e não havia praticamente fila.',
                'p10': 'Não lembro exatamente quanto paguei na época, mas o valor atualizado gira em torno de ARS 25.000, algo próximo de R$ 90,00 considerando o câmbio de janeiro de 2026.',
                'p11': 'A subida foi especial. Era a minha primeira vez em um teleférico desse tipo, com cabines pequenas que não param totalmente. A vista vai se abrindo aos poucos, sem impacto, sem susto.',
                'p12': 'Diferente de Santiago, no Chile, que mistura prédios altos com montanhas, Salta mantém um perfil baixo, colonial, com a Cordilheira dos Andes ao fundo.',
                'p13': 'Lá em cima, sentei numa cafeteria e fiquei apenas olhando a cidade. Sem pressa nenhuma.',
                'h2_4': 'Caminhada pelo centro histórico',
                'p14': 'De volta à parte baixa da cidade, já perto do horário de almoço, caminhei em direção à Plaza 9 de Julio, o centro de tudo. A ideia era simples: almoçar em algum lugar pelo caminho e depois seguir explorando.',
                'p15': 'Entrei no restaurante por um motivo nada técnico. Vi um garçom bonito e entrei. Felizmente, a comida era boa, embora eu tenha ficado alguns segundos tentando entender como começar a comer aquilo.',
                'p16': 'Depois do almoço, segui caminhando ao redor da praça, onde estão alguns dos edifícios mais importantes da cidade.',
                'sh1': 'Catedral Basílica de Salta',
                'p17': 'Imponente, rosada e impossível de ignorar. Fica de frente para a praça e é um dos cartões-postais da cidade. Vale entrar nem que seja só para sentir o contraste entre o movimento externo e o silêncio lá dentro.',
                'sh2': 'Cabildo Histórico',
                'p18': 'Do outro lado da praça, hoje funciona como museu. É um bom resumo da história colonial de Salta e do norte argentino, sem exageros.',
                'sh3': 'Museu de Arqueologia de Alta Montanha (MAAM)',
                'p19': 'Para mim, um dos pontos mais fortes da cidade. O museu abriga as famosas crianças de Llullaillaco, múmias incas encontradas a mais de 6.700 metros de altitude. Forte, impactante e essencial para entender a cultura andina.',
                'h2_5': 'Dentro do MAAM',
                'p20': 'A visita ao museu acontece em camadas. Aos poucos, o espaço vai preparando ao visitante para o que está por vir. Quando fui, apenas a múmia da menina estava exposta, e o estado de conservação impressiona. Séculos preservada pelas temperaturas extremas da montanha.',
                'p21': 'O museu trata tudo com muito respeito. Existe uma antesala inteira dedicada à preparação do visitante, contextualizando a história e deixando claro que não se trata de curiosidade, mas de memória.',
                'p22': 'É um lugar silencioso, denso e marcante.',
                'h2_6': 'A siesta e uma cidade vazia',
                'p23': 'Descobrir a siesta foi um pequeno choque cultural. Voltei ao hostel para descansar um pouco e, quando saí novamente, o centro estava completamente vazio. Lojas fechadas, ruas desertas. Por um momento, achei que fosse algum feriado esquisito.',
                'p24': 'Andando sem rumo, encontrei uma loja com uma placa explicando o horário. Havia uma pausa diária, geralmente entre 15h ou 16h até perto das 18h.',
                'p25': 'Quando saí de novo à noite, estava tudo funcionando normalmente. As lojas reabrem e seguem até 20h ou 21h. Em uma cidade quente como Salta, faz bastante sentido. Para quem trabalha, deve ser estranho. Para quem viaja, é só adaptar o ritmo.',
                'p26': 'Terminei o dia bebendo em um barzinho da região, conversando com um local. Numa terça-feira, não havia muito movimento. Talvez tenha sido melhor assim.',
                'h2_7': 'Hora de seguir viagem',
                'p27': 'No dia seguinte, aproveitei para passar em algumas lojas de lembranças. À tarde, depois do check-out, segui caminhando até a rodoviária, que é bem fácil de acessar a pé. O próximo destino era San Miguel de Tucumán, onde ficaria cerca de 15 dias na casa de um amigo e voltaria a trabalhar, agora vivendo oficialmente a vida de nômade digital.',
                'h2_8': 'Outros lugares em Salta que ficaram para outra viagem',
                'p28': 'Mesmo com pouco tempo, Salta entregou bastante. Ainda assim, alguns lugares importantes ficaram de fora e entram facilmente em um roteiro mais longo.',
                'l1_t': 'Convento San Bernardo', 'l1_d': 'Um dos edifícios mais antigos da cidade, conhecido pela fachada branca e pela porta de madeira esculpida.',
                'l2_t': 'Mercado Artesanal de Salta', 'l2_d': 'Bom lugar para conhecer o artesanato local e produtos típicos da região.',
                'l3_t': 'San Lorenzo', 'l3_d': 'Pequena localidade próxima à cidade, com trilhas, verde e clima mais fresco.',
                'l4_t': 'Museu Güemes', 'l4_d': 'Dedicado a Martín Miguel de Güemes, figura central da história argentina.',
                'l5_t': 'Cafayate e a Quebrada de las Conchas', 'l5_d': 'Bate-volta clássico, combinando paisagens impressionantes e vinícolas.',
                'l6_t': 'Cachi e o Parque Nacional Los Cardones', 'l6_d': 'Estradas cênicas, formações naturais e aquele cenário que parece infinito.',
                'l7_t': 'Salinas Grandes', 'l7_d': 'O deserto de sal branco, surreal e fotogênico, geralmente combinado com Purmamarca.',
                'related_title': 'Leia também',

                'faq_title': 'Informações Práticas (FAQ)',
                'faq_q1': 'Onde sacar dinheiro em Salta?', 'faq_a1': 'Procure a Western Union dentro do Carrefour no centro. É seguro e oferece o melhor câmbio paralelo.',
                'faq_q2': 'Quanto custa o Cerro San Bernardo?', 'faq_a2': 'O teleférico custa cerca de 25.000 pesos argentinos (ida e volta), mas você pode subir os degraus de graça se tiver disposição.',
                'faq_q3': 'É seguro caminhar sozinho?', 'faq_a3': 'Sim, Salta é uma capital muito segura no microcentro. Tome os cuidados básicos de qualquer cidade grande.',
                'faq_q4': 'A siesta acontece todos os dias?', 'faq_a4': 'Sim, de segunda a sábado. O centro praticamente para entre as 16h e as 19h. Planeje seu almoço cedo!',
                'faq_q5': 'Como se locomover em Salta?', 'faq_a5': 'O centro é totalmente caminhável. Para lugares mais distantes, os táxis são baratos e o sistema de ônibus (SAETA) funciona bem.',
                'faq_q6': 'Qual o melhor chip de celular?', 'faq_a6': 'A operadora Claro costuma ter a melhor cobertura no norte. Você pode comprar o chip em qualquer "kiosco" e ativar com o passaporte.',

            'en': {
                'main_title': 'Salta, the beautiful',
                'author_line': 'Paco Sousa • 15 min read • Written on Jan 11, 2026',
                'diary_date': 'Salta, Argentina. April 18, 2023.',
                'category_tag': 'Argentina',
                'p1': 'After all the <a href="./onibus-quebrado-atacama" class="text-[#FF3366] hover:underline">trouble to reach Salta</a>, coming from the <a href="./o-deserto-do-atacama" class="text-[#FF3366] hover:underline">Atacama Desert</a> the day before, I allowed myself to wake up a bit later. Not too late. Breakfast was included and I wasn\'t going to waste that small luxury.',
                'p2': 'I would have only a day and a half to see the city. The next day, I would continue my journey towards San Miguel de Tucumán. While having breakfast, I organized the itinerary right there, based on the available time and curiosity.',
                'p3': 'Before going out to explore Salta, I needed to resolve a basic issue: money. Looking at the map, I found a Carrefour relatively close that had a Western Union unit. I had already made the transfer the night before, so I just withdrew it and left there with a considerable pile of Argentine pesos, something that would become a tradition throughout that year. For those traveling through Argentina, Western Union is usually the most practical solution for dealing with the parallel exchange rate.',
                'p4': 'With that resolved, I finally started to get to know the city.',
                'h2_1': 'Salta, in Northern Argentina',
                'p5': 'Salta is the capital of the province of the same name and is located in northern Argentina, surrounded by mountains and landscapes that already deliver a lot of what the northwest of the country is about. Despite being a capital, it has a quiet pace, well-preserved colonial architecture, and a constant feeling that everything happens without haste.',
                'h2_2': 'The plan that didn\'t happen: the Tren a las Nubes',
                'p6': 'Right at the beginning, I discovered that the tour I most wanted to do was not available: the <a href="https://www.argentina.gob.ar/jefatura/turismo/viaja-por-argentina/viajar-las-nubes-en-tren" target="_blank" rel="noopener noreferrer" class="text-[#75AADB] hover:underline">Tren a las Nubes</a>, one of Argentina\'s most famous tours. The train crosses viaducts at more than 4,000 meters above sea level and is usually sold as a unique experience.',
                'p7': 'The problem was the price. Through the official website, they only accepted cards, and at the time the value was already inflated by the difference between the official and parallel exchange rates. I decided to try to buy it in person, but at the official points it was already sold out. At the agencies, it cost practically the same thing.',
                'p8': 'After insisting a bit beyond reasonable, I accepted that it made no sense to keep chasing it. I adjusted the itinerary and went on with what Salta offered there, at street level.',
                'h2_3': 'Climb to Cerro San Bernardo',
                'p9': 'I decided to explore the city on foot. I left the microcenter towards the cable car station that leads to Cerro San Bernardo. It was a Tuesday in April and there was practically no line.',
                'p10': 'I don\'t remember exactly how much I paid at the time, but the updated value is around ARS 25,000, something close to R$ 90.00 considering the exchange rate of January 2026.',
                'p11': 'The climb was special. It was my first time in a cable car of this type, with small cabins that don\'t stop completely. The view opens up gradually, without impact, without shock.',
                'p12': 'Unlike Santiago, Chile, which mixes high-rise buildings with mountains, Salta maintains a low, colonial profile, with the Andes Mountains in the background.',
                'p13': 'Up there, I sat in a cafeteria and just looked at the city. No rush at all.',
                'h2_4': 'Walk through the historical center',
                'p14': 'Back to the lower part of the city, already close to lunchtime, I walked towards Plaza 9 de Julio, the center of everything. The idea was simple: have lunch somewhere along the way and then keep exploring.',
                'p15': 'I entered the restaurant for a non-technical reason. I saw a handsome waiter and went in. Fortunately, the food was good, although I spent a few seconds trying to figure out how to start eating it.',
                'p16': 'After lunch, I continued walking around the square, where some of the city\'s most important buildings are located.',
                'sh1': 'Catedral Basílica de Salta',
                'p17': 'Imposing, pink, and impossible to ignore. It faces the square and is one of the city\'s postcards. It\'s worth going inside if only to feel the contrast between the external movement and the silence inside.',
                'sh2': 'Cabildo Histórico',
                'p18': 'On the other side of the square, it functions as a museum today. It is a good summary of the colonial history of Salta and northern Argentina, without exaggeration.',
                'sh3': 'Museum of High Altitude Archaeology (MAAM)',
                'p19': 'For me, one of the strongest points of the city. The museum houses the famous Llullaillaco children, Inca mummies found at more than 6,700 meters above sea level. Strong, impactful, and essential for understanding Andean culture.',
                'h2_5': 'Inside the MAAM',
                'p20': 'The visit to the museum happens in layers. Gradually, the space prepares the visitor for what is to come. When I went, only the girl\'s mummy was on display, and the state of conservation is impressive. Preserved for centuries by the extreme temperatures of the mountain.',
                'p21': 'The museum treats everything with great respect. There is an entire anteroom dedicated to preparing the visitor, contextualizing the history and making it clear that it is not about curiosity, but about memory.',
                'p22': 'It is a silent, dense, and remarkable place.',
                'h2_6': 'The siesta and an empty city',
                'p23': 'Discovering the siesta was a small cultural shock. I went back to the hostel to rest for a bit and, when I went out again, the center was completely empty. Shops closed, deserted streets. For a moment, I thought it was some weird holiday.',
                'p24': 'Walking aimlessly, I found a shop with a sign explaining the hours. There was a daily break, usually between 4 pm or 5 pm until near 6 pm or 7 pm.',
                'p25': 'When I went out again at night, everything was functioning normally. The shops reopen and stay until 8 pm or 9 pm. In a city as hot as Salta, it makes a lot of sense. For those who work, it must be strange. For those who travel, you just adapt the rhythm.',
                'p26': 'I ended the day drinking at a small bar in the region, talking to a local. On a Tuesday, there wasn\'t much movement. Maybe it was better that way.',
                'h2_7': 'Time to move on',
                'p27': 'The next day, I took the opportunity to stop at some souvenir shops. In the afternoon, after check-out, I walked to the bus station, which is quite easy to access on foot. The next destination was San Miguel de Tucumán, where I would stay for about 15 days at a friend\'s house and go back to work, now officially living the life of a digital nomad.',
                'h2_8': 'Other places in Salta left for another trip',
                'p28': 'Even with little time, Salta delivered a lot. Still, some important places were left out and easily fit into a longer itinerary.',
                'l1_t': 'Convento San Bernardo', 'l1_d': 'One of the oldest buildings in the city, known for its white facade and carved wooden door.',
                'l2_t': 'Mercado Artesanal de Salta', 'l2_d': 'Good place to get to know local crafts and typical products of the region.',
                'l3_t': 'San Lorenzo', 'l3_d': 'Small town near the city, with trails, greenery, and a cooler climate.',
                'l4_t': 'Museu Güemes', 'l4_d': 'Dedicated to Martín Miguel de Güemes, a central figure in Argentine history.',
                'l5_t': 'Cafayate and Quebrada de las Conchas', 'l5_d': 'Classic day trip, combining impressive landscapes and wineries.',
                'l6_t': 'Cachi and P.N. Los Cardones', 'l6_d': 'Scenic roads, natural formations, and that scenery that seems infinite.',
                'l7_t': 'Salinas Grandes', 'l7_d': 'The white salt desert, surreal and photogenic, usually combined with Purmamarca.',

                'faq_q1': 'How to withdraw money?', 'faq_a1': 'Western Union inside Carrefour is the best option for the parallel exchange rate.',
                'faq_q2': 'Is the cable car worth it?', 'faq_a2': 'Yes, for the panoramic view of the Andes and the city layout.',
                'faq_q3': 'What is the siesta?', 'faq_a3': 'A traditional break where shops close from 4pm to 7pm. Plan accordingly!',
                'faq_q4': 'Is Salta safe?', 'faq_a4': 'Generally yes, especially in the historic center. Just take basic precautions.',
                'faq_q5': 'How to get around?', 'faq_a5': 'The city center is walkable. For further areas, taxis are cheap and buses work well.',
                'faq_q6': 'Which SIM card to buy?', 'faq_a6': 'Claro has the best coverage in the north. You can get one at any "kiosco".',

                'footer_text': '© 2026 Paco Sousa · Diarios de un Nómada'
            }
        };

        window.changeLanguage = function(lang) {
            if (window.updateNavTranslations) window.updateNavTranslations(lang);
            const elements = document.querySelectorAll('[id]');
            elements.forEach(el => {
                const id = el.id;
                if (translations[lang] && translations[lang][id]) {
                    el.innerHTML = translations[lang][id];
                }
            });
            document.documentElement.lang = lang;
            localStorage.setItem('paco_blog_lang', lang);
        };

        document.addEventListener('DOMContentLoaded', () => {
            const savedLang = localStorage.getItem('paco_blog_lang') || 'pt';
            window.changeLanguage(savedLang);
        });
    </script>
</body>
</html>
